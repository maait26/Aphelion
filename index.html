/* ---------- tutorial: shown once on first-ever launch, re-visitable via
   the menu. Deliberately vague about specifics (no numbers, no mention of
   "boss" by name, nothing about a finale) — mechanics are taught in broad
   strokes, and the game's own discoveries stay discoveries. */
const TUTORIAL_CARDS = [
  { kick:"SIGNAL RECEIVED", title:"Drifting",
    body:"Your ship has reached the outer edge of its orbit \u2014 the point where sunlight is weakest. Systems intact. Fuel reserves thin. You are a long way from anywhere warm." },
  { kick:"SHIP SYSTEMS", title:"Holding Position",
    body:"Drag or use WASD to move \u2014 your weapon fires on its own at whatever's nearest. Standing still is rarely wise out here." },
  { kick:"SHIP SYSTEMS", title:"Adapting",
    body:"Defeated threats leave behind salvageable energy. Collect it to grow stronger \u2014 new capabilities reveal themselves the deeper you go." },
  { kick:"WARNING", title:"Not Alone",
    body:"Something out here has noticed you. It will make itself known periodically \u2014 when it does, you'll have a moment's warning. Use it." },
  { kick:"TRANSMISSION", title:"What You Leave Behind",
    body:"Even if your ship is lost, what you salvage isn't wasted. Spend it at the Shipyard between drifts to start stronger next time." },
];
function showTutorial(step){
  phase = "tutorial";
  hideHud();
  const card = TUTORIAL_CARDS[step];
  const isLast = step >= TUTORIAL_CARDS.length - 1;
  cKick.textContent = card.kick;
  cTitle.textContent = card.title;
  cBody.innerHTML = card.body +
    '<div class="menuBtns">' +
      (isLast
        ? '<button class="menuBtn" data-action="tutorial_done"><b>Begin</b><small>enter the dark</small></button>'
        : '<button class="menuBtn" data-action="tutorial_next" data-step="' + (step + 1) + '"><b>Continue</b></button>') +
      (step === 0 ? '<button class="menuBtn" data-action="tutorial_skip"><b>Skip</b><small>I\u2019ve done this before</small></button>' : '') +
    '</div>';
  cGo.textContent = "";
  cardEl.classList.add("on");
}
function tutorialFinish(){
  meta.seenTutorial = true;
  saveMeta();
  showMenu();
}

function showShipyard(){
  phase = "shipyard";
  hideHud();
  cKick.textContent = "EMBERS: " + meta.embers;
  cTitle.textContent = "Shipyard";
  cBody.innerHTML = '<div class="shopList">' +
    META_UPGRADES.map(u => {
      const tier = metaTier(u.id);
      const maxed = tier >= u.maxTier;
      const price = maxed ? null : u.cost(tier);
      const afford = !maxed && meta.embers >= price;
      return '<div class="shopRow">' +
        '<div class="shopInfo"><b>' + u.name + '</b><small>' + u.desc +
          (u.maxTier > 1 ? " \u00b7 tier " + tier + "/" + u.maxTier : (tier ? " \u00b7 owned" : "")) + '</small></div>' +
        '<button class="shopBuy" data-id="' + u.id + '"' + (maxed || !afford ? " disabled" : "") + '>' +
        (maxed ? "MAXED" : price + " \u2726") + '</button>' +
      '</div>';
    }).join("") +
    '</div>' +
    '<button class="menuBtn backBtn" data-action="back"><b>Back</b></button>';
  cGo.textContent = "";
  cardEl.classList.add("on");
}

function showLevelUpCard(){
  const entry = pendingLevelUps[0];
  const offered = entry.offers;
  cKick.textContent = entry.isSuper ? "LEVEL " + player.level + " \u00b7 MILESTONE" : "LEVEL " + player.level;
  cTitle.textContent = entry.isSuper ? (entry.offers[0] && entry.offers[0].isTrait ? "New Trait" : "New Capability") : "Upgrade Available";
  cBody.innerHTML = '<div class="upgradeBtns">' +
    offered.map((u, i) =>
      '<button class="upgradeBtn' + (entry.isSuper ? ' superUpgradeBtn' : '') + (u.isTrait ? ' traitUpgradeBtn' : '') + '" data-idx="' + i + '"><b>' + (i+1) + '. ' + u.name + '</b><small>' + u.desc + '</small></button>'
    ).join("") +
    '</div>';
  cGo.textContent = "choose one to continue \u00b7 or press 1 / 2 / 3";
  cardEl.classList.add("on");
}

function chooseUpgrade(idx){
  const entry = pendingLevelUps.shift();
  entry.offers[idx].apply(player);
  if (pendingLevelUps.length){ showLevelUpCard(); }
  else { cardEl.classList.remove("on"); phase = "playing"; }
}

function advanceCard(){
  if (!cardEl.classList.contains("on")) return;
  cardEl.classList.remove("on");
  resetGame();
  phase = "playing";
  setMusicMode("gameplay");
  showHud();
}

cardEl.addEventListener("click", e => {
  const anyBtn = e.target.closest("button");
  if (anyBtn) sfxButtonClick();
  const menuBtn = e.target.closest(".menuBtn");
  if (menuBtn){
    const action = menuBtn.dataset.action;
    if (action === "launch") advanceCard();
    else if (action === "shipyard") showShipyard();
    else if (action === "stats") showStats();
    else if (action === "handbook") showHandbook();
    else if (action === "tutorial") showTutorial(0);
    else if (action === "tutorial_next") showTutorial(parseInt(menuBtn.dataset.step, 10));
    else if (action === "tutorial_done" || action === "tutorial_skip") tutorialFinish();
    else if (action === "back") showMenu();
    else if (action === "resume"){
      cardEl.classList.remove("on");
      phase = "playing";
      setMusicMode("gameplay");
      showHud();
    }
    else if (action === "unpause") resumeFromPause();
    else if (action === "quit_run") showDeath();
    return;
  }
  const buyBtn = e.target.closest(".shopBuy");
  if (buyBtn && !buyBtn.disabled){
    if (buyMetaUpgrade(buyBtn.dataset.id)) showShipyard();
    return;
  }
  if (phase === "levelup"){
    const btn = e.target.closest(".upgradeBtn");
    if (btn) chooseUpgrade(parseInt(btn.dataset.idx, 10));
  }
});
cardEl.addEventListener("pointerover", e => {
  if (e.target.closest("button")) sfxButtonHover();
});

function grantXP(amount){
  player.xp += amount;
  while (player.xp >= player.xpToNext){
    player.xp -= player.xpToNext;
    player.level += 1;
    player.xpToNext = xpForLevel(player.level);
    queueLevelUp();
  }
}

function queueLevelUp(){
  const wantsSuper = player.level % SUPER_LEVEL_INTERVAL === 0;
  let pool = wantsSuper ? buildSuperOfferPool() : UPGRADES.slice();
  const usedSuperPool = wantsSuper && pool.length > 0;
  if (wantsSuper && pool.length === 0) pool = UPGRADES.slice();   // fully-built weapon loadout — fall back rather than offer nothing
  const offered = [];
  for (let i = 0; i < 3 && pool.length; i++){
    offered.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  pendingLevelUps.push({ offers: offered, isSuper: usedSuperPool });
  if (phase === "playing"){ phase = "levelup"; sfxLevelUp(); showLevelUpCard(); }
}

/* ---------- spawning ---------- */
function spawnOneEnemy(typeKey, x, y){
  recordDiscovery(typeKey);
  const spikes = 6 + Math.floor(Math.random() * 3);
  const jitter = [];
  for (let i = 0; i < spikes; i++) jitter.push(0.78 + Math.random() * 0.4);
  const base = ENEMY_TYPES[typeKey];
  const scale = enemyStatScale(survivalTime);   // baked in at spawn — existing enemies don't retroactively get tougher
  const hp = base.hp * scale.hp;
  enemies.push({
    x, y, type: typeKey,
    r: base.r, hp, maxHp: hp, speed: base.speed, dmg: base.dmg * scale.dmg,
    color: base.color, flashColor: base.flashColor,
    flash: 0, breathe: Math.random() * 6.283, jitter,
    shootTimer: base.shooter ? 1.5 + Math.random() : undefined,
    flank: base.pack ? Math.random() * Math.PI * 2 : undefined   // pack members each home on their own offset point, so they envelop
  });
}

function spawnSplitChild(parent){
  const spikes = 6 + Math.floor(Math.random() * 3);
  const jitter = [];
  for (let i = 0; i < spikes; i++) jitter.push(0.78 + Math.random() * 0.4);
  const hp = parent.maxHp * 0.4;
  enemies.push({
    x: parent.x + (Math.random()-0.5)*24, y: parent.y + (Math.random()-0.5)*24,
    type: parent.type, isSplitChild: true,
    r: parent.r * 0.65, hp, maxHp: hp, speed: parent.speed * 1.15, dmg: parent.dmg * 0.7,
    color: parent.color, flashColor: parent.flashColor,
    flash: 0, breathe: Math.random() * 6.283, jitter
  });
}

function spawnEnemy(){
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0){ x = -30; y = Math.random() * H; }
  else if (edge === 1){ x = W + 30; y = Math.random() * H; }
  else if (edge === 2){ x = Math.random() * W; y = -30; }
  else { x = Math.random() * W; y = H + 30; }
  const typeKey = pickEnemyType();
  const base = ENEMY_TYPES[typeKey];
  if (base.pack){
    const n = 5 + Math.floor(Math.random() * 2);   // 5-6 at once — big enough to actually read as a swarm
    for (let i = 0; i < n; i++){
      spawnOneEnemy(typeKey, x + (Math.random()-0.5)*50, y + (Math.random()-0.5)*50);
    }
    return n * 0.5;   // each swarmer costs only half a spawn-budget slot — individually weak, so the pack shouldn't starve the rest of the roster
  }
  spawnOneEnemy(typeKey, x, y);
  return 1;
}

/* ---------- boss: "Occlusion" — a slow, heavy threat with two telegraphed
   attacks (charge dash, expanding pulse) on top of ordinary contact damage.
   Reuses the enemies array / collision / pierce systems generically via
   isBoss + the same r/hp/dmg fields regular enemies use.

   From boss 2 onward, each one also carries a signature ability drawn from
   the enemy roster it's "absorbed" from the dark — cycling shield (Brute-
   flavored tankiness), split (Splitter), ranged (Sentinel). Boss 1 stays
   untouched, exactly as requested. */
function bossAbilityFor(idx){
  if (idx === 1) return "none";
  if (idx === 5) return "swarm";
  if (idx === 6) return "finale";   // Totality — unique, does not repeat
  if (idx > 6){
    const fullCycle = ["shield", "split", "ranged", "swarm"];
    return fullCycle[(idx - 7) % fullCycle.length];
  }
  const cycle = ["shield", "split", "ranged"];
  return cycle[(idx - 2) % cycle.length];
}

function lerpHex(hex1, hex2, t){
  const c1 = parseInt(hex1.slice(1), 16), c2 = parseInt(hex2.slice(1), 16);
  const r1 = (c1>>16)&255, g1 = (c1>>8)&255, b1 = c1&255;
  const r2 = (c2>>16)&255, g2 = (c2>>8)&255, b2 = c2&255;
  const r = Math.round(r1+(r2-r1)*t), g = Math.round(g1+(g2-g1)*t), b = Math.round(b1+(b2-b1)*t);
  return "#" + [r,g,b].map(v => v.toString(16).padStart(2,"0")).join("");
}
// Each boss ability visually "channels" the enemy type it conceptually
// draws from — a subtle color blend on top of the base Occlusion identity,
// not a full recolor, so bosses stay recognizably part of the same family.
const BOSS_ABILITY_TINT = { shield:"#7A4AF0", split:"#2FA88A", ranged:"#4A7AD8", swarm:"#B8D84A" };
function bossColorFor(ability){
  const base = "#2A0F45", flashBase = "#B24AF0";
  // Totality isn't a channeled variant like the others — it IS the
  // absence of light itself. Near-black base, with a stark white "corona"
  // flash: during a real total eclipse, the sun's corona briefly becomes
  // visible around the darkness — the one moment its hit-flash should
  // read as something other than violet.
  if (ability === "finale") return { color: "#0A0510", flashColor: "#F5F5FF" };
  if (!BOSS_ABILITY_TINT[ability]) return { color: base, flashColor: flashBase };
  const tint = BOSS_ABILITY_TINT[ability];
  return { color: lerpHex(base, tint, 0.35), flashColor: lerpHex(flashBase, tint, 0.35) };
}

function spawnBoss(){
  const idx = bossesSpawned + 1;
  const ability = bossAbilityFor(idx);
  if (ability !== "none") recordDiscovery("occlusion_" + ability);
  let scale = 1 + (idx - 1) * 0.9;   // steepened again from 0.7 — boss 1 still unchanged (scale=1), every later boss hits harder
  if (ability === "finale") scale *= 1.6;   // a true final challenge, not just "another repeat"
  if (idx >= 7) scale *= 2;   // post-Totality: the round felt dull otherwise - a real difficulty jump for the endless cycle
  const hp = 2100 * scale;
  const { color, flashColor } = bossColorFor(ability);
  const spikes = 8 + Math.floor(Math.random() * 3);
  const jitter = [];
  for (let i = 0; i < spikes; i++) jitter.push(0.8 + Math.random() * 0.35);
  enemies.push({
    x: W / 2, y: -60, isBoss: true, bossIndex: idx, type: "occlusion", ability,
    r: (ability === "finale" ? 40 : 34) * 1.075, hp, maxHp: hp, speed: 34, dmg: 20 * scale,
    color, flashColor,
    flash: 0, breathe: Math.random() * 6.283, jitter,
    chargeState: "idle", chargeTimer: 1.44 + Math.random() * 0.96,
    chargeTargetX: 0, chargeTargetY: 0, chargeVX: 0, chargeVY: 0,
    pulseState: "idle", pulseTimer: 2.4 + Math.random() * 1.2, pulseRadius: 0,
    shieldState: "down", shieldTimer: 3.6 + Math.random() * 1.2,
    hasSplit: false, wasSplitOrigin: false,
    shootTimer: 1.8 + Math.random() * 1.2,
    swarmTimer: 3 + Math.random() * 0.9,
    isFinale: ability === "finale", eclipseState: "idle", eclipseTimer: 3.6 + Math.random() * 1.2,
    isMiniBoss: false, splitGroup: null, arrivalTimer: 2.0
  });
}

function spawnMiniBoss(parent, splitGroup){
  const spikes = 7 + Math.floor(Math.random() * 3);
  const jitter = [];
  for (let i = 0; i < spikes; i++) jitter.push(0.8 + Math.random() * 0.35);
  const hp = parent.maxHp * 0.75;   // two of these = 150% of the original's total - Splitter's own compensation, since "more frequent abilities" doesn't apply to a one-time split event
  enemies.push({
    x: parent.x + (Math.random()-0.5)*60, y: parent.y + (Math.random()-0.5)*60,
    isBoss: true, bossIndex: parent.bossIndex, type: "occlusion", ability: "none",
    r: parent.r * 0.7, hp, maxHp: hp, speed: parent.speed * 1.1, dmg: parent.dmg * 0.8,
    color: parent.color, flashColor: parent.flashColor,
    flash: 0, breathe: Math.random() * 6.283, jitter,
    chargeState: "idle", chargeTimer: 1.6 + Math.random() * 1.2,
    chargeTargetX: 0, chargeTargetY: 0, chargeVX: 0, chargeVY: 0,
    pulseState: "idle", pulseTimer: 2.4 + Math.random() * 1.2, pulseRadius: 0,
    shieldState: "down", shieldTimer: 999,
    hasSplit: true, wasSplitOrigin: false,   // minis never re-split
    shootTimer: 999,
    isMiniBoss: true, splitGroup
  });
}

function updateBoss(en, dt){
  en.breathe += dt;
  if (en.flash > 0) en.flash -= dt;
  if (en.arrivalTimer > 0) en.arrivalTimer = Math.max(0, en.arrivalTimer - dt);

  // baseline slow drift toward the player, paused while mid-dash
  if (en.chargeState !== "dashing"){
    const dx = player.x - en.x, dy = player.y - en.y, m = Math.hypot(dx, dy) || 1;
    en.x += dx / m * en.speed * dt; en.y += dy / m * en.speed * dt;
  }

  // ordinary contact damage, same as a regular enemy
  const cdx = player.x - en.x, cdy = player.y - en.y, cm = Math.hypot(cdx, cdy) || 1;
  if (cm < PLAYER_R + en.r && player.invuln <= 0){
    damagePlayer(en.dmg, PLAYER_INVULN_ON_HIT);
  }

  // --- charge: telegraph (continuously tracking you the whole time, only
  // locking in the final direction at the very last instant - "follows
  // you more, and more closely"), then a fast dash ---
  en.chargeTimer -= dt;
  if (en.chargeState === "idle" && en.chargeTimer <= 0){
    en.chargeState = "telegraph"; en.chargeTimer = CHARGE_TELEGRAPH_DURATION;
    en.chargeTargetX = player.x; en.chargeTargetY = player.y;
  } else if (en.chargeState === "telegraph"){
    en.chargeTargetX = player.x; en.chargeTargetY = player.y;   // keep re-aiming throughout the wind-up
    if (en.chargeTimer <= 0){
      const dx = en.chargeTargetX - en.x, dy = en.chargeTargetY - en.y, m = Math.hypot(dx, dy) || 1;
      const postTotalityMult = en.bossIndex >= 7 ? 1.25 : 1;
      en.chargeVX = dx / m * 552 * postTotalityMult; en.chargeVY = dy / m * 552 * postTotalityMult;
      en.chargeState = "dashing"; en.chargeTimer = 0.4;
    }
  } else if (en.chargeState === "dashing"){
    en.x += en.chargeVX * dt; en.y += en.chargeVY * dt;
    en.x = Math.max(en.r, Math.min(W - en.r, en.x));
    en.y = Math.max(en.r, Math.min(H - en.r, en.y));
    if (en.chargeTimer <= 0){ en.chargeState = "cooldown"; en.chargeTimer = (en.bossIndex >= 7 ? 1.7/1.25 : 1.7); }
  } else if (en.chargeState === "cooldown" && en.chargeTimer <= 0){
    en.chargeState = "idle"; en.chargeTimer = (en.bossIndex >= 7 ? (1.44 + Math.random() * 0.96)/1.25 : 1.44 + Math.random() * 0.96);
  }

  // --- pulse: a slowly expanding ring that damages the player if they're
  // still within it at the moment it finishes expanding ---
  en.pulseTimer -= dt;
  if (en.pulseState === "idle" && en.pulseTimer <= 0){
    en.pulseState = "growing"; en.pulseRadius = 0;
  } else if (en.pulseState === "growing"){
    en.pulseRadius += dt * 220;
    if (en.pulseRadius >= 150){
      const pd = Math.hypot(player.x - en.x, player.y - en.y);
      if (pd <= en.pulseRadius && player.invuln <= 0){
        damagePlayer(en.dmg * 0.8, PLAYER_INVULN_ON_HIT);
      }
      en.pulseState = "idle"; en.pulseTimer = 2.4 + Math.random() * 1.2;
    }
  }

  // --- shield: periodically becomes heavily damage-resistant (checked
  // where projectile damage is applied) — a "tank" identity beyond raw HP ---
  if (en.ability === "shield"){
    en.shieldTimer -= dt;
    if (en.shieldState === "down" && en.shieldTimer <= 0){ en.shieldState = "up"; en.shieldTimer = 4; }
    else if (en.shieldState === "up" && en.shieldTimer <= 0){ en.shieldState = "down"; en.shieldTimer = 3.6 + Math.random() * 1.2; }
  }

  // --- split: at half HP, breaks into two mini-bosses instead of dying
  // outright — a mid-fight twist, not an on-death bonus ---
  if (en.ability === "split" && !en.hasSplit && en.hp > 0 && en.hp <= en.maxHp * 0.5){
    en.hasSplit = true;
    const splitGroup = { remaining: 2, bossIndex: en.bossIndex };
    spawnMiniBoss(en, splitGroup);
    spawnMiniBoss(en, splitGroup);
    spawnParticles(en.x, en.y, en.color, 40);
    rings.push({ x: en.x, y: en.y, r: en.r, color: en.color, life: 0.6, maxLife: 0.6 });
    en.wasSplitOrigin = true;
    en.hp = 0;   // marked for cleanup; the dead-enemy handler skips the normal defeat reward for this flag
  }

  // --- ranged: fires the same enemyProjectiles mechanism Sentinel uses.
  // Now an 8-projectile spread per shot instead of a single projectile -
  // my interpretation of "8 in total," flagged for confirmation. ---
  if (en.ability === "ranged"){
    en.shootTimer -= dt;
    if (en.shootTimer <= 0){
      en.shootTimer = 1.8 + Math.random() * 0.6;
      const baseAngle = Math.atan2(player.y - en.y, player.x - en.x);
      const spreadCount = 8, spreadArc = 0.9;   // ~51 degrees total spread across all 8
      for (let i = 0; i < spreadCount; i++){
        const a = baseAngle + (i - (spreadCount-1)/2) * (spreadArc / (spreadCount-1));
        enemyProjectiles.push({
          x: en.x, y: en.y, vx: Math.cos(a)*200, vy: Math.sin(a)*200,
          dmg: en.dmg * 0.6, life: 5, trailX: en.x, trailY: en.y
        });
      }
    }
  }

  // --- swarm: periodically calls in a burst of Swarmer fragments, same
  // "many at once" identity as the regular enemy it channels ---
  if (en.ability === "swarm"){
    en.swarmTimer -= dt;
    if (en.swarmTimer <= 0){
      en.swarmTimer = 3 + Math.random() * 0.9;
      for (let i = 0; i < 8; i++){
        const a = (i / 8) * Math.PI * 2 + Math.random() * 0.4;   // a ring bursting outward, not a blob
        spawnOneEnemy("swarmer", en.x + Math.cos(a) * (en.r + 24), en.y + Math.sin(a) * (en.r + 24));
      }
    }
  }

  // --- finale (Totality): Eclipse — periodically plunges the screen into
  // heavy darkness for a few seconds. State is read by render() to apply
  // the darkening; no damage of its own, the point is fighting half-blind ---
  if (en.isFinale){
    en.eclipseTimer -= dt;
    if (en.eclipseState === "idle" && en.eclipseTimer <= 0){
      en.eclipseState = "active"; en.eclipseTimer = 3.5;
    } else if (en.eclipseState === "active" && en.eclipseTimer <= 0){
      en.eclipseState = "idle"; en.eclipseTimer = 4.8 + Math.random() * 1.2;
    }
  }
}

function spawnInterval(t){
  // escalates from ~1 every 1.8s down to a floor of ~1 every 0.35s
  return Math.max(0.35, 1.8 - t * 0.03);
}

/* ---------- combat ---------- */
function nearestEnemy(x, y){
  let best = null, bestD = Infinity;
  for (const en of enemies){
    const d = Math.hypot(en.x - x, en.y - y);
    if (d < bestD){ bestD = d; best = en; }
  }
  return best ? { en: best, dist: bestD } : null;
}

// The shield Occlusion's resistance applies to ALL player damage sources,
// not just cannon shots — otherwise a beam/satellite/nova build simply
// ignores the boss's whole identity.
function shieldDmgMult(en){
  return (en.isBoss && en.shieldState === "up") ? 0.3 : 1;
}

function updateWeapons(dt){
  // Satellites — drones orbit and damage anything they touch, with a
  // per-enemy cooldown so a stationary enemy inside the ring isn't melted instantly
  if (player.satellites){
    const s = player.satellites;
    player.satAngle += s.speedMult * 2.2 * dt;
    for (let i = 0; i < s.count; i++){
      const a = player.satAngle + (i / s.count) * Math.PI * 2;
      const sx = player.x + Math.cos(a) * s.radius, sy = player.y + Math.sin(a) * s.radius;
      for (const en of enemies){
        const d = Math.hypot(en.x - sx, en.y - sy);
        if (d < en.r + 8 && survivalTime - (en.satHitAt === undefined ? -999 : en.satHitAt) >= 0.3){
          en.hp -= 8 * s.dmgMult * shieldDmgMult(en);
          en.flash = 0.12;
          en.satHitAt = survivalTime;
        }
      }
    }
  }

  // Nova — periodic AOE burst centered on the player
  if (player.nova){
    const nv = player.nova;
    nv.timer -= dt;
    if (nv.timer <= 0){
      nv.timer = 3.5 * nv.cooldownMult;
      sfxWeaponFire(0.35);
      for (const en of enemies){
        if (Math.hypot(en.x - player.x, en.y - player.y) < nv.radius + en.r){
          en.hp -= 25 * nv.dmgMult * shieldDmgMult(en); en.flash = 0.12;
        }
      }
      rings.push({ x: player.x, y: player.y, r: nv.radius, color: "#4AD9F0", life: 0.35, maxLife: 0.35 });
      shake = Math.min(1, shake + 0.3);
    }
  }

  // Seekers — periodically launch homing shots (steering handled in the
  // main projectile-movement loop via the `homing` flag)
  if (player.seekers){
    const sk = player.seekers;
    sk.timer -= dt;
    if (sk.timer <= 0){
      sk.timer = 1.2 * sk.cooldownMult;
      sfxWeaponFire(0.7);
      for (let i = 0; i < sk.count; i++){
        const a = Math.random() * Math.PI * 2;
        projectiles.push({
          x: player.x, y: player.y,
          vx: Math.cos(a) * 260, vy: Math.sin(a) * 260,
          life: 3, trailX: player.x, trailY: player.y,
          dmg: 20 * sk.dmgMult, pierceLeft: 0, hitSet: new Set(),
          homing: true, turnRate: 3.5
        });
      }
    }
  }

  // Beam — continuous lock-on, deals damage every frame rather than in
  // discrete hits; re-acquires a target automatically when the current
  // one dies or leaves range
  if (player.beam){
    const bm = player.beam;
    const range = 380 * bm.rangeMult;
    if (bm.target && (bm.target.hp <= 0 || Math.hypot(bm.target.x - player.x, bm.target.y - player.y) > range)){
      bm.target = null;
    }
    if (!bm.target){
      const nb = nearestEnemy(player.x, player.y);
      if (nb && nb.dist <= range) bm.target = nb.en;
    }
    if (bm.target){
      bm.target.hp -= 18 * bm.dmgMult * dt * shieldDmgMult(bm.target);
      bm.target.flash = 0.12;
      if (bm.pierce){
        let second = null, bestD = Infinity;
        for (const en of enemies){
          if (en === bm.target || en.hp <= 0) continue;
          const d = Math.hypot(en.x - bm.target.x, en.y - bm.target.y);
          if (d < 80 && d < bestD){ bestD = d; second = en; }
        }
        if (second){ second.hp -= 18 * bm.dmgMult * dt * 0.6 * shieldDmgMult(second); second.flash = 0.12; }
      }
    }
  }
}

function fireWeapon(){
  const target = nearestEnemy(player.x, player.y);
  const range = WEAPON_RANGE * player.rangeMult;
  if (!target || target.dist > range) return;
  sfxWeaponFire(1);
  const baseAngle = Math.atan2(target.en.y - player.y, target.en.x - player.x);
  const n = player.projectileCount;
  const spread = n > 1 ? 0.22 : 0;
  for (let i = 0; i < n; i++){
    const a = baseAngle + (i - (n - 1) / 2) * spread;
    projectiles.push({
      x: player.x, y: player.y,
      vx: Math.cos(a) * WEAPON_SPEED, vy: Math.sin(a) * WEAPON_SPEED,
      life: 1.2, trailX: player.x, trailY: player.y,
      dmg: WEAPON_DAMAGE * player.dmgMult, pierceLeft: player.pierce, hitSet: new Set()
    });
  }
}

function spawnOrb(x, y, value){
  // Soft cap: past ~180 orbs on the field, fold the new one into the
  // nearest existing orb instead of pushing another — same total XP,
  // less visual clutter and per-frame work in long kiting runs.
  if (orbs.length >= 180){
    let best = null, bestD = Infinity;
    for (const o of orbs){
      const d = (o.x - x) * (o.x - x) + (o.y - y) * (o.y - y);
      if (d < bestD){ bestD = d; best = o; }
    }
    if (best){ best.value += value || 1; return; }
  }
  orbs.push({ x, y, value: value || 1 });
}

function spawnParticles(x, y, color, n){
  if (REDUCE_MOTION) return;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 90;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.4 + Math.random()*0.3, color });
  }
}

function damagePlayer(amount, invulnDuration){
  player.hp -= amount * (1 - player.contactDmgReduction);
  player.invuln = invulnDuration;
  shake = Math.min(1, shake + 0.55);
  sfxPlayerDamage();
  spawnParticles(player.x, player.y, "#F04A6A", 10);
  if (player.hp <= 0){
    if (player.revives > 0){
      player.revives -= 1;
      player.hp = Math.max(1, maxHP() * 0.5);
      player.invuln = 2.0;
      shake = Math.min(1, shake + 1);
      spawnParticles(player.x, player.y, "#4AD9F0", 24);
    } else {
      player.hp = 0; phase = "dead"; setTimeout(showDeath, 400);
    }
  }
}

/* ---------- update ---------- */
function update(dt){
  survivalTime += dt;
  updateMusicDimming();

  // player movement
  const mv = moveVector();
  player.vx = mv.x * PLAYER_SPEED * player.speedMult; player.vy = mv.y * PLAYER_SPEED * player.speedMult;
  player.x = Math.max(PLAYER_R, Math.min(W - PLAYER_R, player.x + player.vx * dt));
  player.y = Math.max(PLAYER_R, Math.min(H - PLAYER_R, player.y + player.vy * dt));
  if (mv.x || mv.y) player.facing = Math.atan2(mv.y, mv.x);
  if (player.invuln > 0) player.invuln -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 6);

  // engine trail — a soft cyan glow while actively moving, giving the ship
  // a sense of propulsion. Distinct from Overdrive's trait-specific gold
  // speed-lines (which only appear at high speed) — this is a base effect
  // every build gets, present at any real movement speed.
  const moveSpeed = Math.hypot(player.vx, player.vy);
  player.engineTrailTimer -= dt;
  if (moveSpeed > 20 && player.engineTrailTimer <= 0){
    player.engineTrailTimer = 0.05;
    const rearX = player.x - Math.cos(player.facing) * PLAYER_R * 0.9;
    const rearY = player.y - Math.sin(player.facing) * PLAYER_R * 0.9;
    particles.push({
      x: rearX + (Math.random()-0.5)*4, y: rearY + (Math.random()-0.5)*4,
      vx: -Math.cos(player.facing)*30 + (Math.random()-0.5)*20,
      vy: -Math.sin(player.facing)*30 + (Math.random()-0.5)*20,
      life: 0.25 + Math.random()*0.15, color: "#4AD9F0"
    });
  }

  // regen, clamped to current max (base + upgrades)
  if (player.regenPerSec > 0 && player.hp > 0){
    player.hp = Math.min(maxHP(), player.hp + player.regenPerSec * dt);
  }

  // spawning
  lastSpawn += dt;
  const bossActive = enemies.some(e => e.isBoss);
  const need = spawnInterval(survivalTime) * (bossActive ? 1.54 : 1);   // ~35% fewer regular spawns while a boss fight is on, so it reads as an actual boss fight
  if (lastSpawn >= need){
    const spawnedCount = spawnEnemy();   // packs (Swarmer) return >1 — they must "use up" proportionally more budget
    lastSpawn = -(spawnedCount - 1) * need;
  }
  checkTimeUnlock();   // fallback enemy-type unlock, in case no boss has been defeated yet

  // boss scheduling: a brief warning, then the boss itself, then the next
  // one is scheduled further out — bosses are an ADDED threat, not a gate;
  // regular spawning continues normally alongside them
  if (!bossWarningShown && survivalTime >= nextBossTime - 3){
    bossWarningShown = true;
    const upcomingAbility = bossAbilityFor(bossesSpawned + 1);
    let warnText = upcomingAbility === "finale" ? "THE LIGHT GOES OUT" : "A SHADOW GATHERS";
    if (upcomingAbility !== "none" && !player.seenAbilities.includes(upcomingAbility)){
      warnText += " \u2014 " + BOSS_ABILITY_HINT[upcomingAbility];
      player.seenAbilities.push(upcomingAbility);
    }
    bossBanner = { text: warnText, life: 2.6 };
    sfxBossWarning();
    duckMusicForWarning();
  }
  if (survivalTime >= nextBossTime && !enemies.some(e => e.isBoss)){
    spawnBoss();
    sfxBossSpawn();
    swellMusicForBoss();
    bossesSpawned += 1;
    nextBossTime += 150;
    bossWarningShown = false;
  }
  if (bossBanner){
    bossBanner.life -= dt;
    if (bossBanner.life <= 0) bossBanner = null;
  }

  // lore fragments — rare, quiet, drip-fed as the run goes deeper. Skipped
  // entirely while a boss banner is active so the two never overlap.
  if (loreShownIndex < LORE_FRAGMENTS.length && survivalTime >= LORE_FRAGMENTS[loreShownIndex].t && !bossBanner){
    loreBanner = { text: LORE_FRAGMENTS[loreShownIndex].text, life: 4.5 };
    loreShownIndex++;
  }
  if (loreBanner){
    loreBanner.life -= dt;
    if (loreBanner.life <= 0) loreBanner = null;
  }

  // weapon
  spawnGunTimer += dt;
  if (spawnGunTimer >= WEAPON_COOLDOWN * player.cooldownMult){ spawnGunTimer = 0; fireWeapon(); }
  updateWeapons(dt);

  // enemies: home toward player (bosses have their own movement/attack
  // state machine, handled separately below), check contact
  for (const en of enemies){
    if (en.isBoss){ updateBoss(en, dt); continue; }
    const pdx = player.x - en.x, pdy = player.y - en.y;
    const pm = Math.hypot(pdx, pdy) || 1;   // true distance to the player (contact check below uses this)
    // pack members (swarmers) each steer toward a personal offset point
    // around the player until they're close, so a pack fans out and
    // surrounds rather than trailing in single file
    let tx = player.x, ty = player.y;
    if (en.flank !== undefined && pm > 70){
      tx += Math.cos(en.flank) * 46; ty += Math.sin(en.flank) * 46;
    }
    const dx = tx - en.x, dy = ty - en.y;
    const m = Math.hypot(dx, dy) || 1;
    en.x += dx/m * en.speed * dt; en.y += dy/m * en.speed * dt;
    if (en.flash > 0) en.flash -= dt;
    en.breathe += dt;
    if (en.type === "sentinel"){
      en.shootTimer -= dt;
      if (en.shootTimer <= 0){
        en.shootTimer = 2.5 + Math.random();
        const sdx = player.x - en.x, sdy = player.y - en.y, sm = Math.hypot(sdx, sdy) || 1;
        enemyProjectiles.push({
          x: en.x, y: en.y, vx: sdx/sm*180, vy: sdy/sm*180,
          dmg: en.dmg, life: 4, trailX: en.x, trailY: en.y
        });
      }
    }
    if (pm < PLAYER_R + en.r && player.invuln <= 0){
      damagePlayer(en.dmg, PLAYER_INVULN_ON_HIT);
    }
  }

  // enemy projectiles: move, expire, collide against the PLAYER (mirror of
  // the player's own projectile loop below, but the other direction)
  for (let i = enemyProjectiles.length - 1; i >= 0; i--){
    const p = enemyProjectiles[i];
    p.trailX = p.x; p.trailY = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20){ enemyProjectiles.splice(i,1); continue; }
    if (Math.hypot(player.x - p.x, player.y - p.y) < PLAYER_R + 4 && player.invuln <= 0){
      damagePlayer(p.dmg, PLAYER_INVULN_ON_HIT);
      enemyProjectiles.splice(i, 1);
    }
  }

  // projectiles: move, expire, collide (pierce-aware — a projectile can
  // hit each distinct enemy at most once, tracked via its own hitSet)
  for (let i = projectiles.length - 1; i >= 0; i--){
    const p = projectiles[i];
    p.trailX = p.x; p.trailY = p.y;
    if (p.homing){
      const nb = nearestEnemy(p.x, p.y);
      if (nb){
        const speed = Math.hypot(p.vx, p.vy) || 260;
        const curAngle = Math.atan2(p.vy, p.vx);
        const wantAngle = Math.atan2(nb.en.y - p.y, nb.en.x - p.x);
        let diff = wantAngle - curAngle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const maxTurn = p.turnRate * dt;
        const turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
        const newAngle = curAngle + turn;
        p.vx = Math.cos(newAngle) * speed; p.vy = Math.sin(newAngle) * speed;
      }
    }
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20){ projectiles.splice(i,1); continue; }
    let hit = null;
    for (const en of enemies){
      const hitR = p.homing ? WEAPON_R : WEAPON_R * player.projSizeMult;
      if (!p.hitSet.has(en) && Math.hypot(en.x - p.x, en.y - p.y) < en.r + hitR){ hit = en; break; }
    }
    if (hit){
      const dmgDealt = p.dmg * shieldDmgMult(hit);
      hit.hp -= dmgDealt; hit.flash = 0.12;
      sfxEnemyHit();
      p.hitSet.add(hit);
      if (p.pierceLeft > 0) p.pierceLeft -= 1;
      else projectiles.splice(i, 1);
    }
  }

  // dead enemies
  for (let i = enemies.length - 1; i >= 0; i--){
    if (enemies[i].hp <= 0){
      const en = enemies[i];
      if (en.isBoss && en.wasSplitOrigin){
        // already handled entirely at the moment of splitting (particles,
        // ring, mini-boss spawn) — just remove it, no kill/orb/ember here
        enemies.splice(i,1);
        continue;
      } else if (en.isBoss && en.isMiniBoss){
        spawnParticles(en.x, en.y, en.color, 25);
        rings.push({ x: en.x, y: en.y, r: en.r, color: en.color, life: 0.5, maxLife: 0.5 });
        en.splitGroup.remaining -= 1;
        if (en.splitGroup.remaining <= 0){
          sfxBossDeath();
          hitstopTimer = 0.18;
          setTimeout(() => sfxBossVictorySting(en.splitGroup.bossIndex), 200);
          bossesDefeated += 1;
          runEmbers += 60 + en.splitGroup.bossIndex * 20;
          shake = Math.min(1, shake + 0.9);
          activateNextType();
          for (let o = 0; o < 4; o++) spawnOrb(en.x + (Math.random()-0.5)*40, en.y + (Math.random()-0.5)*40, en.splitGroup.bossIndex);
        } else {
          sfxEnemyDeath();
        }
      } else if (en.isBoss){
        sfxBossDeath();
        hitstopTimer = 0.18;
        setTimeout(() => sfxBossVictorySting(en.bossIndex), 200);
        spawnParticles(en.x, en.y, en.color, 50);
        spawnParticles(en.x, en.y, "#B24AF0", 30);
        rings.push({ x: en.x, y: en.y, r: en.r, color: en.color, life: 0.7, maxLife: 0.7 });
        rings.push({ x: en.x, y: en.y, r: en.r * 0.6, color: "#F0C4FF", life: 0.5, maxLife: 0.5 });
        bossesDefeated += 1;
        runEmbers += 60 + en.bossIndex * 20;
        shake = Math.min(1, shake + 0.9);
        activateNextType();   // beating a boss reveals something new lurking deeper
        for (let o = 0; o < 4; o++) spawnOrb(en.x + (Math.random()-0.5)*50, en.y + (Math.random()-0.5)*50, en.bossIndex);
        if (en.isFinale){
          coronaFlash = 1;   // the corona moment — light floods back the instant the eclipse breaks
          rings.push({ x: en.x, y: en.y, r: en.r * 1.4, color: "#F5F5FF", life: 1.0, maxLife: 1.0 });
          phase = "dead"; setTimeout(showVictory, 800);
        }
      } else {
        sfxEnemyDeath();
        spawnParticles(en.x, en.y, en.color, 16);
        rings.push({ x: en.x, y: en.y, r: en.r, color: en.color, life: 0.35, maxLife: 0.35 });
        if (ENEMY_TYPES[en.type].splits && !en.isSplitChild){
          for (let s = 0; s < 2; s++){
            spawnSplitChild(en);
          }
        }
      }
      spawnOrb(en.x, en.y, en.type === "warden" ? 2 : en.isBoss ? (en.isMiniBoss ? en.splitGroup.bossIndex : en.bossIndex) : 1);
      enemies.splice(i,1);
      killCount++;
      runEmbers += 1;
    }
  }
  if (musicMode === "boss" && !enemies.some(e => e.isBoss)) setMusicMode("gameplay");

  // XP orbs: drift toward the player once within magnet range, collect on contact
  for (let i = orbs.length - 1; i >= 0; i--){
    const o = orbs[i];
    const dx = player.x - o.x, dy = player.y - o.y, d = Math.hypot(dx, dy) || 1;
    if (d < player.magnetR){
      const pull = 300;
      o.x += dx/d * pull * dt; o.y += dy/d * pull * dt;
    }
    if (d < PLAYER_R + 6){ orbs.splice(i, 1); sfxXpPickup(); grantXP(XP_PER_KILL * o.value); continue; }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--){
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= 0.9; pt.vy *= 0.9; pt.life -= dt;
    if (pt.life <= 0) particles.splice(i,1);
  }

  // shockwave rings
  for (let i = rings.length - 1; i >= 0; i--){
    rings[i].life -= dt;
    if (rings[i].life <= 0) rings.splice(i,1);
  }
}

/* ---------- render ---------- */

/* Pre-rendered glow sprites — shadowBlur is by far the most expensive
   canvas operation, and it was applied per-entity per-frame. High-count
   entities (regular enemies, projectiles, orbs, satellites) now draw a
   cached radial-gradient "glow halo" behind a plain fill instead: visually
   very close, dramatically cheaper in late-game swarms. Bosses and the
   player ship deliberately keep real shadowBlur — there are only ever a
   few of them, and their glow is dynamic (charge telegraphs, arrival
   effects). Radii are bucketed to the nearest 4px to keep the cache small. */
const GLOW_CACHE = new Map();
function glowSprite(color, radius){
  const r = Math.max(4, Math.ceil(radius / 4) * 4);
  const key = color + "|" + r;
  let c = GLOW_CACHE.get(key);
  if (!c){
    c = document.createElement("canvas");
    c.width = c.height = r * 2;
    const g2 = c.getContext("2d");
    const grad = g2.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, color + "AA");
    grad.addColorStop(0.55, color + "44");
    grad.addColorStop(1, color + "00");
    g2.fillStyle = grad;
    g2.fillRect(0, 0, r * 2, r * 2);
    GLOW_CACHE.set(key, c);
  }
  return c;
}
function drawGlow(color, x, y, radius){
  const s = glowSprite(color, radius);
  const half = s.width / 2;
  ctx.drawImage(s, x - half, y - half);
}

function drawEnemyShape(en){
  const n = en.jitter.length;
  const breathe = 1 + Math.sin(en.breathe * 2.4) * 0.06;
  ctx.beginPath();
  for (let i = 0; i <= n; i++){
    const a = (i / n) * Math.PI * 2;
    const r = en.r * en.jitter[i % n] * breathe;
    const px = en.x + Math.cos(a) * r, py = en.y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function render(){
  ctx.save();
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.translate(offX, offY); ctx.scale(scale, scale);

  // screen shake — small random offset while the effect is active
  if (shake > 0.001){
    ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10);
  }

  // background — interpolates from a lighter, warmer "Milky Way" opening
  // toward the game's original near-black void as survival time increases
  const zp = zoneProgress(survivalTime);
  ctx.fillStyle = zoneBgColor(survivalTime);
  ctx.fillRect(0, 0, W, H);

  // nebula clouds — soft and visible at the start, fully faded by ZONE_FULL_SHADOW_T
  if (zp < 1){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const n of NEBULAE){
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      const a = n.baseAlpha * (1 - zp);
      g.addColorStop(0, n.color + Math.round(a * 255).toString(16).padStart(2, "0"));
      g.addColorStop(1, n.color + "00");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // distant debris — dark, slow-drifting silhouettes, position purely a
  // function of survivalTime (same approach as the starfield's twinkle, no
  // separate update() hook needed). Naturally masked early by the bright
  // nebula, becoming more visible as it fades with depth.
  ctx.save();
  ctx.fillStyle = "rgba(20,16,28,0.55)";
  for (const d of DEBRIS){
    const wrapW = W + 200, wrapH = H + 200;
    const dx = (((d.x + d.vx * ambientT) % wrapW) + wrapW) % wrapW - 100;
    const dy = (((d.y + d.vy * ambientT) % wrapH) + wrapH) % wrapH - 100;
    const rot = d.rot + d.rotSpeed * ambientT;
    ctx.save();
    ctx.translate(dx, dy); ctx.rotate(rot);
    ctx.beginPath();
    const n = d.jitter.length;
    for (let i = 0; i <= n; i++){
      const a = (i / n) * Math.PI * 2;
      const r = d.r * d.jitter[i % n];
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // starfield — visible in every phase, including the menu
  const tw = ambientT;
  for (const s of STARS){
    const a = REDUCE_MOTION ? s.baseA : s.baseA + Math.sin(tw * s.twinkleSpeed + s.twinklePhase) * 0.2;
    ctx.globalAlpha = Math.max(0.08, a);
    ctx.fillStyle = "#C9D3F0";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // a vignette that gently deepens as the shadow closes in — distinct in
  // color from the low-HP warning vignette so the two never get confused
  if (zp > 0.05){
    const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.7);
    vg.addColorStop(0, "rgba(10,4,20,0)");
    vg.addColorStop(1, "rgba(10,4,20," + (zp * 0.55).toFixed(2) + ")");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.strokeStyle = "#151A28"; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W-1, H-1);

  if (phase === "playing" || phase === "dead" || phase === "levelup" || phase === "paused"){
    // particles (behind entities)
    for (const pt of particles){
      ctx.globalAlpha = Math.max(0, pt.life / 0.6);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // death shockwave rings
    for (const r of rings){
      const p = 1 - r.life / r.maxLife;
      ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.strokeStyle = r.color || "#B24AF0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r + p * 26, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // XP orbs — small glowing pickups; higher-value orbs (boss drops,
    // merged orbs) render slightly larger so worth is readable at a glance
    ctx.fillStyle = "#8CF0B2";
    for (const o of orbs){
      const or = 3.4 + Math.min(2.6, (o.value - 1) * 0.4);
      drawGlow("#8CF0B2", o.x, o.y, or * 2.6);
      ctx.beginPath(); ctx.arc(o.x, o.y, or, 0, 7); ctx.fill();
    }

    // enemies — jittered organic shape per archetype, gentle breathing pulse
    for (const en of enemies){
      if (en.isBoss){
        // pulse telegraph: a growing ring that reads clearly as "about to hurt"
        if (en.pulseState === "growing"){
          ctx.save();
          ctx.globalAlpha = 0.55;
          ctx.strokeStyle = "#B24AF0"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(en.x, en.y, en.pulseRadius, 0, 7); ctx.stroke();
          ctx.restore();
        }
        // shield barrier — a clear visual cue that damage is being resisted
        if (en.ability === "shield" && en.shieldState === "up"){
          ctx.save();
          ctx.globalAlpha = 0.5 + Math.sin(en.breathe * 6) * 0.15;
          ctx.strokeStyle = "#4AD9F0"; ctx.lineWidth = 3;
          ctx.shadowColor = "#4AD9F0"; ctx.shadowBlur = 16;
          ctx.beginPath(); ctx.arc(en.x, en.y, en.r + 10, 0, 7); ctx.stroke();
          ctx.restore();
        }
        // charge telegraph: progressively intensifies as the commit moment
        // approaches - starts subtle, builds to a bright warning glow,
        // giving a clear "charging up" read even though it's continuously
        // tracking your current position the whole time
        const chargeProgress = en.chargeState === "telegraph" ? 1 - (en.chargeTimer / CHARGE_TELEGRAPH_DURATION) : 0;
        const chargeGlow = en.chargeState === "telegraph" ? 14 + chargeProgress * 34
          : en.chargeState === "dashing" ? 26 : 14;
        const telegraphColor = en.chargeState === "telegraph" ? lerpHex(en.color, "#F0C8FF", chargeProgress) : en.color;
        const inArrival = en.arrivalTimer > 0;
        const arrivalProgress = inArrival ? 1 - (en.arrivalTimer / 2.0) : 1;   // 0 at spawn, 1 once settled
        if (en.ability === "shield" && inArrival){
          // crystallizing: fades in from a near-transparent whitish glow,
          // receding into its true color as it "solidifies" — remembers
          // being solid once, and is becoming solid again
          ctx.save();
          ctx.globalAlpha = 0.25 + arrivalProgress * 0.75;
          ctx.shadowColor = "#4AD9F0"; ctx.shadowBlur = 20;
          ctx.fillStyle = lerpHex("#FFFFFF", en.color, arrivalProgress);
          drawEnemyShape(en);
          ctx.fill();
          ctx.restore();
        } else if (en.ability === "split" && inArrival){
          // flickers between one and two silhouettes before settling into
          // one — it was never only one thing, even at the start
          const offset = (1 - arrivalProgress) * 22 * (Math.sin(en.breathe * 14) > 0 ? 1 : -1);
          ctx.save();
          ctx.globalAlpha = 0.4 * (1 - arrivalProgress);
          ctx.fillStyle = en.color;
          ctx.translate(offset, 0);
          drawEnemyShape(en);
          ctx.fill();
          ctx.restore();
          ctx.save();
          ctx.shadowColor = "#B24AF0"; ctx.shadowBlur = en.flash > 0 ? chargeGlow + 10 : chargeGlow;
          ctx.fillStyle = en.chargeState === "telegraph"
            ? telegraphColor : (en.flash > 0 ? en.flashColor : en.color);
          drawEnemyShape(en);
          ctx.fill();
          ctx.restore();
        } else {
          ctx.save();
          ctx.shadowColor = "#B24AF0"; ctx.shadowBlur = en.flash > 0 ? chargeGlow + 10 : chargeGlow;
          ctx.fillStyle = en.chargeState === "telegraph"
            ? telegraphColor : (en.flash > 0 ? en.flashColor : en.color);
          drawEnemyShape(en);
          ctx.fill();
          ctx.restore();
        }
        // a small HP bar above the boss — it has enough health that the
        // player benefits from seeing progress, unlike regular enemies
        const bw = Math.max(60, en.r * 2.2), bx = en.x - bw/2, by = en.y - en.r - 16;
        ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(bx, by, bw, 5);
        ctx.fillStyle = "#B24AF0"; ctx.fillRect(bx, by, bw * Math.max(0, en.hp / en.maxHp), 5);
        continue;
      }
      drawGlow(en.flash > 0 ? en.flashColor : en.color, en.x, en.y, en.r * (en.flash > 0 ? 2.6 : 2.1));
      ctx.fillStyle = en.flash > 0 ? en.flashColor : en.color;
      drawEnemyShape(en);
      ctx.fill();
    }

    // projectiles — short fading trail behind each shot (seekers render
    // gold instead of cyan, so a homing shot reads differently mid-flight)
    ctx.save();
    for (const p of projectiles){
      const col = p.homing ? "#F0D060" : "#4AD9F0";
      const dotCol = p.homing ? "#FFEBB0" : "#CFF6FF";
      const visR = p.homing ? WEAPON_R : WEAPON_R * player.projSizeMult;
      drawGlow(col, p.x, p.y, visR * 3);
      ctx.strokeStyle = p.homing ? "rgba(240,208,96,0.45)" : "rgba(79,217,240,0.45)";
      ctx.lineWidth = visR * 1.3;
      ctx.beginPath(); ctx.moveTo(p.trailX, p.trailY); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = dotCol;
      ctx.beginPath(); ctx.arc(p.x, p.y, visR, 0, 7); ctx.fill();
    }
    ctx.restore();

    // enemy projectiles — same treatment, warning-red instead of player-cyan
    ctx.save();
    for (const p of enemyProjectiles){
      drawGlow("#E8304A", p.x, p.y, 12);
      ctx.strokeStyle = "rgba(232,48,74,0.45)"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(p.trailX, p.trailY); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = "#FFB0BC";
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill();
    }
    ctx.restore();

    // satellites — small orbiting drones
    if (player.satellites){
      const s = player.satellites;
      ctx.save();
      ctx.fillStyle = "#F0D060";
      for (let i = 0; i < s.count; i++){
        const a = player.satAngle + (i / s.count) * Math.PI * 2;
        const sx = player.x + Math.cos(a) * s.radius, sy = player.y + Math.sin(a) * s.radius;
        drawGlow("#F0D060", sx, sy, 16);
        ctx.beginPath(); ctx.arc(sx, sy, 6, 0, 7); ctx.fill();
      }
      ctx.restore();
    }

    // beam — a continuous line to the locked target(s)
    if (player.beam && player.beam.target){
      ctx.save();
      ctx.globalAlpha = 0.7 + Math.sin(survivalTime * 30) * 0.15;
      ctx.strokeStyle = "#8CF0B2"; ctx.lineWidth = 3;
      ctx.shadowColor = "#8CF0B2"; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.beam.target.x, player.beam.target.y); ctx.stroke();
      ctx.restore();
    }

    // player — small directional ship, oriented to last movement facing
    ctx.save();
    const blink = player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0;
    ctx.globalAlpha = blink ? 0.4 : 1;
    ctx.translate(player.x, player.y);
    ctx.rotate(player.facing + Math.PI / 2);

    // hull silhouette v2 — elongated front-to-back with wings that sweep
    // BACKWARD from near the nose to points level with the rear, rather
    // than radiating outward from the middle (the previous attempt's
    // near-1:1 length:width ratio and forward-set wingtips read as a
    // star/asterisk; this one is closer to 1.6:1, aircraft-like).
    // Reshaped per owned weapon: Beam extends the nose spike, Satellites/
    // Seekers each claim a wingtip, Nova widens the engine block.
    let hullNose      = { x: 0,            y: -PLAYER_R * 1.7 };
    let hullShoulderR = { x: PLAYER_R * 0.18,  y: -PLAYER_R * 1.0 };
    let hullWingTipR  = { x: PLAYER_R * 0.95,  y: PLAYER_R * 0.55 };
    let hullWingAftR  = { x: PLAYER_R * 0.35,  y: PLAYER_R * 1.0 };
    let hullEngineR   = { x: PLAYER_R * 0.28,  y: PLAYER_R * 1.35 };
    let hullEngineL   = { x: -PLAYER_R * 0.28, y: PLAYER_R * 1.35 };
    let hullWingAftL  = { x: -PLAYER_R * 0.35, y: PLAYER_R * 1.0 };
    let hullWingTipL  = { x: -PLAYER_R * 0.95, y: PLAYER_R * 0.55 };
    let hullShoulderL = { x: -PLAYER_R * 0.18, y: -PLAYER_R * 1.0 };
    if (player.ownedWeapons.includes("beam")) hullNose = { x: 0, y: -PLAYER_R * 2.1 };
    if (player.ownedWeapons.includes("satellites")) hullWingTipL = { x: -PLAYER_R * 1.2, y: PLAYER_R * 0.65 };
    if (player.ownedWeapons.includes("seekers")) hullWingTipR = { x: PLAYER_R * 1.15, y: PLAYER_R * 0.35 };
    if (player.ownedWeapons.includes("nova")){
      hullEngineR = { x: PLAYER_R * 0.4, y: PLAYER_R * 1.55 };
      hullEngineL = { x: -PLAYER_R * 0.4, y: PLAYER_R * 1.55 };
    }
    // per-run evolution: still obviously the same ship, just further along
    // — level 20+ grows the engine block a little more, on top of anything
    // weapons already did to it this run
    const shipLevel = player.level;
    if (shipLevel >= 20){
      hullEngineR = { x: hullEngineR.x * 1.15, y: hullEngineR.y * 1.08 };
      hullEngineL = { x: hullEngineL.x * 1.15, y: hullEngineL.y * 1.08 };
    }
    function drawHull(){
      ctx.beginPath();
      ctx.moveTo(hullNose.x, hullNose.y);
      ctx.lineTo(hullShoulderR.x, hullShoulderR.y);
      ctx.lineTo(hullWingTipR.x, hullWingTipR.y);
      ctx.lineTo(hullWingAftR.x, hullWingAftR.y);
      ctx.lineTo(hullEngineR.x, hullEngineR.y);
      ctx.lineTo(hullEngineL.x, hullEngineL.y);
      ctx.lineTo(hullWingAftL.x, hullWingAftL.y);
      ctx.lineTo(hullWingTipL.x, hullWingTipL.y);
      ctx.lineTo(hullShoulderL.x, hullShoulderL.y);
      ctx.closePath();
    }

    // gunmetal hull with a cool blue undertone — still deliberately dark
    // so the core reads as the focal point, but with enough hue/contrast
    // against the near-black background to stay readable, not blend in
    ctx.shadowColor = "#0A0C10"; ctx.shadowBlur = 10;
    const hullGrad = ctx.createRadialGradient(0, -PLAYER_R*0.2, 1, 0, 0, PLAYER_R*1.8);
    hullGrad.addColorStop(0, "#5C6C7E");
    hullGrad.addColorStop(1, "#20262F");
    ctx.fillStyle = hullGrad;
    drawHull(); ctx.fill();

    // a permanent, subtle outline so the silhouette always reads clearly
    // against dark backgrounds regardless of level — level 10 upgrades
    // this to a visibly brighter glow, not the ship's only edge definition
    ctx.shadowBlur = 0;
    if (shipLevel >= 10){
      ctx.strokeStyle = "rgba(200,240,255,0.35)"; ctx.lineWidth = 1.5;
    } else {
      ctx.strokeStyle = "rgba(140,175,205,0.4)"; ctx.lineWidth = 1;
    }
    drawHull(); ctx.stroke();

    // the energy core — bright cyan-white, the one place the eye should
    // naturally go. Positioned forward, in the cockpit/body, not the engine.
    ctx.shadowBlur = 0;
    const corePulse = 0.7 + Math.sin(survivalTime * 3) * 0.25;
    ctx.save();
    ctx.shadowColor = "#CFFBFF"; ctx.shadowBlur = 14;
    ctx.fillStyle = "rgba(220,250,255," + corePulse.toFixed(2) + ")";
    ctx.beginPath(); ctx.arc(0, -PLAYER_R * 0.15, PLAYER_R * 0.3, 0, 7); ctx.fill();
    ctx.restore();

    // the engine — small, warm amber, always flickering with its own
    // energy (two overlapping frequencies rather than one smooth pulse,
    // so it reads as alive machinery rather than a steady glow). At
    // level 20+, a second smaller glow point joins it - more power, not
    // a different engine.
    const engineFlicker = Math.max(0.35, Math.min(1, 0.6 + Math.sin(survivalTime * 9) * 0.25 + Math.sin(survivalTime * 23) * 0.15));
    ctx.save();
    ctx.shadowColor = "#F0A050"; ctx.shadowBlur = 10;
    ctx.fillStyle = "rgba(240,160,80," + engineFlicker.toFixed(2) + ")";
    ctx.beginPath(); ctx.ellipse(0, PLAYER_R * (shipLevel >= 20 ? 1.15 : 0.95), PLAYER_R * 0.32, PLAYER_R * 0.18, 0, 0, 7); ctx.fill();
    if (shipLevel >= 20){
      const flicker2 = Math.max(0.3, Math.min(1, 0.55 + Math.sin(survivalTime * 11 + 1.7) * 0.25));
      ctx.fillStyle = "rgba(240,160,80," + flicker2.toFixed(2) + ")";
      ctx.beginPath(); ctx.ellipse(PLAYER_R * 0.5, PLAYER_R * 1.1, PLAYER_R * 0.16, PLAYER_R * 0.1, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-PLAYER_R * 0.5, PLAYER_R * 1.1, PLAYER_R * 0.16, PLAYER_R * 0.1, 0, 0, 7); ctx.fill();
    }
    ctx.restore();

    // level 30+: the light has spread all the way to the wingtips —
    // small glowing fin-tips in the same cyan-white as the core, not a
    // new color, just the light reaching further than it did at level 10
    if (shipLevel >= 30){
      const finPulse = 0.6 + Math.sin(survivalTime * 3 + 0.8) * 0.3;
      ctx.save();
      ctx.shadowColor = "#CFFBFF"; ctx.shadowBlur = 8;
      ctx.fillStyle = "rgba(220,250,255," + finPulse.toFixed(2) + ")";
      ctx.beginPath(); ctx.arc(hullWingTipL.x, hullWingTipL.y, PLAYER_R * 0.12, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(hullWingTipR.x, hullWingTipR.y, PLAYER_R * 0.12, 0, 7); ctx.fill();
      ctx.restore();
    }

    // small confirming glow AT each reshaped point — the shape change is
    // the primary read; this just ties the change to its weapon's color
    if (player.ownedWeapons.includes("beam")){
      ctx.fillStyle = "#8CF0B2";
      ctx.beginPath(); ctx.arc(hullNose.x, hullNose.y, 2.2, 0, 7); ctx.fill();
    }
    if (player.ownedWeapons.includes("satellites")){
      ctx.fillStyle = "#F0D060";
      ctx.beginPath(); ctx.arc(hullWingTipL.x, hullWingTipL.y, 2.2, 0, 7); ctx.fill();
    }
    if (player.ownedWeapons.includes("seekers")){
      ctx.fillStyle = "#F0D060";
      ctx.beginPath(); ctx.arc(hullWingTipR.x, hullWingTipR.y, 2.2, 0, 7); ctx.fill();
    }
    if (player.ownedWeapons.includes("nova")){
      ctx.fillStyle = "#4AD9F0";
      ctx.beginPath(); ctx.arc((hullEngineL.x+hullEngineR.x)/2, hullEngineR.y, 2.2, 0, 7); ctx.fill();
    }

    // faint invulnerability shield ring
    if (player.invuln > 0){
      ctx.strokeStyle = "rgba(79,217,240,0.5)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, PLAYER_R * 1.8, 0, 7); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // touch joystick — faint origin ring + knob, so the drag-anywhere
    // control has visible feedback (mouse drags get it too, harmlessly)
    if (stickActive && phase === "playing"){
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = "#4AD9F0"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(stickOriginX, stickOriginY, STICK_MAX, 0, 7); ctx.stroke();
      ctx.fillStyle = "#4AD9F0";
      ctx.beginPath(); ctx.arc(stickOriginX + stickDX, stickOriginY + stickDY, 10, 0, 7); ctx.fill();
      ctx.restore();
    }
  }

  ctx.restore();

  // low-HP vignette — screen-space, drawn after the world transform is
  // restored so it stays fixed relative to the viewport, not the arena
  // NOTE: the base transform here is dpr-scaled (set in resize()), so all
  // screen-space drawing must use CSS-pixel viewport dims, NOT cv.width/
  // cv.height (device pixels) — those are 2x off on hi-DPI screens.
  const vpW = window.innerWidth, vpH = window.innerHeight;
  if ((phase === "playing") && player && player.hp / maxHP() <= 0.25){
    const pulse = 0.35 + Math.sin(survivalTime * 5) * 0.15;
    const g = ctx.createRadialGradient(
      vpW/2, vpH/2, Math.min(vpW, vpH) * 0.28,
      vpW/2, vpH/2, Math.max(vpW, vpH) * 0.62
    );
    g.addColorStop(0, "rgba(240,74,106,0)");
    g.addColorStop(1, "rgba(240,74,106," + pulse.toFixed(2) + ")");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, vpW, vpH);
  }

  // Totality's Eclipse — heavy near-total darkness, only a small radius
  // around the player left visible. Fighting half-blind is the point.
  if (phase === "playing" && enemies.some(e => e.isFinale && e.eclipseState === "active")){
    const px = offX + player.x * scale, py = offY + player.y * scale;
    const visRadius = Math.min(vpW, vpH) * 0.13;
    const eg = ctx.createRadialGradient(px, py, visRadius * 0.4, px, py, visRadius * 1.6);
    eg.addColorStop(0, "rgba(4,2,8,0)");
    eg.addColorStop(1, "rgba(4,2,8,0.985)");
    ctx.fillStyle = eg;
    ctx.fillRect(0, 0, vpW, vpH);
  }

  // corona flash — warm white washing over the screen when Totality falls
  if (coronaFlash > 0){
    ctx.fillStyle = "rgba(255,250,238," + (coronaFlash * 0.85).toFixed(2) + ")";
    ctx.fillRect(0, 0, vpW, vpH);
  }
}

/* ---------- HUD ---------- */
function updateHUD(){
  const mins = Math.floor(survivalTime / 60), secs = Math.floor(survivalTime % 60);
  document.getElementById("timer").textContent = mins + ":" + String(secs).padStart(2, "0");
  document.getElementById("kills").textContent = killCount + " CLEARED";
  const pct = Math.max(0, player.hp / maxHP() * 100);
  const fill = document.getElementById("hpFill");
  fill.style.width = pct + "%";
  fill.classList.toggle("low", pct <= 25);
  document.getElementById("levelTag").textContent = "LV " + player.level;
  document.getElementById("xpFill").style.width = Math.min(100, player.xp / player.xpToNext * 100) + "%";
  const banner = document.getElementById("bossBannerEl");
  if (bossBanner){ banner.textContent = bossBanner.text; banner.classList.add("show"); }
  else { banner.classList.remove("show"); }
  const lore = document.getElementById("loreBannerEl");
  if (loreBanner){ lore.textContent = loreBanner.text; lore.classList.add("show"); }
  else { lore.classList.remove("show"); }
  // loadout readout — which weapons and traits this run owns, so build
  // reasoning at level-up time doesn't rely on memory. Short codes keep
  // it a quiet HUD whisper rather than a second panel.
  const wCodes = { cannon:"CANNON", satellites:"SAT", nova:"NOVA", seekers:"SEEK", beam:"BEAM" };
  const tCodes = { trait_hull:"HULL+", trait_overdrive:"OVRD", trait_volatile:"VOLT", trait_salvage:"SLVG", trait_bulwark:"BLWK" };
  const buildStr = player.ownedWeapons.map(w => wCodes[w] || w).join(" \u00b7 ") +
    (player.ownedTraits.length ? "   /   " + player.ownedTraits.map(t => tCodes[t] || t).join(" \u00b7 ") : "");
  const buildEl = document.getElementById("buildTag");
  if (buildEl.textContent !== buildStr) buildEl.textContent = buildStr;
}

/* ---------- loop ---------- */
function frame(t){
  if (phase === "opening"){ renderOpening(t); requestAnimationFrame(frame); return; }
  if (!lastFrameT) lastFrameT = t;
  const dt = Math.min(0.05, (t - lastFrameT) / 1000);   // clamp huge tab-switch gaps
  lastFrameT = t;
  ambientT += dt;
  if (coronaFlash > 0) coronaFlash = Math.max(0, coronaFlash - dt / 1.1);
  if (hitstopTimer > 0){
    hitstopTimer = Math.max(0, hitstopTimer - dt);
  } else if (phase === "playing"){
    update(dt); updateHUD();
  }
  render();
  requestAnimationFrame(frame);
}

resetGame();
phase = "opening";
requestAnimationFrame(frame);
</script>
</body>
