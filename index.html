<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Aphelion — you've drifted to the farthest, coldest point of the orbit. Something in the dark has noticed. Survive.">
<meta name="theme-color" content="#05060B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060B'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%234AD9F0'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23B24AF0' stroke-width='1.5' opacity='0.6'/%3E%3C/svg%3E">
<title>Aphelion</title>
<style>
  :root{
    --space:#05060B; --ink:#E8EAF2; --dim:#5A6478;
    --player:#4AD9F0; --enemy:#B24AF0; --warn:#F04A6A;
    --mono:'SF Mono',ui-monospace,Consolas,monospace; --sans:'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--space)}
  *{scrollbar-width:thin;scrollbar-color:#2A3145 #0C0F1A}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#0C0F1A}
  ::-webkit-scrollbar-thumb{background:#2A3145;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#3A4560}
  body{font-family:var(--mono);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;display:block}

  #hud{position:fixed;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 18px 0}
  #hud.hidden{display:none}
  #topRow{display:flex;justify-content:space-between;align-items:flex-start}
  #timer{font-family:var(--sans);font-size:22px;font-weight:600;letter-spacing:.05em;font-variant-numeric:tabular-nums}
  #kills{color:var(--dim);font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-top:4px}
  #hpWrap{width:min(46vw,220px)}
  #hpLabel{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;text-align:right;margin-bottom:4px}
  #hpBar{height:7px;border:1px solid #2A3145;border-radius:4px;overflow:hidden;background:#0C0F1A}
  #hpFill{height:100%;background:var(--player);width:100%;transition:width .15s ease,background .3s ease}
  #hpFill.low{background:var(--warn)}
  #xpWrap{display:flex;align-items:center;gap:10px;margin-top:10px}
  #levelTag{font-size:10px;letter-spacing:.15em;color:var(--dim);white-space:nowrap}
  #xpBar{flex:1;height:4px;border:1px solid #2A3145;border-radius:3px;overflow:hidden;background:#0C0F1A}
  #xpFill{height:100%;background:#8CF0B2;width:0%;transition:width .2s ease}
  #buildTag{margin-top:6px;font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  #bossBannerEl{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);
    font-family:var(--sans);font-size:clamp(16px,4vw,28px);font-weight:600;letter-spacing:.15em;
    color:#0A0508;-webkit-text-stroke:1.5px #E8304A;text-transform:uppercase;
    text-shadow:0 0 3px #E8304A, 0 0 18px rgba(232,48,74,0.85), 0 0 40px rgba(160,10,30,0.6);
    opacity:0;transition:opacity .4s ease;pointer-events:none;text-align:center;
    max-width:92vw;white-space:normal}
  #bossBannerEl.show{opacity:1}
  #loreBannerEl{position:fixed;top:62%;left:50%;transform:translate(-50%,-50%);
    font-family:var(--sans);font-size:clamp(12px,2.6vw,16px);font-weight:400;letter-spacing:.08em;
    color:rgba(200,205,225,0.75);font-style:italic;
    opacity:0;transition:opacity 1.8s ease;pointer-events:none;text-align:center;
    max-width:80vw;white-space:normal}
  #loreBannerEl.show{opacity:1}
  #hudToolbar{position:fixed;top:max(14px,env(safe-area-inset-top));right:16px;z-index:5;
    display:flex;flex-direction:row;gap:8px}
  #btnMute{background:none;border:1px solid #2A3145;color:var(--dim);font-family:var(--mono);
    font-size:10px;letter-spacing:.1em;padding:6px 10px;border-radius:5px;cursor:pointer}
  #btnMute:hover{border-color:var(--player);color:var(--ink)}
  #btnPause{background:none;border:1px solid #2A3145;color:var(--dim);font-family:var(--mono);
    font-size:10px;letter-spacing:.1em;padding:6px 10px;border-radius:5px;cursor:pointer;display:none}
  #btnPause:hover{border-color:var(--player);color:var(--ink)}
  #openingSkipHint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));right:20px;z-index:5;
    color:var(--dim);font-size:12px;letter-spacing:.15em;text-transform:uppercase;
    font-family:var(--mono);opacity:0;pointer-events:none;transition:opacity .3s}
  #openingSkipHint.show{opacity:0.7}
  #btnPause.show{display:block}

  #card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,6,11,0);transition:background .5s;pointer-events:none}
  #card.on{background:rgba(5,6,11,.78);pointer-events:auto;cursor:pointer}
  #cardBox{text-align:center;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;
    max-width:min(520px,90vw);max-height:90vh;overflow-y:auto;padding:4px}
  #card.on #cardBox{opacity:1;transform:none}
  #cardKick{color:var(--dim);font-size:12px;letter-spacing:.28em;text-transform:uppercase}
  #cardTitle{font-family:var(--sans);font-size:clamp(30px,7vw,54px);font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;margin:12px 0 16px;color:var(--ink)}
  #cardBody{font-size:13px;line-height:1.9;color:var(--ink)}
  #cardBody .warn{color:var(--warn)} #cardBody .good{color:var(--player)}
  #cardGo{margin-top:26px;font-size:11px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
  .upgradeBtns{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .upgradeBtn{background:none;border:1px solid #2A3145;color:var(--ink);font-family:var(--mono);
    text-align:left;padding:12px 16px;border-radius:6px;cursor:pointer;font-size:13px}
  .upgradeBtn b{display:block;font-family:var(--sans);font-weight:600;letter-spacing:.03em}
  .upgradeBtn small{display:block;color:var(--dim);font-size:11px;letter-spacing:.04em;margin-top:4px}
  .upgradeBtn:hover{border-color:var(--player)}
  .upgradeBtn:hover small{color:var(--ink)}
  .upgradeBtn:focus-visible{outline:2px solid var(--player);outline-offset:2px}
  .superUpgradeBtn{border-color:#8CF0B2}
  .superUpgradeBtn:hover{border-color:#F0D060}
  .superUpgradeBtn b{color:#F0D060}
  .traitUpgradeBtn{border-color:#E8834A}
  .traitUpgradeBtn:hover{border-color:#F0A060}
  .traitUpgradeBtn b{color:#F0A060}

  .menuBtns{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .menuBtn{background:none;border:1px solid #2A3145;color:var(--ink);font-family:var(--mono);
    text-align:left;padding:12px 16px;border-radius:6px;cursor:pointer;font-size:13px}
  .menuBtn b{display:block;font-family:var(--sans);font-weight:600;letter-spacing:.03em}
  .menuBtn small{display:block;color:var(--dim);font-size:11px;letter-spacing:.04em;margin-top:4px}
  .menuBtn:hover{border-color:var(--player)}
  .menuBtn:hover small{color:var(--ink)}
  .menuBtn:focus-visible{outline:2px solid var(--player);outline-offset:2px}
  .backBtn{margin-top:16px;text-align:center}

  .shopList{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-height:52vh;overflow-y:auto}
  .sectionLabel{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--dim);margin-top:16px;margin-bottom:2px}
  .shopRow{display:flex;align-items:center;justify-content:space-between;gap:14px;
    border:1px solid #2A3145;border-radius:6px;padding:10px 14px;text-align:left}
  .shopInfo b{display:block;font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.03em}
  .shopInfo small{display:block;color:var(--dim);font-size:11px;margin-top:3px}
  .shopBuy{flex-shrink:0;background:none;border:1px solid #8CF0B2;color:#8CF0B2;font-family:var(--mono);
    padding:8px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}
  .shopBuy:hover:not(:disabled){background:rgba(140,240,178,0.12)}
  .shopBuy:disabled{border-color:#2A3145;color:var(--dim);cursor:not-allowed}

  @media (prefers-reduced-motion: reduce){ #card,#cardBox,#hpFill{transition:none} }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="topRow">
    <div>
      <div id="timer">0:00</div>
      <div id="kills">0 CLEARED</div>
    </div>
    <div id="hpWrap">
      <div id="hpLabel">HULL</div>
      <div id="hpBar"><div id="hpFill"></div></div>
    </div>
  </div>
  <div id="xpWrap">
    <div id="levelTag">LV 1</div>
    <div id="xpBar"><div id="xpFill"></div></div>
  </div>
  <div id="buildTag"></div>
  <div id="bossBannerEl"></div>
  <div id="loreBannerEl"></div>
</div>
<div id="openingSkipHint">tap / click / any key to skip</div>
<div id="hudToolbar">
  <button id="btnPause" title="Pause (Esc)">II PAUSE</button>
  <button id="btnMute" title="Sound (M)">M &middot; SOUND ON</button>
</div>

<div id="card">
  <div id="cardBox">
    <div id="cardKick"></div>
    <div id="cardTitle"></div>
    <div id="cardBody"></div>
    <div id="cardGo"></div>
  </div>
</div>

<script>
"use strict";

/* ---------- canvas / scaling ---------- */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const W = 1000, H = 640;   // logical arena size, bounded (no camera scroll — matches Perihelion's approach)
let scale = 1, offX = 0, offY = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
  cv.width = vw * dpr; cv.height = vh * dpr;
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function toLogical(clientX, clientY){
  return { x: (clientX - offX) / scale, y: (clientY - offY) / scale };
}

/* ---------- opening sequence — plays every launch, skippable. Its own
   self-contained visual system: a deliberately more detailed "cinematic"
   ship (not the gameplay ship - explicitly not meant to match) and its
   own wide star/nebula field, since the flying camera needs more room
   than the gameplay arena's fixed 1000x640 world. Draws directly in raw
   viewport pixels via the same ctx, independent of the gameplay arena's
   offX/offY/scale letterboxing, since the two never render simultaneously. ---------- */
const OPENING_PLAYER_R = 15;
const OPENING_STARS = [];
for (let i = 0; i < 220; i++){
  OPENING_STARS.push({
    x: (Math.random()-0.5) * 2600, y: (Math.random()-0.5) * 2600,
    r: Math.random() < 0.15 ? 1.6 + Math.random()*1.2 : 0.6 + Math.random()*0.8,
    baseA: 0.25 + Math.random()*0.55,
    twinkleSpeed: 0.5 + Math.random()*1.5,
    twinklePhase: Math.random()*Math.PI*2
  });
}
const OPENING_NEBULA_COLORS = ["#5A6FD8","#8A4FC8","#C85898","#4F98C8","#7A5AD0"];
const OPENING_NEBULAE = [];
for (let i = 0; i < 7; i++){
  OPENING_NEBULAE.push({
    x: (Math.random()-0.5) * 2200, y: (Math.random()-0.5) * 2200,
    r: 220 + Math.random()*300,
    color: OPENING_NEBULA_COLORS[i % OPENING_NEBULA_COLORS.length],
    baseAlpha: 0.07 + Math.random()*0.06
  });
}
const OPENING_BG = [9, 10, 25];

function drawOpeningShip(t, x, y, rotation, corePulseRate, engineAlpha){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);
  const R = OPENING_PLAYER_R;

  let hullNose      = { x:0,       y:-R*1.7 };
  let hullShoulderR = { x:R*0.18,  y:-R*1.0 };
  let hullWingTipR  = { x:R*0.95,  y:R*0.55 };
  let hullWingAftR  = { x:R*0.35,  y:R*1.0 };
  let hullEngineR   = { x:R*0.28,  y:R*1.35 };
  let hullEngineL   = { x:-R*0.28, y:R*1.35 };
  let hullWingAftL  = { x:-R*0.35, y:R*1.0 };
  let hullWingTipL  = { x:-R*0.95, y:R*0.55 };
  let hullShoulderL = { x:-R*0.18, y:-R*1.0 };

  function drawHull(){
    ctx.beginPath();
    ctx.moveTo(hullNose.x, hullNose.y);
    ctx.lineTo(hullShoulderR.x, hullShoulderR.y);
    ctx.lineTo(hullWingTipR.x, hullWingTipR.y);
    ctx.lineTo(hullWingAftR.x, hullWingAftR.y);
    ctx.lineTo(hullEngineR.x, hullEngineR.y);
    ctx.lineTo(hullEngineL.x, hullEngineL.y);
    ctx.lineTo(hullWingAftL.x, hullWingAftL.y);
    ctx.lineTo(hullWingTipL.x, hullWingTipL.y);
    ctx.lineTo(hullShoulderL.x, hullShoulderL.y);
    ctx.closePath();
  }

  ctx.shadowColor = "#0A0C10"; ctx.shadowBlur = 10;
  const hullGrad = ctx.createRadialGradient(0,-R*0.2,1, 0,0,R*1.8);
  hullGrad.addColorStop(0, "#5C6C7E");
  hullGrad.addColorStop(1, "#20262F");
  ctx.fillStyle = hullGrad;
  drawHull(); ctx.fill();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(140,175,205,0.4)"; ctx.lineWidth = 1;
  drawHull(); ctx.stroke();

  ctx.strokeStyle = "rgba(10,12,16,0.35)"; ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(hullShoulderR.x, hullShoulderR.y); ctx.lineTo(hullWingAftR.x, hullWingAftR.y);
  ctx.moveTo(hullShoulderL.x, hullShoulderL.y); ctx.lineTo(hullWingAftL.x, hullWingAftL.y);
  ctx.moveTo(hullEngineL.x, hullEngineL.y); ctx.lineTo(hullEngineR.x, hullEngineR.y);
  ctx.stroke();

  const canopyShimmer = 0.5 + Math.sin(t * corePulseRate) * 0.18;
  const canopyGrad = ctx.createLinearGradient(0, -R*0.95, 0, -R*0.15);
  canopyGrad.addColorStop(0, "rgba(180,225,235," + (0.4 + canopyShimmer*0.35).toFixed(2) + ")");
  canopyGrad.addColorStop(1, "rgba(40,60,70,0.35)");
  ctx.save();
  ctx.shadowColor = "#9FDCE8"; ctx.shadowBlur = 6 + canopyShimmer*6;
  ctx.fillStyle = canopyGrad;
  ctx.beginPath(); ctx.ellipse(0, -R*0.55, R*0.22, R*0.42, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(200,235,245,0.4)"; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.ellipse(0, -R*0.55, R*0.22, R*0.42, 0, 0, 7); ctx.stroke();
  ctx.restore();

  const engineFlicker = Math.max(0.35, Math.min(1, 0.6 + Math.sin(t*9)*0.25 + Math.sin(t*23)*0.15)) * engineAlpha;
  ctx.save();
  ctx.shadowColor = "#F0A050"; ctx.shadowBlur = 10;
  ctx.fillStyle = "rgba(240,160,80," + engineFlicker.toFixed(2) + ")";
  ctx.beginPath(); ctx.ellipse(-R*0.24, R*1.05, R*0.16, R*0.16, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(R*0.24, R*1.05, R*0.16, R*0.16, 0, 0, 7); ctx.fill();
  ctx.restore();

  ctx.restore();
}
function drawOpeningBackground(t, panX, panY){
  ctx.fillStyle = "rgb(" + OPENING_BG[0] + "," + OPENING_BG[1] + "," + OPENING_BG[2] + ")";
  ctx.fillRect(panX - 2000, panY - 2000, 4000, 4000);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const n of OPENING_NEBULAE){
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, n.color + Math.round(n.baseAlpha*255).toString(16).padStart(2,"0"));
    g.addColorStop(1, n.color + "00");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
  }
  ctx.restore();
  for (const s of OPENING_STARS){
    const a = s.baseA + Math.sin(t*s.twinkleSpeed + s.twinklePhase) * 0.2;
    ctx.globalAlpha = Math.max(0.08, a);
    ctx.fillStyle = "#C9D3F0";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const OPENING_REVEAL_START = 1.2, OPENING_REVEAL_END = 4.0, OPENING_HOLD_END = 6.5, OPENING_FADE_END = 7.6;
function openingEaseOutCubic(x){ return 1 - Math.pow(1-x, 3); }
function openingClamp01(x){ return Math.max(0, Math.min(1, x)); }
const openingTravelRaw = { x: 0.42, y: -0.91 };
const openingTravelLen = Math.hypot(openingTravelRaw.x, openingTravelRaw.y);
const openingTravelDir = { x: openingTravelRaw.x/openingTravelLen, y: openingTravelRaw.y/openingTravelLen };
const openingPerpDir = { x: -openingTravelDir.y, y: openingTravelDir.x };
const OPENING_SHIP_SPEED = 16, OPENING_CAM_BACK = 34, OPENING_CAM_SIDE = 58, OPENING_BANK = 0.16;

let openingSeqStart = null, openingDone = false;
function finishOpening(){
  if (openingDone) return;
  openingDone = true;
  document.getElementById("openingSkipHint").classList.remove("show");
  if (!meta.seenTutorial) showTutorial(0); else showMenu();
}
function skipOpening(){
  if (phase === "opening") finishOpening();
}
function renderOpening(now){
  if (openingSeqStart === null){ openingSeqStart = now; document.getElementById("openingSkipHint").classList.add("show"); }
  const t = (now - openingSeqStart) / 1000;
  const vw = window.innerWidth, vh = window.innerHeight;

  ctx.save();
  ctx.setTransform(Math.min(window.devicePixelRatio||1,2), 0, 0, Math.min(window.devicePixelRatio||1,2), 0, 0);
  ctx.clearRect(0, 0, vw, vh);
  ctx.translate(vw/2, vh/2);

  const shipX = openingTravelDir.x * OPENING_SHIP_SPEED * t;
  const shipY = openingTravelDir.y * OPENING_SHIP_SPEED * t;
  const revealProgress = openingEaseOutCubic(openingClamp01((t - OPENING_REVEAL_START) / (OPENING_REVEAL_END - OPENING_REVEAL_START)));
  const zoom = 10 - revealProgress * 9;
  const corePulseRate = 8 - revealProgress * 5;
  const engineAlpha = revealProgress;
  const shipRotation = revealProgress * OPENING_BANK;
  const camX = shipX - openingTravelDir.x*OPENING_CAM_BACK*revealProgress - openingPerpDir.x*OPENING_CAM_SIDE*revealProgress;
  const camY = shipY - openingTravelDir.y*OPENING_CAM_BACK*revealProgress - openingPerpDir.y*OPENING_CAM_SIDE*revealProgress;

  let titleAlpha = 0, fadeAlpha = 0;
  if (t >= OPENING_REVEAL_END) titleAlpha = openingClamp01((t - (OPENING_REVEAL_END+0.5)) / 1.0);
  if (t >= OPENING_HOLD_END){ fadeAlpha = openingClamp01((t - OPENING_HOLD_END) / (OPENING_FADE_END - OPENING_HOLD_END)); titleAlpha = 1; }

  ctx.scale(zoom, zoom);
  ctx.translate(-camX, -camY);
  drawOpeningBackground(t, camX, camY);
  drawOpeningShip(t, shipX, shipY, shipRotation, corePulseRate, engineAlpha);
  ctx.restore();

  if (titleAlpha > 0){
    ctx.save();
    ctx.globalAlpha = titleAlpha;
    ctx.textAlign = "center";
    ctx.fillStyle = "#E8EAF2";
    ctx.font = "600 " + Math.min(64, vw*0.09) + "px -apple-system, sans-serif";
    ctx.shadowColor = "rgba(207,251,255,0.5)"; ctx.shadowBlur = 20;
    ctx.fillText("A P H E L I O N", vw/2, vh*0.72);
    ctx.restore();
  }
  if (fadeAlpha > 0){
    ctx.fillStyle = "rgba(5,6,11," + fadeAlpha.toFixed(2) + ")";
    ctx.fillRect(0, 0, vw, vh);
  }
  if (t >= OPENING_FADE_END) finishOpening();
}

/* ---------- state ---------- */
let phase = "menu";   // opening | menu | playing | levelup | dead | shipyard | paused | stats | handbook | tutorial
let pausedFrom = "playing";   // which phase to restore to on resume
let player, enemies, projectiles, enemyProjectiles, particles, rings, orbs;
let activeRoster = ["drifter"], unlockPointer = 1;
let pendingLevelUps = [];
let survivalTime = 0, killCount = 0, lastSpawn = 0, spawnGunTimer = 0;
let lastFrameT = 0;
let ambientT = 0;   // always-advancing clock for background-only animation (star twinkle, debris drift) so the menu doesn't freeze
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const PLAYER_R = 15, PLAYER_SPEED = 240, PLAYER_MAX_HP = 100;
const PLAYER_INVULN_ON_HIT = 0.6;     // seconds of invulnerability after taking a hit
const WEAPON_RANGE = 420, WEAPON_COOLDOWN = 0.42, WEAPON_DAMAGE = 12, WEAPON_SPEED = 560, WEAPON_R = 4;
/* Enemy archetypes — introduced progressively via the roster/unlock system
   below (not a flat per-type timer), and get tougher the longer the run
   goes (enemyStatScale), so player power growth from leveling always has
   real pushback, not a plateaued threat. */
const ENEMY_TYPES = {
  drifter:  { r:13, hp:22, speed:78,  dmg:14, color:"#B24AF0", flashColor:"#F0C4FF", weight:3 },
  rusher:   { r:10, hp:12, speed:145, dmg:10, color:"#F0724A", flashColor:"#FFD8C0", weight:2 },
  brute:    { r:20, hp:70, speed:45,  dmg:24, color:"#7A4AF0", flashColor:"#DCC8FF", weight:1 },

/* Rotating roster: new types are introduced one at a time, either the
   instant a boss is defeated (rewarding the fight with fresh variety) or
   by a slower time fallback (so a struggling run still sees escalation).
   At most MAX_ACTIVE_TYPES are ever spawnable at once — introducing a 5th
   retires the oldest, keeping the screen legible rather than an ever-
   growing zoo of silhouettes. */
const UNLOCK_ORDER = ["drifter", "rusher", "brute", "splitter", "sentinel", "swarmer", "warden"];
const UNLOCK_TIME_FALLBACK = [0, 30, 90, 200, 350, 500, 650];
const MAX_ACTIVE_TYPES = 4;

function activateNextType(){
  if (unlockPointer >= UNLOCK_ORDER.length) return;
  activeRoster.push(UNLOCK_ORDER[unlockPointer]);
  unlockPointer++;
  if (activeRoster.length > MAX_ACTIVE_TYPES) activeRoster.shift();
}
function checkTimeUnlock(){
  while (unlockPointer < UNLOCK_ORDER.length && survivalTime >= UNLOCK_TIME_FALLBACK[unlockPointer]){
    activateNextType();
  }
}
function pickEnemyType(){
  const avail = activeRoster.map(k => [k, ENEMY_TYPES[k]]);
  const total = avail.reduce((a, [, v]) => a + v.weight, 0);
  let r = Math.random() * total;
  for (const [key, v] of avail){
    if (r < v.weight) return key;
    r -= v.weight;
  }
  return avail[avail.length - 1][0];
}

const CHARGE_TELEGRAPH_DURATION = 0.75;   // boss charge wind-up - slightly longer than before, giving the progressive "charging" visual room to build and read clearly
function xpForLevel(level){ return Math.floor(6 + level * 4 + level * level * 0.6); }

   tuning whatever you already have. Super level-ups are reserved for the
   two genuinely strategic choices: unlock a new weapon, or invest further

const SUPER_LEVEL_INTERVAL = 5;

function unlockWeapon(p, wid){

  else if (wid === "nova")  p.nova       = { dmgMult:1, radius:90, cooldownMult:1, timer:3.5 };

/* ---------- traits: real tradeoffs, not pure accumulation ----------
   Each picked at most once per run (no stacking a trait with itself),
   offered through the same super-level-up pool as weapons. Every trait
   pairs a genuine advantage with a genuine cost — some deliberately
   synergize or clash with specific weapons (Bulwark Stance rewards
   holding ground, pairing naturally with Satellites/Nova; Overdrive
   rewards mobility, pairing with a kiting Cannon/Beam build). They are
   NOT mutually exclusive — taking two with opposing philosophies (a
   deliberately odd hybrid) is allowed, not prevented. */
const TRAIT_DEFS = [
  { id:"trait_hull",    name:"Reinforced Hull",   desc:"+35 max hull, heals the gain \u2014 but \u221212% move speed",
    rawApply:p => { p.maxHpBonus += 35; p.hp += 35; p.speedMult *= 0.88; } },
  { id:"trait_overdrive", name:"Overdrive",       desc:"+20% move speed, +12% fire rate \u2014 but \u221218 max hull",
    rawApply:p => { p.speedMult *= 1.20; p.cooldownMult = Math.max(0.25, p.cooldownMult * 0.88); p.maxHpBonus -= 18; p.hp = Math.min(p.hp, maxHP()); } },
  { id:"trait_volatile", name:"Volatile Core",    desc:"+30% weapon damage \u2014 but +15% damage taken on contact",
    rawApply:p => { p.dmgMult *= 1.30; p.contactDmgReduction -= 0.15; } },
  { id:"trait_salvage",  name:"Salvage Protocol", desc:"+60% pickup range, +25% embers this run \u2014 but \u221212% weapon damage",
    rawApply:p => { p.magnetR *= 1.6; p.emberMult *= 1.25; p.dmgMult *= 0.88; } },
  { id:"trait_bulwark",  name:"Bulwark Stance",   desc:"+25% damage reduction (shares the 65% cap) \u2014 but \u221215% move speed",
    rawApply:p => { p.contactDmgReduction = Math.min(0.65, p.contactDmgReduction + 0.25); p.speedMult *= 0.85; } },
];
const TRAITS = TRAIT_DEFS.map(t => ({
  id: t.id, name: t.name, desc: t.desc, isTrait: true,
  apply: p => { t.rawApply(p); p.ownedTraits.push(t.id); }
}));

function buildSuperOfferPool(){
  const superIndex = player.level / SUPER_LEVEL_INTERVAL;   // 1, 2, 3... at levels 5, 10, 15...
  const isWeaponRound = superIndex % 2 === 1;   // odd = weapons (5, 15, 25...), even = traits (10, 20, 30...)
  const pool = [];
  if (isWeaponRound){
    if (player.ownedWeapons.length < MAX_WEAPONS){
      for (const wid of Object.keys(WEAPON_DEFS)){
        if (!player.ownedWeapons.includes(wid)){
          pool.push({ id:"unlock_"+wid, name:"Unlock: "+WEAPON_DEFS[wid].name, desc:WEAPON_DEFS[wid].unlockDesc, apply:p => unlockWeapon(p, wid) });
        }
      }
    }
    for (const wid of player.ownedWeapons){
      if (wid === "cannon") continue;   // cannon already grows every regular level
      for (const u of WEAPON_UPGRADES[wid]){
        if (u.maxed && u.maxed(player)) continue;
        pool.push(u);
      }
    }
  } else {
    for (const trait of TRAITS){
      if (!player.ownedTraits.includes(trait.id)) pool.push(trait);
    }
  }
  return pool;
}

/* ---------- meta-progression (persists across runs, this browser only) ---------- */
const META_KEY = "aphelion_meta_v1";
function loadMeta(){
  const DEFAULT_STATS = { totalRuns:0, totalKills:0, totalBossesDefeated:0, totalitiesReached:0, bestSurvivalTime:0, bestLevel:0, totalEmbersLifetime:0 };
  try {
    const raw = localStorage.getItem(META_KEY);
    const d = raw ? JSON.parse(raw) : {};
    return {
      embers: typeof d.embers === "number" ? d.embers : 0,
      tiers: Object.assign({ hull:0, dmg:0, speed:0, cooldown:0, magnet:0, regen:0 }, d.tiers || {}),
      revive: !!d.revive,
      stats: Object.assign({}, DEFAULT_STATS, d.stats || {}),
      achievements: Array.isArray(d.achievements) ? d.achievements : [],
      discovered: Array.isArray(d.discovered) ? d.discovered : [],
      seenTutorial: !!d.seenTutorial
    };
  } catch (e){ return { embers: 0, tiers: { hull:0, dmg:0, speed:0, cooldown:0, magnet:0, regen:0 }, revive: false, stats: DEFAULT_STATS, achievements: [], discovered: [], seenTutorial: false }; }
}
function saveMeta(){
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e){ /* storage unavailable — progress just won't persist */ }
}
let meta = loadMeta();

const META_MAX_TIER = 10;
function tieredCost(base, growth){ return t => Math.round(base * Math.pow(growth, t)); }
const META_UPGRADES = [
  { id:"hull",     name:"Hull Plating",     desc:"+3.5 starting max hull",       maxTier: META_MAX_TIER, cost: tieredCost(45, 1.55) },

  { id:"speed",    name:"Thruster Tuning",  desc:"+3% starting move speed",      maxTier: META_MAX_TIER, cost: tieredCost(45, 1.5) },
  { id:"cooldown", name:"Faster Cycling",   desc:"+3% starting fire rate",       maxTier: META_MAX_TIER, cost: tieredCost(58, 1.55) },

  { id:"regen",    name:"Nanite Repair",    desc:"+0.175 starting hull/sec",     maxTier: 6,             cost: tieredCost(70, 1.65) },
  { id:"revive",   name:"Emergency Thrusters", desc:"Survive one killing blow per run (one-time)", maxTier: 1, cost: () => 2800 },
];
function metaTier(id){ return id === "revive" ? (meta.revive ? 1 : 0) : meta.tiers[id]; }
function buyMetaUpgrade(id){
  const u = META_UPGRADES.find(x => x.id === id);
  const tier = metaTier(id);
  if (tier >= u.maxTier) return false;
  const price = u.cost(tier);
  if (meta.embers < price) return false;
  meta.embers -= price;
  if (id === "revive") meta.revive = true; else meta.tiers[id] += 1;
  checkAchievements();
  saveMeta();
  return true;
}

const ZONE_FULL_SHADOW_T = 420;             // by ~7 minutes, fully in "the world of shadows"
const ZONE_START_BG = [9, 10, 25];          // a darker, muted blue-violet — the Milky Way opening, toned down
const ZONE_END_BG   = [5, 6, 11];           // the game's original near-black void
function zoneProgress(t){ return Math.max(0, Math.min(1, t / ZONE_FULL_SHADOW_T)); }
function zoneBgColor(t){
  const p = zoneProgress(t);
  const r = Math.round(ZONE_START_BG[0] + (ZONE_END_BG[0]-ZONE_START_BG[0]) * p);
  const g = Math.round(ZONE_START_BG[1] + (ZONE_END_BG[1]-ZONE_START_BG[1]) * p);
  const b = Math.round(ZONE_START_BG[2] + (ZONE_END_BG[2]-ZONE_START_BG[2]) * p);
  return "rgb(" + r + "," + g + "," + b + ")";
}

function updateLifetimeStats(isVictory, embersEarned){
  // Delta-based: a run that beats Totality, continues drifting, and later
  // dies passes through here twice — only count what's new since the last
  // banking, and count the run itself exactly once.
  const s = meta.stats;
  if (!statsCounted.runCounted){ s.totalRuns += 1; statsCounted.runCounted = true; }
  s.totalKills += killCount - statsCounted.kills;
  s.totalBossesDefeated += bossesDefeated - statsCounted.bosses;
  statsCounted.kills = killCount;
  statsCounted.bosses = bossesDefeated;
  if (isVictory) s.totalitiesReached += 1;
  s.bestSurvivalTime = Math.max(s.bestSurvivalTime, survivalTime);
  s.bestLevel = Math.max(s.bestLevel, player.level);
  s.totalEmbersLifetime += embersEarned;
}

  if (meta.stats.totalitiesReached >= 1) unlockAchievement("ach_totality");
  if (meta.stats.bestSurvivalTime >= 600) unlockAchievement("ach_deep_diver");
  if (meta.stats.totalBossesDefeated >= 25) unlockAchievement("ach_veteran");
  if (meta.stats.totalRuns >= 10) unlockAchievement("ach_voyager");

  saveMeta();
}

  };
  enemies = []; projectiles = []; enemyProjectiles = []; particles = []; rings = []; orbs = [];
  activeRoster = ["drifter"]; unlockPointer = 1;
  pendingLevelUps = [];
  survivalTime = 0; killCount = 0; lastSpawn = 0; spawnGunTimer = 0; shake = 0; coronaFlash = 0;
  runEmbers = 0;
  statsCounted = { kills:0, bosses:0, runCounted:false };
  nextBossTime = 120; bossWarningShown = false; bossesSpawned = 0; bossesDefeated = 0; bossBanner = null;

/* ---------- audio ----------
   One AudioContext, lazily created on first interaction (browser autoplay
   policy). Two buses (SFX, Music) feed a master gain, so the Audio Design
   Bible's mixing ratios are just gain values, not a maze of one-offs.
   Music is live-synthesized layered pads, not sample loops — nothing to
   "loop" since the oscillators just keep running. */
let AC = null, busMaster = null, busSfx = null, busMusic = null, musicMix = null;
let muted = readMutePref();
let musicMode = "menu", musicLayers = null, reverbBuf = null, musicFilter = null;

function readMutePref(){
  try { return localStorage.getItem("aphelion_muted") === "1"; } catch (e){ return false; }
}
function audioInit(){
  if (AC || muted) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    busMaster = AC.createGain(); busMaster.gain.value = 1; busMaster.connect(AC.destination);
    busSfx = AC.createGain(); busSfx.gain.value = 0.9; busSfx.connect(busMaster);
    busMusic = AC.createGain(); busMusic.gain.value = 0.15; busMusic.connect(busMaster);
    startMusic();
    setMusicMode(musicMode, true);
  } catch (e){ /* audio unavailable — game stays fully playable, just silent */ }
}
function toggleMute(){
  muted = !muted;
  try { localStorage.setItem("aphelion_muted", muted ? "1" : "0"); } catch (e){}
  const btn = document.getElementById("btnMute");
  if (btn) btn.innerHTML = muted ? "M &middot; SOUND OFF" : "M &middot; SOUND ON";
  if (!muted){ audioInit(); if (busMaster) busMaster.gain.setTargetAtTime(1, AC.currentTime, 0.05); }
  else if (busMaster) busMaster.gain.setTargetAtTime(0, AC.currentTime, 0.05);
}

/* ---- SFX primitives ---- */
function sfxTone(freq, dur, type, gain, slideTo){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), AC.currentTime + dur);
  g.gain.setValueAtTime(gain, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g).connect(busSfx);
  o.start(); o.stop(AC.currentTime + dur);
}
function sfxNoise(dur, gain, filterFreq, filterType){
  if (!AC || muted) return;
  const n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const filt = AC.createBiquadFilter(); filt.type = filterType || "bandpass"; filt.frequency.value = filterFreq || 1000;
  const g = AC.createGain();
  g.gain.setValueAtTime(gain, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  src.connect(filt).connect(g).connect(busSfx);
  src.start(); src.stop(AC.currentTime + dur);
}
function getReverb(){
  if (reverbBuf || !AC) return reverbBuf;
  const dur = 2.2, decay = 2.5, len = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const data = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  reverbBuf = buf;
  return reverbBuf;
}
function sfxImpact(){   // "one deep impact" — the signature boss-spawn sound
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(70, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(32, AC.currentTime + 0.9);
  g.gain.setValueAtTime(0.62, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 1.3);
  o.connect(g); g.connect(busSfx);
  const rv = getReverb();
  if (rv){
    const conv = AC.createConvolver(); conv.buffer = rv;
    const wet = AC.createGain(); wet.gain.value = 0.52;
    g.connect(conv).connect(wet).connect(busSfx);
  }
  o.start(); o.stop(AC.currentTime + 1.3);
}
function sfxBossArrival(){
  // A sustained, vibrating bass rumble that fills the gap between the
  // impact hit and the boss music layer fully settling in (2.2s, timed to
  // match setMusicMode's ramp) — the arrival isn't just a hit, it's a
  // presence that takes a moment to fully manifest.
  if (!AC || muted) return;
  const dur = 2.2;
  const o = AC.createOscillator(), filt = AC.createBiquadFilter(), g = AC.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(52, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(38, AC.currentTime + dur);
  filt.type = "lowpass"; filt.frequency.value = 220;
  g.gain.setValueAtTime(0.0001, AC.currentTime);
  g.gain.linearRampToValueAtTime(0.17, AC.currentTime + 0.25);
  g.gain.linearRampToValueAtTime(0.0001, AC.currentTime + dur);
  const trem = AC.createOscillator(); trem.frequency.value = 6;
  const tremGain = AC.createGain(); tremGain.gain.value = 0.05;
  trem.connect(tremGain).connect(g.gain);
  o.connect(filt).connect(g); g.connect(busSfx);
  const rv = getReverb();
  if (rv){
    const conv = AC.createConvolver(); conv.buffer = rv;
    const wet = AC.createGain(); wet.gain.value = 0.40;
    g.connect(conv).connect(wet).connect(busSfx);
  }
  o.start(); o.stop(AC.currentTime + dur);
  trem.start(); trem.stop(AC.currentTime + dur);
}

/* ---- the 11 MVP sound effects ---- */
function sfxWeaponFire(pitchMul){ pitchMul = pitchMul || 1; sfxTone((680 + Math.random()*40) * pitchMul, 0.05, "square", 0.035, 500*pitchMul); }
function sfxEnemyHit(){ sfxNoise(0.05, 0.045, 900, "bandpass"); }
function sfxEnemyDeath(){ sfxNoise(0.16, 0.09, 500, "bandpass"); sfxTone(180, 0.15, "sawtooth", 0.05, 80); }
function sfxPlayerDamage(){ sfxTone(140, 0.18, "sawtooth", 0.16, 55); sfxNoise(0.12, 0.12, 300, "lowpass"); }
function sfxXpPickup(){ sfxTone(880, 0.08, "sine", 0.045, 1400); }
function sfxLevelUp(){
  sfxTone(523, 0.12, "sine", 0.08);
  setTimeout(() => sfxTone(659, 0.12, "sine", 0.08), 90);
  setTimeout(() => sfxTone(784, 0.22, "sine", 0.09), 180);
}
function sfxButtonHover(){ sfxTone(420, 0.04, "sine", 0.018, 460); }
function sfxButtonClick(){ sfxTone(520, 0.06, "sine", 0.05, 720); }
function sfxBossWarning(){ sfxTone(60, 2.2, "sine", 0.13, 48); }
function sfxBossSpawn(){ sfxImpact(); sfxBossArrival(); }
function sfxBossDeath(){ sfxNoise(0.5, 0.15, 350, "bandpass"); sfxTone(90, 0.6, "sawtooth", 0.12, 28); }
function sfxBossVictorySting(noteCount){
  // A growing arpeggio, one G major run - boss 1 gets just the root note
  // (unchanged from before), each subsequent boss adds the next note up,
  // building toward a full 6-note run at Totality. Capped at 6 for any
  // boss beyond that, so the climax stays a climax rather than growing
  // forever. Tight spacing (not the old slow, even spacing that read as
  // an elevator) so even the full run feels like one quick, satisfying
  // ascending sparkle.
  if (!AC || muted) return;
  const fullArpeggio = [392.00, 493.88, 587.33, 783.99, 987.77, 1174.66];   // G4, B4, D5, G5, B5, D6
  const notes = fullArpeggio.slice(0, Math.max(1, Math.min(6, noteCount || 1)));
  notes.forEach((freq, i) => {
    setTimeout(() => {
      if (!AC || muted) return;
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(freq, AC.currentTime);
      g.gain.setValueAtTime(0.17, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.6);
      o.connect(g); g.connect(busSfx);
      const rv = getReverb();
      if (rv){
        const conv = AC.createConvolver(); conv.buffer = rv;
        const wet = AC.createGain(); wet.gain.value = 0.52;
        g.connect(conv).connect(wet).connect(busSfx);
      }
      o.start(); o.stop(AC.currentTime + 0.6);
    }, i * 100);
  });
}

/* ---- music: layered synthesized pads, mode-based, with the Dimming
   Universe mechanic tying gameplay layers to the same zoneProgress()
   already driving the visuals ---- */
const MUSIC_MODES = {
  menu:     { drone:65,   warm:[130.8,164.8,196.0], shimmer:[523.25,659.25], lfo:0.05 },
  gameplay: { drone:55,   warm:[110.0,138.6,165.0], shimmer:[440.0,554.4],   lfo:0.04 },
  boss:     { drone:41.2, warm:[98.0,116.55,138.6], shimmer:[],              lfo:0.09 },
  death:    { drone:36.7, warm:[],                  shimmer:[],             lfo:0.03 },
};

function makeLayer(freqs, type, gainVal, dest, lfoRate){
  const g = AC.createGain(); g.gain.value = 0; g.connect(dest);
  const oscs = freqs.map(f => {
    const o = AC.createOscillator(); o.type = type; o.frequency.value = f;
    o.detune.value = (Math.random() - 0.5) * 8;
    o.connect(g); o.start();
    return o;
  });
  let lfo = null;
  if (lfoRate){
    lfo = AC.createOscillator(); lfo.frequency.value = lfoRate;
    const lfoGain = AC.createGain(); lfoGain.gain.value = gainVal * 0.35;
    lfo.connect(lfoGain).connect(g.gain);
    lfo.start();
  }
  return { gain: g, oscs, lfo, base: gainVal };
}
function makeNoiseLayer(gainVal, dest){
  const bufSize = AC.sampleRate * 2;
  const buf = AC.createBuffer(1, bufSize, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const filt = AC.createBiquadFilter(); filt.type = "highpass"; filt.frequency.value = 4000;
  const g = AC.createGain(); g.gain.value = 0;
  src.connect(filt).connect(g).connect(dest);
  src.start();
  return { gain: g, base: gainVal };
}
function addDetuneDrift(layer, rate){
  // Slow, gentle pitch breathing — a static drone with truly zero pitch
  // movement reads as monotone no matter how nice the tone is. Each
  // oscillator drifts at a slightly different rate so they don't wobble
  // in lockstep (which would sound mechanical rather than organic).
  layer.oscs.forEach((o, i) => {
    const lfo = AC.createOscillator();
    lfo.frequency.value = rate * (0.8 + i * 0.15);
    const lfoGain = AC.createGain(); lfoGain.gain.value = 6;   // +/- 6 cents, subtle
    lfo.connect(lfoGain).connect(o.detune);
    lfo.start();
  });
}
function startMusic(){
  if (!AC || musicLayers) return;
  musicMix = AC.createGain(); musicMix.gain.value = 0;

  // A slow-sweeping lowpass filter on the whole mix — this is the fix for
  // both "too high" and "monotone" at once: as it closes, brightness
  // drops with it, and the sweep itself is the movement that was missing.
  musicFilter = AC.createBiquadFilter();
  musicFilter.type = "lowpass";
  musicFilter.frequency.value = 1200;
  musicMix.connect(musicFilter);
  musicFilter.connect(busMusic);
  const filterLfo = AC.createOscillator();
  filterLfo.frequency.value = 1 / 48;   // one full sweep every 48 seconds
  const filterLfoGain = AC.createGain(); filterLfoGain.gain.value = 700;   // sweeps roughly 500Hz-1900Hz
  filterLfo.connect(filterLfoGain).connect(musicFilter.frequency);
  filterLfo.start();

  musicLayers = {
    drone:   makeLayer([0], "sine", 0.06, musicMix, null),
    sub:     makeLayer([0], "sine", 0.05, musicMix, null),
    warm:    makeLayer([0,0,0], "triangle", 0.035, musicMix, 0.06),
    shimmer: makeLayer([0,0], "sine", 0.012, musicMix, 0.05),
    air:     makeNoiseLayer(0.015, musicMix),
  };
  addDetuneDrift(musicLayers.warm, 0.09);
  musicMix.gain.setTargetAtTime(1, AC.currentTime, 1.5);
}
function setMusicMode(mode, instant){
  musicMode = mode;
  if (!AC || !musicLayers) return;
  const md = MUSIC_MODES[mode];
  const t = AC.currentTime, ramp = instant ? 0.01 : 2.2;
  musicLayers.drone.oscs[0].frequency.linearRampToValueAtTime(md.drone, t + ramp);
  musicLayers.sub.oscs[0].frequency.linearRampToValueAtTime(md.drone / 2, t + ramp);
  musicLayers.drone.gain.gain.linearRampToValueAtTime(musicLayers.drone.base, t + ramp);
  musicLayers.sub.gain.gain.linearRampToValueAtTime(musicLayers.sub.base, t + ramp);
  const warmFreqs = md.warm.length ? md.warm : [md.drone*4, md.drone*5, md.drone*6];
  musicLayers.warm.oscs.forEach((o,i) => o.frequency.linearRampToValueAtTime(warmFreqs[i % warmFreqs.length], t + ramp));
  musicLayers.warm.gain.gain.linearRampToValueAtTime(md.warm.length ? musicLayers.warm.base : 0, t + ramp);
  const shimFreqs = md.shimmer.length ? md.shimmer : [md.drone*8, md.drone*10];
  musicLayers.shimmer.oscs.forEach((o,i) => o.frequency.linearRampToValueAtTime(shimFreqs[i % shimFreqs.length], t + ramp));
  musicLayers.shimmer.gain.gain.linearRampToValueAtTime(md.shimmer.length ? musicLayers.shimmer.base : 0, t + ramp);
  musicLayers.air.gain.gain.linearRampToValueAtTime(mode === "gameplay" ? musicLayers.air.base : 0, t + ramp);
}
function duckMusicForWarning(){
  if (!musicMix || !AC) return;
  musicMix.gain.setTargetAtTime(0.04, AC.currentTime, 0.8);   // near-silence by the time the banner expires
}
function swellMusicForBoss(){
  if (!musicMix || !AC) return;
  musicMix.gain.setTargetAtTime(1, AC.currentTime, 0.15);     // fast attack right after the impact
  setMusicMode("boss");
}
function updateMusicDimming(){
  // The Dimming Universe: gameplay's shimmer/air/warm layers fade with the
  // SAME zoneProgress already driving the visual nebula fade — sound and
  // sight dim in lockstep, no separate timeline to maintain.
  if (!AC || !musicLayers || musicMode !== "gameplay") return;
  const fade = 1 - zoneProgress(survivalTime);
  musicLayers.shimmer.gain.gain.setTargetAtTime(musicLayers.shimmer.base * fade, AC.currentTime, 0.6);
  musicLayers.air.gain.gain.setTargetAtTime(musicLayers.air.base * fade, AC.currentTime, 0.6);
  musicLayers.warm.gain.gain.setTargetAtTime(musicLayers.warm.base * (0.4 + 0.6*fade), AC.currentTime, 0.6);
  // drone + sub deliberately untouched — "what's left is drone, sub bass, silence"
}

/* ---------- input ----------
   Keyboard (desktop) and a drag-anywhere virtual joystick (touch) —
   same "don't require touching a specific spot" lesson learned from
   Perihelion's aim controls. */
const keys = new Set();
window.addEventListener("keydown", e => {
  keys.add(e.key.toLowerCase());
  if (e.key === " ") e.preventDefault();
  audioInit();
});
window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
document.addEventListener("visibilitychange", () => {
  // mobile tab switches / app backgrounding fire this rather than blur
  if (document.hidden){
    keys.clear();
    stickActive = false; stickDX = 0; stickDY = 0;
    if (phase === "playing") showPause();
  }
});
window.addEventListener("blur", () => {
  // A keyup fired while unfocused never reaches us — without this, alt-tab
  // with a movement key held leaves the ship drifting on its own. Also
  // auto-pause: nobody wants to come back to a dead ship.
  keys.clear();
  stickActive = false; stickDX = 0; stickDY = 0;
  if (phase === "playing") showPause();
});

let stickActive = false, stickOriginX = 0, stickOriginY = 0, stickDX = 0, stickDY = 0;
const STICK_MAX = 55;
cv.addEventListener("pointerdown", e => {
  audioInit();
  if (phase === "opening"){ skipOpening(); return; }
  if (phase !== "playing") return;   // the card itself handles its own clicks when not playing
  stickActive = true;
  const p = toLogical(e.clientX, e.clientY);
  stickOriginX = p.x; stickOriginY = p.y; stickDX = 0; stickDY = 0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!stickActive) return;
  const p = toLogical(e.clientX, e.clientY);
  let dx = p.x - stickOriginX, dy = p.y - stickOriginY;
  const m = Math.hypot(dx, dy);
  if (m > STICK_MAX){ dx = dx / m * STICK_MAX; dy = dy / m * STICK_MAX; }
  stickDX = dx; stickDY = dy;
});
cv.addEventListener("pointerup", () => { stickActive = false; stickDX = 0; stickDY = 0; });
window.addEventListener("keydown", e => {
  if (phase === "opening"){ skipOpening(); return; }
  if (e.key === "m" || e.key === "M") toggleMute();
  if (e.key === " " && (phase === "menu" || phase === "dead")) advanceCard();
  if (e.key === "Escape"){
    if (phase === "playing" || phase === "levelup") showPause();
    else if (phase === "paused") resumeFromPause();
  }
  if (phase === "levelup" && ["1","2","3"].includes(e.key)){
    const idx = parseInt(e.key, 10) - 1;
    if (pendingLevelUps[0] && pendingLevelUps[0].offers[idx]) chooseUpgrade(idx);
  }
});
document.getElementById("btnMute").addEventListener("click", toggleMute);
document.getElementById("btnMute").innerHTML = muted ? "M &middot; SOUND OFF" : "M &middot; SOUND ON";
document.getElementById("btnPause").addEventListener("click", () => {
  if (phase === "playing" || phase === "levelup") showPause();
});

function moveVector(){
  let dx = 0, dy = 0;
  if (keys.has("w") || keys.has("arrowup")) dy -= 1;
  if (keys.has("s") || keys.has("arrowdown")) dy += 1;
  if (keys.has("a") || keys.has("arrowleft")) dx -= 1;
  if (keys.has("d") || keys.has("arrowright")) dx += 1;
  if (dx || dy){ const m = Math.hypot(dx, dy); return { x: dx/m, y: dy/m }; }
  if (stickActive && (stickDX || stickDY)){
    const m = Math.hypot(stickDX, stickDY);
    return { x: stickDX/m * Math.min(1, m/STICK_MAX), y: stickDY/m * Math.min(1, m/STICK_MAX) };
  }
  return { x: 0, y: 0 };
}

function showPause(){

function resumeFromPause(){

function showVictory(){
  phase = "dead";
  setMusicMode("menu");   // the warmest of the four tracks — light returning, not resolution into silence
  const mins = Math.floor(survivalTime / 60), secs = Math.floor(survivalTime % 60);
  const bonus = player.level * 3 + Math.floor(survivalTime / 20) * 1;
  const totalEarned = Math.round((runEmbers + bonus) * player.emberMult);
  meta.embers += totalEarned;
  runEmbers = 0;   // banked — a post-Totality death only awards what's earned after this point
  updateLifetimeStats(true, totalEarned);
  checkAchievements();
  saveMeta();
  statsCounted.bonusBanked = player.level * 3 + Math.floor(survivalTime / 20) * 1;
  cKick.textContent = "TOTALITY BROKEN";
  cTitle.textContent = "Turning Toward Perihelion";
  cBody.innerHTML = "The dark could not hold what still burned. You turn back toward the light, and it is enough." +
    "<br><br>SURVIVED " + mins + ":" + String(secs).padStart(2,"0") +
    "<br>LEVEL " + player.level + " · " + killCount + " CLEARED · " + bossesDefeated + " OCCLUSIONS DEFEATED" +
    '<br><br><span class="good">+' + totalEarned + " EMBERS</span> (" + runEmbers + " salvaged + " + bonus + " for reaching level " + player.level +
    (player.emberMult !== 1 ? " \u00d7 " + player.emberMult.toFixed(2) + " Salvage Protocol" : "") + ")" +
    "<br>" + meta.embers + " EMBERS BANKED" +
    '<div class="menuBtns">' +
      '<button class="menuBtn" data-action="resume"><b>Continue Drifting</b><small>the dark is not finished with you yet</small></button>' +
      '<button class="menuBtn" data-action="back"><b>Return to Light</b><small>a good place to stop</small></button>' +
    '</div>';
  cGo.textContent = "";
  cardEl.classList.add("on");
}

function showDeath(){
  phase = "dead";
  setMusicMode("death");
  const mins = Math.floor(survivalTime / 60), secs = Math.floor(survivalTime % 60);
  const bonus = Math.max(0, player.level * 3 + Math.floor(survivalTime / 20) * 1 - (statsCounted.bonusBanked || 0));
  const totalEarned = Math.round((runEmbers + bonus) * player.emberMult);
  meta.embers += totalEarned;
  updateLifetimeStats(false, totalEarned);
  checkAchievements();
  saveMeta();
  const epitaph = bossesDefeated >= 3 ? "Even Totality remembers this one."
    : bossesDefeated >= 1 ? "You lasted longer than the light usually does."
    : "The dark barely noticed you.";
  cKick.textContent = "HULL BREACH";
  cTitle.textContent = "Lost At Aphelion";
  cBody.innerHTML = "SURVIVED " + mins + ":" + String(secs).padStart(2,"0") +
    "<br>LEVEL " + player.level + " · " + killCount + " CLEARED" +
    (bossesDefeated > 0 ? " · " + bossesDefeated + " OCCLUSION" + (bossesDefeated > 1 ? "S" : "") + " DEFEATED" : "") +
    '<br><br><span class="good">+' + totalEarned + " EMBERS</span> (" + runEmbers + " salvaged + " + bonus + " for reaching level " + player.level +
    (player.emberMult !== 1 ? " \u00d7 " + player.emberMult.toFixed(2) + " Salvage Protocol" : "") + ")" +
    "<br>" + meta.embers + " EMBERS BANKED" +
    '<br><br><span style="color:var(--dim);font-style:italic">' + epitaph + '</span>' +
    '<div class="menuBtns">' +
      '<button class="menuBtn" data-action="launch"><b>Try Again</b><small>begin a new drift</small></button>' +
      '<button class="menuBtn" data-action="shipyard"><b>Shipyard</b><small>spend what you salvaged</small></button>' +
    '</div>';
  cGo.textContent = "click try again, or press space";
  cardEl.classList.add("on");
}

function showStats(){
  phase = "stats";
  hideHud();
  cKick.textContent = "RECORDS";
  cTitle.textContent = "Lifetime";
  const s = meta.stats;
  const mins = Math.floor(s.bestSurvivalTime / 60), secs = Math.floor(s.bestSurvivalTime % 60);
  const statRows = [
    ["Runs completed", s.totalRuns],
    ["Total kills", s.totalKills],
    ["Occlusions defeated", s.totalBossesDefeated],
    ["Times broken free (Totality)", s.totalitiesReached],
    ["Best survival", mins + ":" + String(secs).padStart(2,"0")],
    ["Best level reached", s.bestLevel],
    ["Embers earned (lifetime)", s.totalEmbersLifetime],
  ];
  const achRows = ACHIEVEMENTS.map(a => {
    const unlocked = meta.achievements.includes(a.id);

      '<span class="' + (unlocked ? "good" : "") + '">' + (unlocked ? "\u2713" : "\u2014") + '</span></div>';
  }).join("");

    '</div><div class="sectionLabel">ACHIEVEMENTS \u00b7 ' + meta.achievements.length + '/' + ACHIEVEMENTS.length + '</div>' +
    '<div class="shopList">' + achRows + '</div>' +
    '<button class="menuBtn backBtn" data-action="back"><b>Back</b></button>';

}

function showHandbook(){
  phase = "handbook";
  hideHud();
  cKick.textContent = "DISCOVERED " + meta.discovered.length + " / " + (Object.keys(HANDBOOK_CREATURES).length + Object.keys(HANDBOOK_OCCLUSIONS).length);
  cTitle.textContent = "Handbook";
  function rows(dict, prefix){
    return Object.keys(dict).map(key => {
      const discoveryId = prefix ? prefix + key : key;
      const known = meta.discovered.includes(discoveryId);
      const entry = dict[key];
      return '<div class="shopRow"><div class="shopInfo"><b>' + (known ? entry.name : "???") + '</b><small>' + (known ? entry.flavor : "Not yet encountered.") + '</small></div></div>';
    }).join("");
  }
  cBody.innerHTML = '<div class="sectionLabel">CREATURES</div>' +
    '<div class="shopList">' + rows(HANDBOOK_CREATURES, "") + '</div>' +
    '<div class="sectionLabel">OCCLUSIONS</div>' +
    '<div class="shopList">' + rows(HANDBOOK_OCCLUSIONS, "occlusion_") + '</div>' +
    '<button class="menuBtn backBtn" data-action="back"><b>Back</b></button>';
