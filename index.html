<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Aphelion — you've drifted to the farthest, coldest point of the orbit. Something in the dark has noticed. Survive.">
<meta name="theme-color" content="#05060B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060B'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%234AD9F0'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23B24AF0' stroke-width='1.5' opacity='0.6'/%3E%3C/svg%3E">
<title>Aphelion</title>
<style>
  :root{
    --space:#05060B; --ink:#E8EAF2; --dim:#5A6478;
    --player:#4AD9F0; --enemy:#B24AF0; --warn:#F04A6A;
    --mono:'SF Mono',ui-monospace,Consolas,monospace; --sans:'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--space)}
  body{font-family:var(--mono);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{position:fixed;inset:0;display:block}

  #hud{position:fixed;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 18px 0}
  #hud.hidden{display:none}
  #topRow{display:flex;justify-content:space-between;align-items:flex-start}
  #timer{font-family:var(--sans);font-size:22px;font-weight:600;letter-spacing:.05em;font-variant-numeric:tabular-nums}
  #kills{color:var(--dim);font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-top:4px}
  #hpWrap{width:min(46vw,220px)}
  #hpLabel{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;text-align:right;margin-bottom:4px}
  #hpBar{height:7px;border:1px solid #2A3145;border-radius:4px;overflow:hidden;background:#0C0F1A}
  #hpFill{height:100%;background:var(--player);width:100%;transition:width .15s ease,background .3s ease}
  #hpFill.low{background:var(--warn)}
  #xpWrap{display:flex;align-items:center;gap:10px;margin-top:10px}
  #levelTag{font-size:10px;letter-spacing:.15em;color:var(--dim);white-space:nowrap}
  #xpBar{flex:1;height:4px;border:1px solid #2A3145;border-radius:3px;overflow:hidden;background:#0C0F1A}
  #xpFill{height:100%;background:#8CF0B2;width:0%;transition:width .2s ease}
  #bossBannerEl{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);
    font-family:var(--sans);font-size:clamp(18px,4vw,28px);font-weight:600;letter-spacing:.2em;
    color:#0A0508;-webkit-text-stroke:1.5px #E8304A;text-transform:uppercase;
    text-shadow:0 0 3px #E8304A, 0 0 18px rgba(232,48,74,0.85), 0 0 40px rgba(160,10,30,0.6);
    opacity:0;transition:opacity .4s ease;pointer-events:none;text-align:center;white-space:nowrap}
  #bossBannerEl.show{opacity:1}
  #loreBannerEl{position:fixed;top:62%;left:50%;transform:translate(-50%,-50%);
    font-family:var(--sans);font-size:clamp(12px,2.6vw,16px);font-weight:400;letter-spacing:.08em;
    color:rgba(200,205,225,0.75);font-style:italic;
    opacity:0;transition:opacity 1.8s ease;pointer-events:none;text-align:center;
    max-width:80vw;white-space:normal}
  #loreBannerEl.show{opacity:1}
  #btnMute{position:fixed;top:max(14px,env(safe-area-inset-top));right:16px;z-index:5;
    background:none;border:1px solid #2A3145;color:var(--dim);font-family:var(--mono);
    font-size:10px;letter-spacing:.1em;padding:6px 10px;border-radius:5px;cursor:pointer}
  #btnMute:hover{border-color:var(--player);color:var(--ink)}

  #card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,6,11,0);transition:background .5s;pointer-events:none}
  #card.on{background:rgba(5,6,11,.78);pointer-events:auto;cursor:pointer}
  #cardBox{text-align:center;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;
    max-width:min(520px,90vw)}
  #card.on #cardBox{opacity:1;transform:none}
  #cardKick{color:var(--dim);font-size:12px;letter-spacing:.28em;text-transform:uppercase}
  #cardTitle{font-family:var(--sans);font-size:clamp(30px,7vw,54px);font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;margin:12px 0 16px;color:var(--ink)}
  #cardBody{font-size:13px;line-height:1.9;color:var(--ink)}
  #cardBody .warn{color:var(--warn)} #cardBody .good{color:var(--player)}
  #cardGo{margin-top:26px;font-size:11px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
  .upgradeBtns{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .upgradeBtn{background:none;border:1px solid #2A3145;color:var(--ink);font-family:var(--mono);
    text-align:left;padding:12px 16px;border-radius:6px;cursor:pointer;font-size:13px}
  .upgradeBtn b{display:block;font-family:var(--sans);font-weight:600;letter-spacing:.03em}
  .upgradeBtn small{display:block;color:var(--dim);font-size:11px;letter-spacing:.04em;margin-top:4px}
  .upgradeBtn:hover{border-color:var(--player)}
  .upgradeBtn:hover small{color:var(--ink)}
  .upgradeBtn:focus-visible{outline:2px solid var(--player);outline-offset:2px}
  .superUpgradeBtn{border-color:#8CF0B2}
  .superUpgradeBtn:hover{border-color:#F0D060}
  .superUpgradeBtn b{color:#F0D060}
  .traitUpgradeBtn{border-color:#E8834A}
  .traitUpgradeBtn:hover{border-color:#F0A060}
  .traitUpgradeBtn b{color:#F0A060}

  .menuBtns{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .menuBtn{background:none;border:1px solid #2A3145;color:var(--ink);font-family:var(--mono);
    text-align:left;padding:12px 16px;border-radius:6px;cursor:pointer;font-size:13px}
  .menuBtn b{display:block;font-family:var(--sans);font-weight:600;letter-spacing:.03em}
  .menuBtn small{display:block;color:var(--dim);font-size:11px;letter-spacing:.04em;margin-top:4px}
  .menuBtn:hover{border-color:var(--player)}
  .menuBtn:hover small{color:var(--ink)}
  .menuBtn:focus-visible{outline:2px solid var(--player);outline-offset:2px}
  .backBtn{margin-top:16px;text-align:center}

  .shopList{display:flex;flex-direction:column;gap:8px;margin-top:6px;max-height:52vh;overflow-y:auto}
  .shopRow{display:flex;align-items:center;justify-content:space-between;gap:14px;
    border:1px solid #2A3145;border-radius:6px;padding:10px 14px;text-align:left}
  .shopInfo b{display:block;font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.03em}
  .shopInfo small{display:block;color:var(--dim);font-size:11px;margin-top:3px}
  .shopBuy{flex-shrink:0;background:none;border:1px solid #8CF0B2;color:#8CF0B2;font-family:var(--mono);
    padding:8px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}
  .shopBuy:hover:not(:disabled){background:rgba(140,240,178,0.12)}
  .shopBuy:disabled{border-color:#2A3145;color:var(--dim);cursor:not-allowed}

  @media (prefers-reduced-motion: reduce){ #card,#cardBox,#hpFill{transition:none} }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="topRow">
    <div>
      <div id="timer">0:00</div>
      <div id="kills">0 CLEARED</div>
    </div>
    <div id="hpWrap">
      <div id="hpLabel">HULL</div>
      <div id="hpBar"><div id="hpFill"></div></div>
    </div>
  </div>
  <div id="xpWrap">
    <div id="levelTag">LV 1</div>
    <div id="xpBar"><div id="xpFill"></div></div>
  </div>
  <div id="bossBannerEl"></div>
  <div id="loreBannerEl"></div>
</div>
<button id="btnMute" title="Sound (M)">M &middot; SOUND ON</button>

<div id="card">
  <div id="cardBox">
    <div id="cardKick"></div>
    <div id="cardTitle"></div>
    <div id="cardBody"></div>
    <div id="cardGo"></div>
  </div>
</div>

<script>
"use strict";

/* ---------- canvas / scaling ---------- */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const W = 1000, H = 640;   // logical arena size, bounded (no camera scroll — matches Perihelion's approach)
let scale = 1, offX = 0, offY = 0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
  cv.width = vw * dpr; cv.height = vh * dpr;
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function toLogical(clientX, clientY){
  return { x: (clientX - offX) / scale, y: (clientY - offY) / scale };
}

/* ---------- state ---------- */
let phase = "menu";   // menu | playing | levelup | dead | shipyard
let player, enemies, projectiles, enemyProjectiles, particles, rings, orbs;
let activeRoster = ["drifter"], unlockPointer = 1;
let pendingLevelUps = [];
let survivalTime = 0, killCount = 0, lastSpawn = 0, spawnGunTimer = 0;
let lastFrameT = 0;
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const PLAYER_R = 15, PLAYER_SPEED = 240, PLAYER_MAX_HP = 100;
const PLAYER_INVULN_ON_HIT = 0.6;     // seconds of invulnerability after taking a hit
const WEAPON_RANGE = 420, WEAPON_COOLDOWN = 0.42, WEAPON_DAMAGE = 12, WEAPON_SPEED = 560, WEAPON_R = 4;
/* Enemy archetypes — introduced progressively via the roster/unlock system
   below (not a flat per-type timer), and get tougher the longer the run
   goes (enemyStatScale), so player power growth from leveling always has
   real pushback, not a plateaued threat. */
const ENEMY_TYPES = {
  drifter:  { r:13, hp:22, speed:78,  dmg:14, color:"#B24AF0", flashColor:"#F0C4FF", weight:3 },
  rusher:   { r:10, hp:12, speed:145, dmg:10, color:"#F0724A", flashColor:"#FFD8C0", weight:2 },
  brute:    { r:20, hp:70, speed:45,  dmg:24, color:"#7A4AF0", flashColor:"#DCC8FF", weight:1 },
  splitter: { r:16, hp:65, speed:60,  dmg:12, color:"#2FA88A", flashColor:"#8AF0D0", weight:2, splits:true },
  sentinel: { r:15, hp:18, speed:22,  dmg:8,  color:"#4A7AD8", flashColor:"#A8C8FF", weight:1, shooter:true },
  swarmer:  { r:7,  hp:10, speed:135, dmg:6,  color:"#B8D84A", flashColor:"#E8F0A0", weight:2, pack:true },
  warden:   { r:19, hp:95, speed:55,  dmg:26, color:"#150826", flashColor:"#D8B8F0", weight:1 },
};
function enemyStatScale(t){
  return { hp: 1 + t * 0.0105, dmg: 1 + t * 0.0055 };   // dialed back from last round's 0.013/0.007 - that, combined with the DPS trim below, hit early-game too hard at once
}

/* Rotating roster: new types are introduced one at a time, either the
   instant a boss is defeated (rewarding the fight with fresh variety) or
   by a slower time fallback (so a struggling run still sees escalation).
   At most MAX_ACTIVE_TYPES are ever spawnable at once — introducing a 5th
   retires the oldest, keeping the screen legible rather than an ever-
   growing zoo of silhouettes. */
const UNLOCK_ORDER = ["drifter", "rusher", "brute", "splitter", "sentinel", "swarmer", "warden"];
const UNLOCK_TIME_FALLBACK = [0, 30, 90, 200, 350, 500, 650];
const MAX_ACTIVE_TYPES = 4;

function activateNextType(){
  if (unlockPointer >= UNLOCK_ORDER.length) return;
  activeRoster.push(UNLOCK_ORDER[unlockPointer]);
  unlockPointer++;
  if (activeRoster.length > MAX_ACTIVE_TYPES) activeRoster.shift();
}
function checkTimeUnlock(){
  while (unlockPointer < UNLOCK_ORDER.length && survivalTime >= UNLOCK_TIME_FALLBACK[unlockPointer]){
    activateNextType();
  }
}
function pickEnemyType(){
  const avail = activeRoster.map(k => [k, ENEMY_TYPES[k]]);
  const total = avail.reduce((a, [, v]) => a + v.weight, 0);
  let r = Math.random() * total;
  for (const [key, v] of avail){
    if (r < v.weight) return key;
    r -= v.weight;
  }
  return avail[avail.length - 1][0];
}
const BASE_MAGNET_R = 26, XP_PER_KILL = 5;
function xpForLevel(level){ return Math.floor(6 + level * 4 + level * level * 0.6); }
function maxHP(){ return PLAYER_MAX_HP + player.maxHpBonus; }

const UPGRADES = [
  { id:"dmg",       name:"Overcharge Cells",   desc:"+19% weapon damage",              apply:p => { p.dmgMult *= 1.19; } },
  { id:"cooldown",  name:"Faster Cycling",     desc:"+11% fire rate",                  apply:p => { p.cooldownMult = Math.max(0.25, p.cooldownMult * 0.89); } },
  { id:"multishot", name:"Split Emitter",      desc:"+1 projectile per volley",        apply:p => { p.projectileCount += 1; } },
  { id:"pierce",    name:"Penetrator Rounds",  desc:"shots pierce one more target",    apply:p => { p.pierce += 1; } },
  { id:"maxhp",     name:"Hull Plating",       desc:"+16 max hull, heals the gain",    apply:p => { p.maxHpBonus += 16; p.hp += 16; } },
  { id:"speed",     name:"Thruster Tuning",    desc:"+10% move speed",                 apply:p => { p.speedMult *= 1.10; } },
  { id:"magnet",    name:"Collection Field",   desc:"+34 pickup range",                apply:p => { p.magnetR += 34; } },
  { id:"regen",     name:"Nanite Repair",      desc:"+0.8 hull/sec regen",             apply:p => { p.regenPerSec += 0.8; } },
  { id:"range",     name:"Extended Targeting", desc:"+12% weapon range",               apply:p => { p.rangeMult *= 1.12; } },
  { id:"armor",     name:"Deflector Plating",  desc:"+6.5% damage reduction (cap 65%)", apply:p => { p.contactDmgReduction = Math.min(0.65, p.contactDmgReduction + 0.065); } },
];
let shake = 0;   // screen-shake intensity, decays each frame

/* ---------- weapons: build variety, chosen every 5th level ("super"
   level-up) rather than mixed into the regular per-level pool. Regular
   level-ups are untouched — still the plain UPGRADES pool above, always
   tuning whatever you already have. Super level-ups are reserved for the
   two genuinely strategic choices: unlock a new weapon, or invest further
   in one you already own (Cannon excluded here on purpose — it already
   gets plenty of growth through the unchanged regular pool). */
const SUPER_LEVEL_INTERVAL = 5;
const MAX_WEAPONS = 3;   // including Cannon, which you always start with

const WEAPON_DEFS = {
  satellites: { name:"Orbiting Satellites", unlockDesc:"drones orbit you, damaging anything they touch" },
  nova:       { name:"Nova Pulse",          unlockDesc:"a periodic burst of damage centered on you" },
  seekers:    { name:"Homing Seekers",      unlockDesc:"slow-turning shots that curve toward the nearest threat" },
  beam:       { name:"Beam",                unlockDesc:"a continuous lock-on laser, weak vs. swarms, strong vs. one tough target" },
};

function unlockWeapon(p, wid){
  p.ownedWeapons.push(wid);
  if (wid === "satellites") p.satellites = { count:1, dmgMult:1, radius:55, speedMult:1 };
  else if (wid === "nova")  p.nova       = { dmgMult:1, radius:90, cooldownMult:1, timer:3.5 };
  else if (wid === "seekers") p.seekers  = { count:1, dmgMult:1, cooldownMult:1, timer:1.2 };
  else if (wid === "beam") p.beam        = { dmgMult:1, rangeMult:1, pierce:0, target:null };
}

const WEAPON_UPGRADES = {
  satellites: [
    { id:"sat_count",  name:"Additional Satellite", desc:"+1 satellite (cap 4)",   apply:p => { if (p.satellites.count < 4) p.satellites.count += 1; }, maxed:p => p.satellites.count >= 4 },
    { id:"sat_dmg",    name:"Charged Plating",      desc:"+20% satellite damage",  apply:p => { p.satellites.dmgMult *= 1.20; } },
    { id:"sat_radius", name:"Extended Tether",      desc:"+12 orbit radius",       apply:p => { p.satellites.radius += 12; } },
    { id:"sat_speed",  name:"Faster Orbit",         desc:"+16% orbit speed",       apply:p => { p.satellites.speedMult *= 1.16; } },
  ],
  nova: [
    { id:"nova_dmg",    name:"Amplified Core",   desc:"+19% nova damage",     apply:p => { p.nova.dmgMult *= 1.19; } },
    { id:"nova_radius", name:"Wider Burst",      desc:"+16 nova radius",      apply:p => { p.nova.radius += 16; } },
    { id:"nova_cd",     name:"Faster Recharge",  desc:"-11% nova cooldown",   apply:p => { p.nova.cooldownMult = Math.max(0.3, p.nova.cooldownMult * 0.89); } },
  ],
  seekers: [
    { id:"seek_dmg",   name:"Warhead Upgrade",   desc:"+19% seeker damage",     apply:p => { p.seekers.dmgMult *= 1.19; } },
    { id:"seek_count", name:"Additional Seeker", desc:"+1 seeker (cap 3)",      apply:p => { if (p.seekers.count < 3) p.seekers.count += 1; }, maxed:p => p.seekers.count >= 3 },
    { id:"seek_cd",    name:"Faster Launch",     desc:"-11% seeker cooldown",   apply:p => { p.seekers.cooldownMult = Math.max(0.3, p.seekers.cooldownMult * 0.89); } },
  ],
  beam: [
    { id:"beam_dmg",    name:"Focused Emitter",  desc:"+19% beam damage",              apply:p => { p.beam.dmgMult *= 1.19; } },
    { id:"beam_range",  name:"Extended Range",   desc:"+12% beam range",               apply:p => { p.beam.rangeMult *= 1.12; } },
    { id:"beam_pierce", name:"Piercing Beam",    desc:"beam also hits one extra target (one-time)", apply:p => { p.beam.pierce = 1; }, maxed:p => p.beam.pierce > 0 },
  ],
};

/* ---------- traits: real tradeoffs, not pure accumulation ----------
   Each picked at most once per run (no stacking a trait with itself),
   offered through the same super-level-up pool as weapons. Every trait
   pairs a genuine advantage with a genuine cost — some deliberately
   synergize or clash with specific weapons (Bulwark Stance rewards
   holding ground, pairing naturally with Satellites/Nova; Overdrive
   rewards mobility, pairing with a kiting Cannon/Beam build). They are
   NOT mutually exclusive — taking two with opposing philosophies (a
   deliberately odd hybrid) is allowed, not prevented. */
const TRAIT_DEFS = [
  { id:"trait_hull",    name:"Reinforced Hull",   desc:"+35 max hull, heals the gain \u2014 but \u221212% move speed",
    rawApply:p => { p.maxHpBonus += 35; p.hp += 35; p.speedMult *= 0.88; } },
  { id:"trait_overdrive", name:"Overdrive",       desc:"+20% move speed, +12% fire rate \u2014 but \u221218 max hull",
    rawApply:p => { p.speedMult *= 1.20; p.cooldownMult = Math.max(0.25, p.cooldownMult * 0.88); p.maxHpBonus -= 18; p.hp = Math.min(p.hp, maxHP()); } },
  { id:"trait_volatile", name:"Volatile Core",    desc:"+30% weapon damage \u2014 but +15% damage taken on contact",
    rawApply:p => { p.dmgMult *= 1.30; p.contactDmgReduction -= 0.15; } },
  { id:"trait_salvage",  name:"Salvage Protocol", desc:"+60% pickup range, +25% embers this run \u2014 but \u221212% weapon damage",
    rawApply:p => { p.magnetR *= 1.6; p.emberMult *= 1.25; p.dmgMult *= 0.88; } },
  { id:"trait_bulwark",  name:"Bulwark Stance",   desc:"+25% damage reduction (shares the 65% cap) \u2014 but \u221215% move speed",
    rawApply:p => { p.contactDmgReduction = Math.min(0.65, p.contactDmgReduction + 0.25); p.speedMult *= 0.85; } },
];
const TRAITS = TRAIT_DEFS.map(t => ({
  id: t.id, name: t.name, desc: t.desc, isTrait: true,
  apply: p => { t.rawApply(p); p.ownedTraits.push(t.id); }
}));

function buildSuperOfferPool(){
  const superIndex = player.level / SUPER_LEVEL_INTERVAL;   // 1, 2, 3... at levels 5, 10, 15...
  const isWeaponRound = superIndex % 2 === 1;   // odd = weapons (5, 15, 25...), even = traits (10, 20, 30...)
  const pool = [];
  if (isWeaponRound){
    if (player.ownedWeapons.length < MAX_WEAPONS){
      for (const wid of Object.keys(WEAPON_DEFS)){
        if (!player.ownedWeapons.includes(wid)){
          pool.push({ id:"unlock_"+wid, name:"Unlock: "+WEAPON_DEFS[wid].name, desc:WEAPON_DEFS[wid].unlockDesc, apply:p => unlockWeapon(p, wid) });
        }
      }
    }
    for (const wid of player.ownedWeapons){
      if (wid === "cannon") continue;   // cannon already grows every regular level
      for (const u of WEAPON_UPGRADES[wid]){
        if (u.maxed && u.maxed(player)) continue;
        pool.push(u);
      }
    }
  } else {
    for (const trait of TRAITS){
      if (!player.ownedTraits.includes(trait.id)) pool.push(trait);
    }
  }
  return pool;
}

/* ---------- meta-progression (persists across runs, this browser only) ---------- */
const META_KEY = "aphelion_meta_v1";
function loadMeta(){
  try {
    const raw = localStorage.getItem(META_KEY);
    const d = raw ? JSON.parse(raw) : {};
    return {
      embers: typeof d.embers === "number" ? d.embers : 0,
      tiers: Object.assign({ hull:0, dmg:0, speed:0, cooldown:0, magnet:0, regen:0 }, d.tiers || {}),
      revive: !!d.revive
    };
  } catch (e){ return { embers: 0, tiers: { hull:0, dmg:0, speed:0, cooldown:0, magnet:0, regen:0 }, revive: false }; }
}
function saveMeta(){
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e){ /* storage unavailable — progress just won't persist */ }
}
let meta = loadMeta();

const META_MAX_TIER = 10;
function tieredCost(base, growth){ return t => Math.round(base * Math.pow(growth, t)); }
const META_UPGRADES = [
  { id:"hull",     name:"Hull Plating",     desc:"+3.5 starting max hull",       maxTier: META_MAX_TIER, cost: tieredCost(45, 1.55) },
  { id:"dmg",      name:"Overcharge Cells", desc:"+3.5% starting weapon damage", maxTier: META_MAX_TIER, cost: tieredCost(55, 1.55) },
  { id:"speed",    name:"Thruster Tuning",  desc:"+3% starting move speed",      maxTier: META_MAX_TIER, cost: tieredCost(45, 1.5) },
  { id:"cooldown", name:"Faster Cycling",   desc:"+3% starting fire rate",       maxTier: META_MAX_TIER, cost: tieredCost(58, 1.55) },

function zoneProgress(t){ return Math.max(0, Math.min(1, t / ZONE_FULL_SHADOW_T)); }
function zoneBgColor(t){
  const p = zoneProgress(t);
  const r = Math.round(ZONE_START_BG[0] + (ZONE_END_BG[0]-ZONE_START_BG[0]) * p);

  const b = Math.round(ZONE_START_BG[2] + (ZONE_END_BG[2]-ZONE_START_BG[2]) * p);
  return "rgb(" + r + "," + g + "," + b + ")";
}

/* ---------- audio ----------
   One AudioContext, lazily created on first interaction (browser autoplay
   policy). Two buses (SFX, Music) feed a master gain, so the Audio Design
   Bible's mixing ratios are just gain values, not a maze of one-offs.
   Music is live-synthesized layered pads, not sample loops — nothing to
   "loop" since the oscillators just keep running. */
let AC = null, busMaster = null, busSfx = null, busMusic = null, musicMix = null;
let muted = readMutePref();
let musicMode = "menu", musicLayers = null, reverbBuf = null, musicFilter = null;

function readMutePref(){
  try { return localStorage.getItem("aphelion_muted") === "1"; } catch (e){ return false; }
}
function audioInit(){
  if (AC || muted) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    busMaster = AC.createGain(); busMaster.gain.value = 1; busMaster.connect(AC.destination);
    busSfx = AC.createGain(); busSfx.gain.value = 0.9; busSfx.connect(busMaster);
    busMusic = AC.createGain(); busMusic.gain.value = 0.15; busMusic.connect(busMaster);
    startMusic();
    setMusicMode(musicMode, true);
  } catch (e){ /* audio unavailable — game stays fully playable, just silent */ }
}
function toggleMute(){
  muted = !muted;
  try { localStorage.setItem("aphelion_muted", muted ? "1" : "0"); } catch (e){}
  const btn = document.getElementById("btnMute");
  if (btn) btn.innerHTML = muted ? "M &middot; SOUND OFF" : "M &middot; SOUND ON";
  if (!muted){ audioInit(); if (busMaster) busMaster.gain.setTargetAtTime(1, AC.currentTime, 0.05); }
  else if (busMaster) busMaster.gain.setTargetAtTime(0, AC.currentTime, 0.05);
}

/* ---- SFX primitives ---- */
function sfxTone(freq, dur, type, gain, slideTo){
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), AC.currentTime + dur);
  g.gain.setValueAtTime(gain, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g).connect(busSfx);
  o.start(); o.stop(AC.currentTime + dur);
}
function sfxNoise(dur, gain, filterFreq, filterType){
  if (!AC || muted) return;
  const n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const filt = AC.createBiquadFilter(); filt.type = filterType || "bandpass"; filt.frequency.value = filterFreq || 1000;
  const g = AC.createGain();
  g.gain.setValueAtTime(gain, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  src.connect(filt).connect(g).connect(busSfx);
  src.start(); src.stop(AC.currentTime + dur);
}
function getReverb(){
  if (reverbBuf || !AC) return reverbBuf;
  const dur = 2.2, decay = 2.5, len = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const data = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  reverbBuf = buf;
  return reverbBuf;
}
function sfxImpact(){   // "one deep impact" — the signature boss-spawn sound
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(70, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(32, AC.currentTime + 0.9);
  g.gain.setValueAtTime(0.62, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 1.3);
  o.connect(g); g.connect(busSfx);
  const rv = getReverb();
  if (rv){
    const conv = AC.createConvolver(); conv.buffer = rv;
    const wet = AC.createGain(); wet.gain.value = 0.52;
    g.connect(conv).connect(wet).connect(busSfx);
  }
  o.start(); o.stop(AC.currentTime + 1.3);
}
function sfxBossArrival(){
  // A sustained, vibrating bass rumble that fills the gap between the
  // impact hit and the boss music layer fully settling in (2.2s, timed to
  // match setMusicMode's ramp) — the arrival isn't just a hit, it's a
  // presence that takes a moment to fully manifest.
  if (!AC || muted) return;
  const dur = 2.2;
  const o = AC.createOscillator(), filt = AC.createBiquadFilter(), g = AC.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(52, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(38, AC.currentTime + dur);
  filt.type = "lowpass"; filt.frequency.value = 220;
  g.gain.setValueAtTime(0.0001, AC.currentTime);
  g.gain.linearRampToValueAtTime(0.17, AC.currentTime + 0.25);
  g.gain.linearRampToValueAtTime(0.0001, AC.currentTime + dur);
  const trem = AC.createOscillator(); trem.frequency.value = 6;
  const tremGain = AC.createGain(); tremGain.gain.value = 0.05;
  trem.connect(tremGain).connect(g.gain);
  o.connect(filt).connect(g); g.connect(busSfx);
  const rv = getReverb();
  if (rv){
    const conv = AC.createConvolver(); conv.buffer = rv;
    const wet = AC.createGain(); wet.gain.value = 0.40;
    g.connect(conv).connect(wet).connect(busSfx);
  }
  o.start(); o.stop(AC.currentTime + dur);
  trem.start(); trem.stop(AC.currentTime + dur);
}

/* ---- music: layered synthesized pads, mode-based, with the Dimming
   Universe mechanic tying gameplay layers to the same zoneProgress()
   already driving the visuals ---- */
const MUSIC_MODES = {
  menu:     { drone:65,   warm:[130.8,164.8,196.0], shimmer:[523.25,659.25], lfo:0.05 },
  gameplay: { drone:55,   warm:[110.0,138.6,165.0], shimmer:[440.0,554.4],   lfo:0.04 },
  boss:     { drone:41.2, warm:[98.0,116.55,138.6], shimmer:[],              lfo:0.09 },
  death:    { drone:36.7, warm:[],                  shimmer:[],             lfo:0.03 },
};

function makeLayer(freqs, type, gainVal, dest, lfoRate){
  const g = AC.createGain(); g.gain.value = 0; g.connect(dest);
  const oscs = freqs.map(f => {
    const o = AC.createOscillator(); o.type = type; o.frequency.value = f;
    o.detune.value = (Math.random() - 0.5) * 8;
    o.connect(g); o.start();
    return o;
  });
  let lfo = null;
  if (lfoRate){
    lfo = AC.createOscillator(); lfo.frequency.value = lfoRate;
    const lfoGain = AC.createGain(); lfoGain.gain.value = gainVal * 0.35;
    lfo.connect(lfoGain).connect(g.gain);
    lfo.start();
  }
  return { gain: g, oscs, lfo, base: gainVal };
}
function makeNoiseLayer(gainVal, dest){
  const bufSize = AC.sampleRate * 2;
  const buf = AC.createBuffer(1, bufSize, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const filt = AC.createBiquadFilter(); filt.type = "highpass"; filt.frequency.value = 4000;
  const g = AC.createGain(); g.gain.value = 0;
  src.connect(filt).connect(g).connect(dest);
  src.start();
  return { gain: g, base: gainVal };
}
function addDetuneDrift(layer, rate){
  // Slow, gentle pitch breathing — a static drone with truly zero pitch
  // movement reads as monotone no matter how nice the tone is. Each
  // oscillator drifts at a slightly different rate so they don't wobble
  // in lockstep (which would sound mechanical rather than organic).
  layer.oscs.forEach((o, i) => {
    const lfo = AC.createOscillator();
    lfo.frequency.value = rate * (0.8 + i * 0.15);
    const lfoGain = AC.createGain(); lfoGain.gain.value = 6;   // +/- 6 cents, subtle
    lfo.connect(lfoGain).connect(o.detune);
    lfo.start();
  });
}
function startMusic(){
  if (!AC || musicLayers) return;
  musicMix = AC.createGain(); musicMix.gain.value = 0;

  // A slow-sweeping lowpass filter on the whole mix — this is the fix for
  // both "too high" and "monotone" at once: as it closes, brightness
  // drops with it, and the sweep itself is the movement that was missing.
  musicFilter = AC.createBiquadFilter();
  musicFilter.type = "lowpass";
  musicFilter.frequency.value = 1200;
  musicMix.connect(musicFilter);
  musicFilter.connect(busMusic);
  const filterLfo = AC.createOscillator();
  filterLfo.frequency.value = 1 / 48;   // one full sweep every 48 seconds
  const filterLfoGain = AC.createGain(); filterLfoGain.gain.value = 700;   // sweeps roughly 500Hz-1900Hz
  filterLfo.connect(filterLfoGain).connect(musicFilter.frequency);
  filterLfo.start();

  musicLayers = {
    drone:   makeLayer([0], "sine", 0.06, musicMix, null),
    sub:     makeLayer([0], "sine", 0.05, musicMix, null),
    warm:    makeLayer([0,0,0], "triangle", 0.035, musicMix, 0.06),
    shimmer: makeLayer([0,0], "sine", 0.012, musicMix, 0.05),
    air:     makeNoiseLayer(0.015, musicMix),
  };
  addDetuneDrift(musicLayers.warm, 0.09);
  musicMix.gain.setTargetAtTime(1, AC.currentTime, 1.5);
}
function setMusicMode(mode, instant){
  musicMode = mode;
  if (!AC || !musicLayers) return;
  const md = MUSIC_MODES[mode];
  const t = AC.currentTime, ramp = instant ? 0.01 : 2.2;
  musicLayers.drone.oscs[0].frequency.linearRampToValueAtTime(md.drone, t + ramp);
  musicLayers.sub.oscs[0].frequency.linearRampToValueAtTime(md.drone / 2, t + ramp);
  musicLayers.drone.gain.gain.linearRampToValueAtTime(musicLayers.drone.base, t + ramp);
  musicLayers.sub.gain.gain.linearRampToValueAtTime(musicLayers.sub.base, t + ramp);
  const warmFreqs = md.warm.length ? md.warm : [md.drone*4, md.drone*5, md.drone*6];
  musicLayers.warm.oscs.forEach((o,i) => o.frequency.linearRampToValueAtTime(warmFreqs[i % warmFreqs.length], t + ramp));
  musicLayers.warm.gain.gain.linearRampToValueAtTime(md.warm.length ? musicLayers.warm.base : 0, t + ramp);
  const shimFreqs = md.shimmer.length ? md.shimmer : [md.drone*8, md.drone*10];
  musicLayers.shimmer.oscs.forEach((o,i) => o.frequency.linearRampToValueAtTime(shimFreqs[i % shimFreqs.length], t + ramp));
  musicLayers.shimmer.gain.gain.linearRampToValueAtTime(md.shimmer.length ? musicLayers.shimmer.base : 0, t + ramp);
  musicLayers.air.gain.gain.linearRampToValueAtTime(mode === "gameplay" ? musicLayers.air.base : 0, t + ramp);
}
function duckMusicForWarning(){
  if (!musicMix || !AC) return;
  musicMix.gain.setTargetAtTime(0.04, AC.currentTime, 0.8);   // near-silence by the time the banner expires
}
function swellMusicForBoss(){
  if (!musicMix || !AC) return;
  musicMix.gain.setTargetAtTime(1, AC.currentTime, 0.15);     // fast attack right after the impact
  setMusicMode("boss");
}
function updateMusicDimming(){
  // The Dimming Universe: gameplay's shimmer/air/warm layers fade with the
  // SAME zoneProgress already driving the visual nebula fade — sound and
  // sight dim in lockstep, no separate timeline to maintain.
  if (!AC || !musicLayers || musicMode !== "gameplay") return;
  const fade = 1 - zoneProgress(survivalTime);
  musicLayers.shimmer.gain.gain.setTargetAtTime(musicLayers.shimmer.base * fade, AC.currentTime, 0.6);
  musicLayers.air.gain.gain.setTargetAtTime(musicLayers.air.base * fade, AC.currentTime, 0.6);
  musicLayers.warm.gain.gain.setTargetAtTime(musicLayers.warm.base * (0.4 + 0.6*fade), AC.currentTime, 0.6);
  // drone + sub deliberately untouched — "what's left is drone, sub bass, silence"
}

/* ---------- input ----------
   Keyboard (desktop) and a drag-anywhere virtual joystick (touch) —
   same "don't require touching a specific spot" lesson learned from
   Perihelion's aim controls. */
const keys = new Set();
window.addEventListener("keydown", e => {
  keys.add(e.key.toLowerCase());
  if (e.key === " ") e.preventDefault();
  audioInit();
});
window.addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

let stickActive = false, stickOriginX = 0, stickOriginY = 0, stickDX = 0, stickDY = 0;
const STICK_MAX = 55;
cv.addEventListener("pointerdown", e => {
  audioInit();
  if (phase !== "playing") return;   // the card itself handles its own clicks when not playing
  stickActive = true;
  const p = toLogical(e.clientX, e.clientY);
  stickOriginX = p.x; stickOriginY = p.y; stickDX = 0; stickDY = 0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!stickActive) return;
  const p = toLogical(e.clientX, e.clientY);
  let dx = p.x - stickOriginX, dy = p.y - stickOriginY;
  const m = Math.hypot(dx, dy);
  if (m > STICK_MAX){ dx = dx / m * STICK_MAX; dy = dy / m * STICK_MAX; }
  stickDX = dx; stickDY = dy;
});
cv.addEventListener("pointerup", () => { stickActive = false; stickDX = 0; stickDY = 0; });
window.addEventListener("keydown", e => {
  if (e.key === "m" || e.key === "M") toggleMute();
  if (e.key === " " && (phase === "menu" || phase === "dead")) advanceCard();
  if (phase === "levelup" && ["1","2","3"].includes(e.key)){
    const idx = parseInt(e.key, 10) - 1;
    if (pendingLevelUps[0] && pendingLevelUps[0].offers[idx]) chooseUpgrade(idx);
  }
});
document.getElementById("btnMute").addEventListener("click", toggleMute);
document.getElementById("btnMute").innerHTML = muted ? "M &middot; SOUND OFF" : "M &middot; SOUND ON";

function moveVector(){
  let dx = 0, dy = 0;
  if (keys.has("w") || keys.has("arrowup")) dy -= 1;
  if (keys.has("s") || keys.has("arrowdown")) dy += 1;
  if (keys.has("a") || keys.has("arrowleft")) dx -= 1;
  if (keys.has("d") || keys.has("arrowright")) dx += 1;
  if (dx || dy){ const m = Math.hypot(dx, dy); return { x: dx/m, y: dy/m }; }
  if (stickActive && (stickDX || stickDY)){
    const m = Math.hypot(stickDX, stickDY);
    return { x: stickDX/m * Math.min(1, m/STICK_MAX), y: stickDY/m * Math.min(1, m/STICK_MAX) };
  }
  return { x: 0, y: 0 };
}

function chooseUpgrade(idx){
  const entry = pendingLevelUps.shift();
  entry.offers[idx].apply(player);
  if (pendingLevelUps.length){ showLevelUpCard(); }
  else { cardEl.classList.remove("on"); phase = "playing"; }
}

function advanceCard(){
  if (!cardEl.classList.contains("on")) return;
  cardEl.classList.remove("on");
  resetGame();
  phase = "playing";
  setMusicMode("gameplay");
  hudEl.classList.remove("hidden");
}

cardEl.addEventListener("click", e => {
  const anyBtn = e.target.closest("button");
  if (anyBtn) sfxButtonClick();
  const menuBtn = e.target.closest(".menuBtn");
  if (menuBtn){
    const action = menuBtn.dataset.action;
    if (action === "launch") advanceCard();
    else if (action === "shipyard") showShipyard();
    else if (action === "back") showMenu();
    else if (action === "resume"){
      cardEl.classList.remove("on");
      phase = "playing";
      setMusicMode("gameplay");
      hudEl.classList.remove("hidden");
    }
    return;
  }
  const buyBtn = e.target.closest(".shopBuy");
  if (buyBtn && !buyBtn.disabled){
    if (buyMetaUpgrade(buyBtn.dataset.id)) showShipyard();
    return;
  }
  if (phase === "levelup"){
    const btn = e.target.closest(".upgradeBtn");
    if (btn) chooseUpgrade(parseInt(btn.dataset.idx, 10));
  }
});
cardEl.addEventListener("pointerover", e => {
  if (e.target.closest("button")) sfxButtonHover();
});

function grantXP(amount){
  player.xp += amount;
  while (player.xp >= player.xpToNext){
    player.xp -= player.xpToNext;
    player.level += 1;
    player.xpToNext = xpForLevel(player.level);
    queueLevelUp();
  }
}

function queueLevelUp(){
  const wantsSuper = player.level % SUPER_LEVEL_INTERVAL === 0;
  let pool = wantsSuper ? buildSuperOfferPool() : UPGRADES.slice();
  const usedSuperPool = wantsSuper && pool.length > 0;
  if (wantsSuper && pool.length === 0) pool = UPGRADES.slice();   // fully-built weapon loadout — fall back rather than offer nothing
  const offered = [];
  for (let i = 0; i < 3 && pool.length; i++){
    offered.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  pendingLevelUps.push({ offers: offered, isSuper: usedSuperPool });
  if (phase === "playing"){ phase = "levelup"; sfxLevelUp(); showLevelUpCard(); }
}

/* ---------- spawning ---------- */
function spawnOneEnemy(typeKey, x, y){
  const spikes = 6 + Math.floor(Math.random() * 3);
  const jitter = [];
  for (let i = 0; i < spikes; i++) jitter.push(0.78 + Math.random() * 0.4);
  const base = ENEMY_TYPES[typeKey];
  const scale = enemyStatScale(survivalTime);   // baked in at spawn — existing enemies don't retroactively get tougher
  const hp = base.hp * scale.hp;
  enemies.push({
    x, y, type: typeKey,
    r: base.r, hp, maxHp: hp, speed: base.speed, dmg: base.dmg * scale.dmg,
    color: base.color, flashColor: base.flashColor,
    flash: 0, breathe: Math.random() * 6.283, jitter,
    shootTimer: base.shooter ? 1.5 + Math.random() : undefined
  });
}

function spawnSplitChild(parent){
  const spikes = 6 + Math.floor(Math.random() * 3);
  const jitter = [];
  for (let i = 0; i < spikes; i++) jitter.push(0.78 + Math.random() * 0.4);
  const hp = parent.maxHp * 0.4;
  enemies.push({
    x: parent.x + (Math.random()-0.5)*24, y: parent.y + (Math.random()-0.5)*24,
    type: parent.type, isSplitChild: true,
    r: parent.r * 0.65, hp, maxHp: hp, speed: parent.speed * 1.15, dmg: parent.dmg * 0.7,
    color: parent.color, flashColor: parent.flashColor,
    flash: 0, breathe: Math.random() * 6.283, jitter
  });
}

function spawnEnemy(){
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0){ x = -30; y = Math.random() * H; }
  else if (edge === 1){ x = W + 30; y = Math.random() * H; }
  else if (edge === 2){ x = Math.random() * W; y = -30; }
  else { x = Math.random() * W; y = H + 30; }
  const typeKey = pickEnemyType();
  const base = ENEMY_TYPES[typeKey];
  if (base.pack){
    const n = 3 + Math.floor(Math.random() * 2);   // 3-4 at once, clustered near the same entry point
    for (let i = 0; i < n; i++){
      spawnOneEnemy(typeKey, x + (Math.random()-0.5)*40, y + (Math.random()-0.5)*40);
    }
    return n;
  }
  spawnOneEnemy(typeKey, x, y);
  return 1;
}

/* ---------- boss: "Occlusion" — a slow, heavy threat with two telegraphed
   attacks (charge dash, expanding pulse) on top of ordinary contact damage.
   Reuses the enemies array / collision / pierce systems generically via
   isBoss + the same r/hp/dmg fields regular enemies use.

   From boss 2 onward, each one also carries a signature ability drawn from
   the enemy roster it's "absorbed" from the dark — cycling shield (Brute-
   flavored tankiness), split (Splitter), ranged (Sentinel). Boss 1 stays
   untouched, exactly as requested. */
function bossAbilityFor(idx){
  if (idx === 1) return "none";
  if (idx === 5) return "swarm";
  if (idx === 6) return "finale";   // Totality — unique, does not repeat
  if (idx > 6){
    const fullCycle = ["shield", "split", "ranged", "swarm"];
    return fullCycle[(idx - 7) % fullCycle.length];
  }
  const cycle = ["shield", "split", "ranged"];
  return cycle[(idx - 2) % cycle.length];
}

function lerpHex(hex1, hex2, t){
  const c1 = parseInt(hex1.slice(1), 16), c2 = parseInt(hex2.slice(1), 16);
  const r1 = (c1>>16)&255, g1 = (c1>>8)&255, b1 = c1&255;
  const r2 = (c2>>16)&255, g2 = (c2>>8)&255, b2 = c2&255;
  const r = Math.round(r1+(r2-r1)*t), g = Math.round(g1+(g2-g1)*t), b = Math.round(b1+(b2-b1)*t);
  return "#" + [r,g,b].map(v => v.toString(16).padStart(2,"0")).join("");
}
// Each boss ability visually "channels" the enemy type it conceptually
// draws from — a subtle color blend on top of the base Occlusion identity,
// not a full recolor, so bosses stay recognizably part of the same family.
const BOSS_ABILITY_TINT = { shield:"#7A4AF0", split:"#2FA88A", ranged:"#4A7AD8", swarm:"#B8D84A" };
function bossColorFor(ability){
  const base = "#2A0F45", flashBase = "#B24AF0";
  // Totality isn't a channeled variant like the others — it IS the
  // absence of light itself. Near-black base, with a stark white "corona"
  // flash: during a real total eclipse, the sun's corona briefly becomes
  // visible around the darkness — the one moment its hit-flash should
  // read as something other than violet.
  if (ability === "finale") return { color: "#0A0510", flashColor: "#F5F5FF" };
  if (!BOSS_ABILITY_TINT[ability]) return { color: base, flashColor: flashBase };
  const tint = BOSS_ABILITY_TINT[ability];
  return { color: lerpHex(base, tint, 0.35), flashColor: lerpHex(flashBase, tint, 0.35) };
}

function spawnBoss(){
  const idx = bossesSpawned + 1;
  const ability = bossAbilityFor(idx);
  let scale = 1 + (idx - 1) * 0.9;   // steepened again from 0.7 — boss 1 still unchanged (scale=1), every later boss hits harder
  if (ability === "finale") scale *= 1.6;   // a true final challenge, not just "another repeat"
  const hp = 2100 * scale;
  const { color, flashColor } = bossColorFor(ability);
  const spikes = 8 + Math.floor(Math.random() * 3);
  const jitter = [];
  for (let i = 0; i < spikes; i++) jitter.push(0.8 + Math.random() * 0.35);
  enemies.push({
    x: W / 2, y: -60, isBoss: true, bossIndex: idx, type: "occlusion", ability,
    r: ability === "finale" ? 40 : 34, hp, maxHp: hp, speed: 34, dmg: 20 * scale,
    color, flashColor,
    flash: 0, breathe: Math.random() * 6.283, jitter,
    chargeState: "idle", chargeTimer: 3 + Math.random() * 2,
    chargeTargetX: 0, chargeTargetY: 0, chargeVX: 0, chargeVY: 0,
    pulseState: "idle", pulseTimer: 4 + Math.random() * 2, pulseRadius: 0,
    shieldState: "down", shieldTimer: 6 + Math.random() * 2,
    hasSplit: false, wasSplitOrigin: false,
    shootTimer: 3 + Math.random() * 2,
    swarmTimer: 5 + Math.random() * 1.5,
    isFinale: ability === "finale", eclipseState: "idle", eclipseTimer: 6 + Math.random() * 2,
    isMiniBoss: false, splitGroup: null
  });
}

function spawnMiniBoss(parent, splitGroup){
  const spikes = 7 + Math.floor(Math.random() * 3);
  const jitter = [];
  for (let i = 0; i < spikes; i++) jitter.push(0.8 + Math.random() * 0.35);
  const hp = parent.maxHp * 0.35;   // two of these = 70% of the original's total, per request
  enemies.push({
    x: parent.x + (Math.random()-0.5)*60, y: parent.y + (Math.random()-0.5)*60,
    isBoss: true, bossIndex: parent.bossIndex, type: "occlusion", ability: "none",
    r: parent.r * 0.7, hp, maxHp: hp, speed: parent.speed * 1.1, dmg: parent.dmg * 0.8,
    color: parent.color, flashColor: parent.flashColor,
    flash: 0, breathe: Math.random() * 6.283, jitter,
    chargeState: "idle", chargeTimer: 2 + Math.random() * 1.5,
    chargeTargetX: 0, chargeTargetY: 0, chargeVX: 0, chargeVY: 0,
    pulseState: "idle", pulseTimer: 3 + Math.random() * 1.5, pulseRadius: 0,
    shieldState: "down", shieldTimer: 999,
    hasSplit: true, wasSplitOrigin: false,   // minis never re-split
    shootTimer: 999,
    isMiniBoss: true, splitGroup
  });
}

function updateBoss(en, dt){
  en.breathe += dt;
  if (en.flash > 0) en.flash -= dt;

  // baseline slow drift toward the player, paused while mid-dash
  if (en.chargeState !== "dashing"){
    const dx = player.x - en.x, dy = player.y - en.y, m = Math.hypot(dx, dy) || 1;
    en.x += dx / m * en.speed * dt; en.y += dy / m * en.speed * dt;
  }

  // ordinary contact damage, same as a regular enemy
  const cdx = player.x - en.x, cdy = player.y - en.y, cm = Math.hypot(cdx, cdy) || 1;
  if (cm < PLAYER_R + en.r && player.invuln <= 0){
    damagePlayer(en.dmg, PLAYER_INVULN_ON_HIT);
  }

  // --- charge: telegraph, then a fast dash toward where the player WAS
  // when the telegraph began (so moving after the tell actually dodges it) ---
  en.chargeTimer -= dt;
  if (en.chargeState === "idle" && en.chargeTimer <= 0){
    en.chargeState = "telegraph"; en.chargeTimer = 0.6;
    en.chargeTargetX = player.x; en.chargeTargetY = player.y;
  } else if (en.chargeState === "telegraph" && en.chargeTimer <= 0){
    const dx = en.chargeTargetX - en.x, dy = en.chargeTargetY - en.y, m = Math.hypot(dx, dy) || 1;
    en.chargeVX = dx / m * 480; en.chargeVY = dy / m * 480;
    en.chargeState = "dashing"; en.chargeTimer = 0.4;
  } else if (en.chargeState === "dashing"){
    en.x += en.chargeVX * dt; en.y += en.chargeVY * dt;
    en.x = Math.max(en.r, Math.min(W - en.r, en.x));
    en.y = Math.max(en.r, Math.min(H - en.r, en.y));
    if (en.chargeTimer <= 0){ en.chargeState = "cooldown"; en.chargeTimer = 3.5; }
  } else if (en.chargeState === "cooldown" && en.chargeTimer <= 0){
    en.chargeState = "idle"; en.chargeTimer = 3 + Math.random() * 2;
  }

  // --- pulse: a slowly expanding ring that damages the player if they're
  // still within it at the moment it finishes expanding ---
  en.pulseTimer -= dt;
  if (en.pulseState === "idle" && en.pulseTimer <= 0){
    en.pulseState = "growing"; en.pulseRadius = 0;
  } else if (en.pulseState === "growing"){
    en.pulseRadius += dt * 220;
    if (en.pulseRadius >= 150){
      const pd = Math.hypot(player.x - en.x, player.y - en.y);
      if (pd <= en.pulseRadius && player.invuln <= 0){
        damagePlayer(en.dmg * 0.8, PLAYER_INVULN_ON_HIT);
      }
      en.pulseState = "idle"; en.pulseTimer = 4 + Math.random() * 2;
    }
  }

  // --- shield: periodically becomes heavily damage-resistant (checked
  // where projectile damage is applied) — a "tank" identity beyond raw HP ---
  if (en.ability === "shield"){
    en.shieldTimer -= dt;
    if (en.shieldState === "down" && en.shieldTimer <= 0){ en.shieldState = "up"; en.shieldTimer = 4; }
    else if (en.shieldState === "up" && en.shieldTimer <= 0){ en.shieldState = "down"; en.shieldTimer = 6 + Math.random() * 2; }
  }

  // --- split: at half HP, breaks into two mini-bosses instead of dying
  // outright — a mid-fight twist, not an on-death bonus ---
  if (en.ability === "split" && !en.hasSplit && en.hp > 0 && en.hp <= en.maxHp * 0.5){
    en.hasSplit = true;
    const splitGroup = { remaining: 2, bossIndex: en.bossIndex };
    spawnMiniBoss(en, splitGroup);
    spawnMiniBoss(en, splitGroup);
    spawnParticles(en.x, en.y, en.color, 40);
    rings.push({ x: en.x, y: en.y, r: en.r, color: en.color, life: 0.6, maxLife: 0.6 });
    en.wasSplitOrigin = true;
    en.hp = 0;   // marked for cleanup; the dead-enemy handler skips the normal defeat reward for this flag
  }

  // --- ranged: fires the same enemyProjectiles mechanism Sentinel uses ---
  if (en.ability === "ranged"){
    en.shootTimer -= dt;
    if (en.shootTimer <= 0){
      en.shootTimer = 3 + Math.random();
      const sdx = player.x - en.x, sdy = player.y - en.y, sm = Math.hypot(sdx, sdy) || 1;
      enemyProjectiles.push({
        x: en.x, y: en.y, vx: sdx/sm*200, vy: sdy/sm*200,
        dmg: en.dmg * 0.6, life: 5, trailX: en.x, trailY: en.y
      });
    }
  }

  // --- swarm: periodically calls in a burst of Swarmer fragments, same
  // "many at once" identity as the regular enemy it channels ---
  if (en.ability === "swarm"){
    en.swarmTimer -= dt;
    if (en.swarmTimer <= 0){
      en.swarmTimer = 5 + Math.random() * 1.5;
      for (let i = 0; i < 3; i++){
        spawnOneEnemy("swarmer", en.x + (Math.random()-0.5)*60, en.y + (Math.random()-0.5)*60);
      }
    }
  }

  // --- finale (Totality): Eclipse — periodically plunges the screen into
  // heavy darkness for a few seconds. State is read by render() to apply
  // the darkening; no damage of its own, the point is fighting half-blind ---
  if (en.isFinale){
    en.eclipseTimer -= dt;
    if (en.eclipseState === "idle" && en.eclipseTimer <= 0){
      en.eclipseState = "active"; en.eclipseTimer = 3.5;
    } else if (en.eclipseState === "active" && en.eclipseTimer <= 0){
      en.eclipseState = "idle"; en.eclipseTimer = 8 + Math.random() * 2;
    }
  }
}

function spawnInterval(t){
  // escalates from ~1 every 1.8s down to a floor of ~1 every 0.35s
  return Math.max(0.35, 1.8 - t * 0.03);
}

/* ---------- combat ---------- */
function nearestEnemy(x, y){
  let best = null, bestD = Infinity;
  for (const en of enemies){
    const d = Math.hypot(en.x - x, en.y - y);
    if (d < bestD){ bestD = d; best = en; }
  }
  return best ? { en: best, dist: bestD } : null;
}

function updateWeapons(dt){
  // Satellites — drones orbit and damage anything they touch, with a
  // per-enemy cooldown so a stationary enemy inside the ring isn't melted instantly
  if (player.satellites){
    const s = player.satellites;
    player.satAngle += s.speedMult * 2.2 * dt;
    for (let i = 0; i < s.count; i++){
      const a = player.satAngle + (i / s.count) * Math.PI * 2;
      const sx = player.x + Math.cos(a) * s.radius, sy = player.y + Math.sin(a) * s.radius;
      for (const en of enemies){
        const d = Math.hypot(en.x - sx, en.y - sy);
        if (d < en.r + 8 && survivalTime - (en.satHitAt === undefined ? -999 : en.satHitAt) >= 0.3){
          en.hp -= 8 * s.dmgMult;
          en.flash = 0.12;
          en.satHitAt = survivalTime;
        }
      }
    }
  }

  // Nova — periodic AOE burst centered on the player
  if (player.nova){
    const nv = player.nova;
    nv.timer -= dt;
    if (nv.timer <= 0){
      nv.timer = 3.5 * nv.cooldownMult;
      sfxWeaponFire(0.35);
      for (const en of enemies){
        if (Math.hypot(en.x - player.x, en.y - player.y) < nv.radius + en.r){
          en.hp -= 25 * nv.dmgMult; en.flash = 0.12;
        }
      }
      rings.push({ x: player.x, y: player.y, r: nv.radius, color: "#4AD9F0", life: 0.35, maxLife: 0.35 });
      shake = Math.min(1, shake + 0.3);
    }
  }

  // Seekers — periodically launch homing shots (steering handled in the
  // main projectile-movement loop via the `homing` flag)
  if (player.seekers){
    const sk = player.seekers;
    sk.timer -= dt;
    if (sk.timer <= 0){
      sk.timer = 1.2 * sk.cooldownMult;
      sfxWeaponFire(0.7);
      for (let i = 0; i < sk.count; i++){
        const a = Math.random() * Math.PI * 2;
        projectiles.push({
          x: player.x, y: player.y,
          vx: Math.cos(a) * 260, vy: Math.sin(a) * 260,
          life: 3, trailX: player.x, trailY: player.y,
          dmg: 20 * sk.dmgMult, pierceLeft: 0, hitSet: new Set(),
          homing: true, turnRate: 3.5
        });
      }
    }
  }

  // Beam — continuous lock-on, deals damage every frame rather than in
  // discrete hits; re-acquires a target automatically when the current
  // one dies or leaves range
  if (player.beam){
    const bm = player.beam;
    const range = 380 * bm.rangeMult;
    if (bm.target && (bm.target.hp <= 0 || Math.hypot(bm.target.x - player.x, bm.target.y - player.y) > range)){
      bm.target = null;
    }
    if (!bm.target){
      const nb = nearestEnemy(player.x, player.y);
      if (nb && nb.dist <= range) bm.target = nb.en;
    }
    if (bm.target){
      bm.target.hp -= 18 * bm.dmgMult * dt;
      bm.target.flash = 0.12;
      if (bm.pierce){
        let second = null, bestD = Infinity;
        for (const en of enemies){
          if (en === bm.target || en.hp <= 0) continue;
          const d = Math.hypot(en.x - bm.target.x, en.y - bm.target.y);
          if (d < 80 && d < bestD){ bestD = d; second = en; }
        }
        if (second){ second.hp -= 18 * bm.dmgMult * dt * 0.6; second.flash = 0.12; }
      }
    }
  }
}

function fireWeapon(){
  const target = nearestEnemy(player.x, player.y);
  const range = WEAPON_RANGE * player.rangeMult;
  if (!target || target.dist > range) return;
  sfxWeaponFire(1);
  const baseAngle = Math.atan2(target.en.y - player.y, target.en.x - player.x);
  const n = player.projectileCount;
  const spread = n > 1 ? 0.22 : 0;
  for (let i = 0; i < n; i++){
    const a = baseAngle + (i - (n - 1) / 2) * spread;
    projectiles.push({
      x: player.x, y: player.y,
      vx: Math.cos(a) * WEAPON_SPEED, vy: Math.sin(a) * WEAPON_SPEED,
      life: 1.2, trailX: player.x, trailY: player.y,
      dmg: WEAPON_DAMAGE * player.dmgMult, pierceLeft: player.pierce, hitSet: new Set()
    });
  }
}

function spawnOrb(x, y){
  orbs.push({ x, y });
}

function spawnParticles(x, y, color, n){
  if (REDUCE_MOTION) return;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 90;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.4 + Math.random()*0.3, color });
  }
}

function damagePlayer(amount, invulnDuration){
  player.hp -= amount * (1 - player.contactDmgReduction);
  player.invuln = invulnDuration;
  shake = Math.min(1, shake + 0.55);
  sfxPlayerDamage();
  spawnParticles(player.x, player.y, "#F04A6A", 10);
  if (player.hp <= 0){
    if (player.revives > 0){
      player.revives -= 1;
      player.hp = Math.max(1, maxHP() * 0.5);
      player.invuln = 2.0;
      shake = Math.min(1, shake + 1);
      spawnParticles(player.x, player.y, "#4AD9F0", 24);
    } else {
      player.hp = 0; phase = "dead"; setTimeout(showDeath, 400);
    }
  }
}

/* ---------- update ---------- */
function update(dt){
  survivalTime += dt;
  updateMusicDimming();

  // player movement
  const mv = moveVector();
  player.vx = mv.x * PLAYER_SPEED * player.speedMult; player.vy = mv.y * PLAYER_SPEED * player.speedMult;
  player.x = Math.max(PLAYER_R, Math.min(W - PLAYER_R, player.x + player.vx * dt));
  player.y = Math.max(PLAYER_R, Math.min(H - PLAYER_R, player.y + player.vy * dt));
  if (mv.x || mv.y) player.facing = Math.atan2(mv.y, mv.x);
  if (player.invuln > 0) player.invuln -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 6);

  // regen, clamped to current max (base + upgrades)
  if (player.regenPerSec > 0 && player.hp > 0){
    player.hp = Math.min(maxHP(), player.hp + player.regenPerSec * dt);
  }

  // spawning
  lastSpawn += dt;
  const need = spawnInterval(survivalTime);
  if (lastSpawn >= need){
    const spawnedCount = spawnEnemy();   // packs (Swarmer) return >1 — they must "use up" proportionally more budget
    lastSpawn = -(spawnedCount - 1) * need;
  }
  checkTimeUnlock();   // fallback enemy-type unlock, in case no boss has been defeated yet

  // boss scheduling: a brief warning, then the boss itself, then the next
  // one is scheduled further out — bosses are an ADDED threat, not a gate;
  // regular spawning continues normally alongside them
  if (!bossWarningShown && survivalTime >= nextBossTime - 3){
    bossWarningShown = true;
    const upcomingAbility = bossAbilityFor(bossesSpawned + 1);
    let warnText = upcomingAbility === "finale" ? "THE LIGHT GOES OUT" : "A SHADOW GATHERS";
    if (upcomingAbility !== "none" && !player.seenAbilities.includes(upcomingAbility)){
      warnText += " \u2014 " + BOSS_ABILITY_HINT[upcomingAbility];
      player.seenAbilities.push(upcomingAbility);
    }
    bossBanner = { text: warnText, life: 2.6 };
    sfxBossWarning();
    duckMusicForWarning();
  }
  if (survivalTime >= nextBossTime && !enemies.some(e => e.isBoss)){
    spawnBoss();
    sfxBossSpawn();
    swellMusicForBoss();
    bossesSpawned += 1;
    nextBossTime += 150;
    bossWarningShown = false;
  }
  if (bossBanner){
    bossBanner.life -= dt;
    if (bossBanner.life <= 0) bossBanner = null;
  }

  // lore fragments — rare, quiet, drip-fed as the run goes deeper. Skipped
  // entirely while a boss banner is active so the two never overlap.
  if (loreShownIndex < LORE_FRAGMENTS.length && survivalTime >= LORE_FRAGMENTS[loreShownIndex].t && !bossBanner){
    loreBanner = { text: LORE_FRAGMENTS[loreShownIndex].text, life: 4.5 };
    loreShownIndex++;
  }
  if (loreBanner){
    loreBanner.life -= dt;
    if (loreBanner.life <= 0) loreBanner = null;
  }

  // weapon
  spawnGunTimer += dt;
  if (spawnGunTimer >= WEAPON_COOLDOWN * player.cooldownMult){ spawnGunTimer = 0; fireWeapon(); }
  updateWeapons(dt);

  // enemies: home toward player (bosses have their own movement/attack
  // state machine, handled separately below), check contact
  for (const en of enemies){
    if (en.isBoss){ updateBoss(en, dt); continue; }
    const dx = player.x - en.x, dy = player.y - en.y;
    const m = Math.hypot(dx, dy) || 1;
    en.x += dx/m * en.speed * dt; en.y += dy/m * en.speed * dt;
    if (en.flash > 0) en.flash -= dt;
    en.breathe += dt;
    if (en.type === "sentinel"){
      en.shootTimer -= dt;
      if (en.shootTimer <= 0){
        en.shootTimer = 2.5 + Math.random();
        const sdx = player.x - en.x, sdy = player.y - en.y, sm = Math.hypot(sdx, sdy) || 1;
        enemyProjectiles.push({
          x: en.x, y: en.y, vx: sdx/sm*180, vy: sdy/sm*180,
          dmg: en.dmg, life: 4, trailX: en.x, trailY: en.y
        });
      }
    }
    if (m < PLAYER_R + en.r && player.invuln <= 0){
      damagePlayer(en.dmg, PLAYER_INVULN_ON_HIT);
    }
  }

  // enemy projectiles: move, expire, collide against the PLAYER (mirror of
  // the player's own projectile loop below, but the other direction)
  for (let i = enemyProjectiles.length - 1; i >= 0; i--){
    const p = enemyProjectiles[i];
    p.trailX = p.x; p.trailY = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20){ enemyProjectiles.splice(i,1); continue; }
    if (Math.hypot(player.x - p.x, player.y - p.y) < PLAYER_R + 4 && player.invuln <= 0){
      damagePlayer(p.dmg, PLAYER_INVULN_ON_HIT);
      enemyProjectiles.splice(i, 1);
    }
  }

  // projectiles: move, expire, collide (pierce-aware — a projectile can
  // hit each distinct enemy at most once, tracked via its own hitSet)
  for (let i = projectiles.length - 1; i >= 0; i--){
    const p = projectiles[i];
    p.trailX = p.x; p.trailY = p.y;
    if (p.homing){
      const nb = nearestEnemy(p.x, p.y);
      if (nb){
        const speed = Math.hypot(p.vx, p.vy) || 260;
        const curAngle = Math.atan2(p.vy, p.vx);
        const wantAngle = Math.atan2(nb.en.y - p.y, nb.en.x - p.x);
        let diff = wantAngle - curAngle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const maxTurn = p.turnRate * dt;
        const turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
        const newAngle = curAngle + turn;
        p.vx = Math.cos(newAngle) * speed; p.vy = Math.sin(newAngle) * speed;
      }
    }
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.x < -20 || p.x > W+20 || p.y < -20 || p.y > H+20){ projectiles.splice(i,1); continue; }
    let hit = null;
    for (const en of enemies){
      if (!p.hitSet.has(en) && Math.hypot(en.x - p.x, en.y - p.y) < en.r + WEAPON_R){ hit = en; break; }
    }
    if (hit){
      const dmgDealt = (hit.isBoss && hit.shieldState === "up") ? p.dmg * 0.3 : p.dmg;
      hit.hp -= dmgDealt; hit.flash = 0.12;
      sfxEnemyHit();
      p.hitSet.add(hit);
      if (p.pierceLeft > 0) p.pierceLeft -= 1;
      else projectiles.splice(i, 1);
    }
  }

  // dead enemies
  for (let i = enemies.length - 1; i >= 0; i--){
    if (enemies[i].hp <= 0){
      const en = enemies[i];
      if (en.isBoss && en.wasSplitOrigin){
        // already handled entirely at the moment of splitting (particles,
        // ring, mini-boss spawn) — just remove it, no kill/orb/ember here
        enemies.splice(i,1);
        continue;
      } else if (en.isBoss && en.isMiniBoss){
        spawnParticles(en.x, en.y, en.color, 25);
        rings.push({ x: en.x, y: en.y, r: en.r, color: en.color, life: 0.5, maxLife: 0.5 });
        en.splitGroup.remaining -= 1;
        if (en.splitGroup.remaining <= 0){
          sfxBossDeath();
          bossesDefeated += 1;
          runEmbers += 60 + en.splitGroup.bossIndex * 20;
          shake = Math.min(1, shake + 0.9);
          activateNextType();
        } else {
          sfxEnemyDeath();
        }
      } else if (en.isBoss){
        sfxBossDeath();
        spawnParticles(en.x, en.y, en.color, 50);
        spawnParticles(en.x, en.y, "#B24AF0", 30);
        rings.push({ x: en.x, y: en.y, r: en.r, color: en.color, life: 0.7, maxLife: 0.7 });
        rings.push({ x: en.x, y: en.y, r: en.r * 0.6, color: "#F0C4FF", life: 0.5, maxLife: 0.5 });
        bossesDefeated += 1;
        runEmbers += 60 + en.bossIndex * 20;
        shake = Math.min(1, shake + 0.9);
        activateNextType();   // beating a boss reveals something new lurking deeper
        if (en.isFinale){ phase = "dead"; setTimeout(showVictory, 800); }
      } else {
        sfxEnemyDeath();
        spawnParticles(en.x, en.y, en.color, 16);
        rings.push({ x: en.x, y: en.y, r: en.r, color: en.color, life: 0.35, maxLife: 0.35 });
        if (ENEMY_TYPES[en.type].splits && !en.isSplitChild){
          for (let s = 0; s < 2; s++){
            spawnSplitChild(en);
          }
        }
      }
      spawnOrb(en.x, en.y);
      enemies.splice(i,1);
      killCount++;
      runEmbers += 1;
    }
  }
  if (musicMode === "boss" && !enemies.some(e => e.isBoss)) setMusicMode("gameplay");

  // XP orbs: drift toward the player once within magnet range, collect on contact
  for (let i = orbs.length - 1; i >= 0; i--){
    const o = orbs[i];
    const dx = player.x - o.x, dy = player.y - o.y, d = Math.hypot(dx, dy) || 1;
    if (d < player.magnetR){
      const pull = 300;
      o.x += dx/d * pull * dt; o.y += dy/d * pull * dt;
    }
    if (d < PLAYER_R + 6){ orbs.splice(i, 1); sfxXpPickup(); grantXP(XP_PER_KILL); continue; }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--){
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= 0.9; pt.vy *= 0.9; pt.life -= dt;
    if (pt.life <= 0) particles.splice(i,1);
  }

  // shockwave rings
  for (let i = rings.length - 1; i >= 0; i--){
    rings[i].life -= dt;
    if (rings[i].life <= 0) rings.splice(i,1);
  }
}

/* ---------- render ---------- */
function drawEnemyShape(en){
  const n = en.jitter.length;
  const breathe = 1 + Math.sin(en.breathe * 2.4) * 0.06;
  ctx.beginPath();
  for (let i = 0; i <= n; i++){
    const a = (i / n) * Math.PI * 2;
    const r = en.r * en.jitter[i % n] * breathe;
    const px = en.x + Math.cos(a) * r, py = en.y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function render(){
  ctx.save();
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.translate(offX, offY); ctx.scale(scale, scale);

  // screen shake — small random offset while the effect is active
  if (shake > 0.001){
    ctx.translate((Math.random() - 0.5) * shake * 10, (Math.random() - 0.5) * shake * 10);
  }

  // background — interpolates from a lighter, warmer "Milky Way" opening
  // toward the game's original near-black void as survival time increases
  const zp = zoneProgress(survivalTime);
  ctx.fillStyle = zoneBgColor(survivalTime);
  ctx.fillRect(0, 0, W, H);

  // nebula clouds — soft and visible at the start, fully faded by ZONE_FULL_SHADOW_T
  if (zp < 1){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const n of NEBULAE){
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      const a = n.baseAlpha * (1 - zp);
      g.addColorStop(0, n.color + Math.round(a * 255).toString(16).padStart(2, "0"));
      g.addColorStop(1, n.color + "00");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // distant debris — dark, slow-drifting silhouettes, position purely a
  // function of survivalTime (same approach as the starfield's twinkle, no
  // separate update() hook needed). Naturally masked early by the bright
  // nebula, becoming more visible as it fades with depth.
  ctx.save();
  ctx.fillStyle = "rgba(20,16,28,0.55)";
  for (const d of DEBRIS){
    const wrapW = W + 200, wrapH = H + 200;
    const dx = (((d.x + d.vx * survivalTime) % wrapW) + wrapW) % wrapW - 100;
    const dy = (((d.y + d.vy * survivalTime) % wrapH) + wrapH) % wrapH - 100;
    const rot = d.rot + d.rotSpeed * survivalTime;
    ctx.save();
    ctx.translate(dx, dy); ctx.rotate(rot);
    ctx.beginPath();
    const n = d.jitter.length;
    for (let i = 0; i <= n; i++){
      const a = (i / n) * Math.PI * 2;
      const r = d.r * d.jitter[i % n];
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // starfield — visible in every phase, including the menu
  const tw = survivalTime;
  for (const s of STARS){
    const a = REDUCE_MOTION ? s.baseA : s.baseA + Math.sin(tw * s.twinkleSpeed + s.twinklePhase) * 0.2;
    ctx.globalAlpha = Math.max(0.08, a);
    ctx.fillStyle = "#C9D3F0";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // a vignette that gently deepens as the shadow closes in — distinct in
  // color from the low-HP warning vignette so the two never get confused
  if (zp > 0.05){
    const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.7);
    vg.addColorStop(0, "rgba(10,4,20,0)");
    vg.addColorStop(1, "rgba(10,4,20," + (zp * 0.55).toFixed(2) + ")");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.strokeStyle = "#151A28"; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W-1, H-1);

  if (phase === "playing" || phase === "dead" || phase === "levelup"){
    // particles (behind entities)
    for (const pt of particles){
      ctx.globalAlpha = Math.max(0, pt.life / 0.6);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 2.2, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // death shockwave rings
    for (const r of rings){
      const p = 1 - r.life / r.maxLife;
      ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.strokeStyle = r.color || "#B24AF0"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r + p * 26, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // XP orbs — small glowing pickups
    ctx.save();
    ctx.shadowColor = "#8CF0B2"; ctx.shadowBlur = 8;
    ctx.fillStyle = "#8CF0B2";
    for (const o of orbs){ ctx.beginPath(); ctx.arc(o.x, o.y, 3.4, 0, 7); ctx.fill(); }
    ctx.restore();

    // enemies — jittered organic shape per archetype, gentle breathing pulse
    for (const en of enemies){
      if (en.isBoss){
        // pulse telegraph: a growing ring that reads clearly as "about to hurt"
        if (en.pulseState === "growing"){
          ctx.save();
          ctx.globalAlpha = 0.55;
          ctx.strokeStyle = "#B24AF0"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(en.x, en.y, en.pulseRadius, 0, 7); ctx.stroke();
          ctx.restore();
        }
        // shield barrier — a clear visual cue that damage is being resisted
        if (en.ability === "shield" && en.shieldState === "up"){
          ctx.save();
          ctx.globalAlpha = 0.5 + Math.sin(en.breathe * 6) * 0.15;
          ctx.strokeStyle = "#4AD9F0"; ctx.lineWidth = 3;
          ctx.shadowColor = "#4AD9F0"; ctx.shadowBlur = 16;
          ctx.beginPath(); ctx.arc(en.x, en.y, en.r + 10, 0, 7); ctx.stroke();
          ctx.restore();
        }
        // charge telegraph: the body flares before it dashes
        const chargeGlow = en.chargeState === "telegraph" ? 34
          : en.chargeState === "dashing" ? 26 : 14;
        ctx.save();
        ctx.shadowColor = "#B24AF0"; ctx.shadowBlur = en.flash > 0 ? chargeGlow + 10 : chargeGlow;
        ctx.fillStyle = en.chargeState === "telegraph"
          ? "#7A2FB0" : (en.flash > 0 ? en.flashColor : en.color);
        drawEnemyShape(en);
        ctx.fill();
        ctx.restore();
        // a small HP bar above the boss — it has enough health that the
        // player benefits from seeing progress, unlike regular enemies
        const bw = 60, bx = en.x - bw/2, by = en.y - en.r - 16;
        ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(bx, by, bw, 5);
        ctx.fillStyle = "#B24AF0"; ctx.fillRect(bx, by, bw * Math.max(0, en.hp / en.maxHp), 5);
        continue;
      }
      ctx.save();
      ctx.shadowColor = en.color; ctx.shadowBlur = en.flash > 0 ? 24 : 13;
      ctx.fillStyle = en.flash > 0 ? en.flashColor : en.color;
      drawEnemyShape(en);
      ctx.fill();
      ctx.restore();
    }

    // projectiles — short fading trail behind each shot (seekers render
    // gold instead of cyan, so a homing shot reads differently mid-flight)
    ctx.save();
    for (const p of projectiles){
      const col = p.homing ? "#F0D060" : "#4AD9F0";
      const dotCol = p.homing ? "#FFEBB0" : "#CFF6FF";
      ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.strokeStyle = p.homing ? "rgba(240,208,96,0.45)" : "rgba(79,217,240,0.45)";
      ctx.lineWidth = WEAPON_R * 1.3;
      ctx.beginPath(); ctx.moveTo(p.trailX, p.trailY); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = dotCol;
      ctx.beginPath(); ctx.arc(p.x, p.y, WEAPON_R, 0, 7); ctx.fill();
    }
    ctx.restore();

    // enemy projectiles — same treatment, warning-red instead of player-cyan
    ctx.save();
    ctx.shadowColor = "#E8304A"; ctx.shadowBlur = 10;
    for (const p of enemyProjectiles){
      ctx.strokeStyle = "rgba(232,48,74,0.45)"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(p.trailX, p.trailY); ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.fillStyle = "#FFB0BC";
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill();
    }
    ctx.restore();

    // satellites — small orbiting drones
    if (player.satellites){
      const s = player.satellites;
      ctx.save();
      ctx.shadowColor = "#F0D060"; ctx.shadowBlur = 10;
      ctx.fillStyle = "#F0D060";
      for (let i = 0; i < s.count; i++){
        const a = player.satAngle + (i / s.count) * Math.PI * 2;
        const sx = player.x + Math.cos(a) * s.radius, sy = player.y + Math.sin(a) * s.radius;
        ctx.beginPath(); ctx.arc(sx, sy, 6, 0, 7); ctx.fill();
      }
      ctx.restore();
    }

    // beam — a continuous line to the locked target(s)
    if (player.beam && player.beam.target){
      ctx.save();
      ctx.globalAlpha = 0.7 + Math.sin(survivalTime * 30) * 0.15;
      ctx.strokeStyle = "#8CF0B2"; ctx.lineWidth = 3;
      ctx.shadowColor = "#8CF0B2"; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.beam.target.x, player.beam.target.y); ctx.stroke();
      ctx.restore();
    }

    // player — small directional ship, oriented to last movement facing
    ctx.save();
    const blink = player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0;
    ctx.globalAlpha = blink ? 0.4 : 1;
    ctx.translate(player.x, player.y);
    ctx.rotate(player.facing + Math.PI / 2);

    // trait aura — drawn BEHIND the hull so accents/hull stay legible on top;
    // only the most recently taken trait is shown (avoids visual clutter if
    // several are owned at once)
    if (player.ownedTraits.length){
      const dom = player.ownedTraits[player.ownedTraits.length - 1];
      if (dom === "trait_volatile"){
        const pulse = 0.5 + Math.sin(survivalTime * 5) * 0.3;
        ctx.fillStyle = "rgba(232,48,74," + (0.35 * pulse).toFixed(2) + ")";
        ctx.beginPath(); ctx.arc(0, 0, PLAYER_R * 0.5, 0, 7); ctx.fill();
      } else if (dom === "trait_salvage"){
        const pulse = 0.4 + Math.sin(survivalTime * 2) * 0.15;
        ctx.strokeStyle = "rgba(240,208,96," + pulse.toFixed(2) + ")"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, PLAYER_R * 1.5, 0, 7); ctx.stroke();
      } else if (dom === "trait_bulwark"){
        ctx.strokeStyle = "rgba(160,120,240,0.4)"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 0, PLAYER_R * 1.6, 0, 7); ctx.stroke();
      } else if (dom === "trait_overdrive"){
        const spd = Math.hypot(player.vx, player.vy);
        if (spd > 60){
          ctx.strokeStyle = "rgba(240,208,96,0.5)"; ctx.lineWidth = 1.5;
          for (let i = 1; i <= 3; i++){
            ctx.beginPath();
            ctx.moveTo(-4 + i * 2, PLAYER_R * 0.9); ctx.lineTo(-4 + i * 2, PLAYER_R * (1.3 + i * 0.3));
            ctx.stroke();
          }
        }
      }
    }

    // hull silhouette — reshaped per owned weapon so builds change the
    // ship's actual form, not just decorations pasted on top. Each weapon
    // claims a different part of the same silhouette: Beam extends the
    // nose, Satellites widens the left wing, Seekers sweeps the right
    // wing into a spike, Nova fills out the rear housing.
    let hullNose = { x: 0, y: -PLAYER_R * 1.3 };
    let hullRight = { x: PLAYER_R * 0.85, y: PLAYER_R * 0.9 };
    let hullNotch = { x: 0, y: PLAYER_R * 0.45 };
    let hullLeft = { x: -PLAYER_R * 0.85, y: PLAYER_R * 0.9 };
    if (player.ownedWeapons.includes("beam")) hullNose = { x: 0, y: -PLAYER_R * 1.7 };
    if (player.ownedWeapons.includes("satellites")) hullLeft = { x: -PLAYER_R * 1.15, y: PLAYER_R * 0.75 };
    if (player.ownedWeapons.includes("seekers")) hullRight = { x: PLAYER_R * 1.05, y: PLAYER_R * 0.55 };
    if (player.ownedWeapons.includes("nova")) hullNotch = { x: 0, y: PLAYER_R * 0.75 };
    function drawHull(){
      ctx.beginPath();
      ctx.moveTo(hullNose.x, hullNose.y);
      ctx.lineTo(hullRight.x, hullRight.y);
      ctx.lineTo(hullNotch.x, hullNotch.y);
      ctx.lineTo(hullLeft.x, hullLeft.y);
      ctx.closePath();
    }

    ctx.shadowColor = "#4AD9F0"; ctx.shadowBlur = 16;
    ctx.fillStyle = "#4AD9F0";
    drawHull(); ctx.fill();
    // Reinforced Hull gets its own outline treatment (drawn ON the hull,
    // not behind it, since "reinforced plating" reads better as an edge)
    if (player.ownedTraits[player.ownedTraits.length - 1] === "trait_hull"){
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(230,230,240,0.6)"; ctx.lineWidth = 2;
      drawHull(); ctx.stroke();
    }
    // small confirming glow AT each reshaped point — the shape change is
    // the primary read; this just ties the change to its weapon's color
    ctx.shadowBlur = 0;
    if (player.ownedWeapons.includes("beam")){
      ctx.fillStyle = "#8CF0B2";
      ctx.beginPath(); ctx.arc(hullNose.x, hullNose.y, 2.2, 0, 7); ctx.fill();
    }
    if (player.ownedWeapons.includes("satellites")){
      ctx.fillStyle = "#F0D060";
      ctx.beginPath(); ctx.arc(hullLeft.x, hullLeft.y, 2.2, 0, 7); ctx.fill();
    }
    if (player.ownedWeapons.includes("seekers")){
      ctx.fillStyle = "#F0D060";
      ctx.beginPath(); ctx.arc(hullRight.x, hullRight.y, 2.2, 0, 7); ctx.fill();
    }
    if (player.ownedWeapons.includes("nova")){
      ctx.fillStyle = "#4AD9F0";
      ctx.beginPath(); ctx.arc(hullNotch.x, hullNotch.y, 2.2, 0, 7); ctx.fill();
    }

    // faint invulnerability shield ring
    if (player.invuln > 0){
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(79,217,240,0.5)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, PLAYER_R * 1.8, 0, 7); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // low-HP vignette — screen-space, drawn after the world transform is
  // restored so it stays fixed relative to the viewport, not the arena
  if ((phase === "playing") && player && player.hp / maxHP() <= 0.25){
    const pulse = 0.35 + Math.sin(survivalTime * 5) * 0.15;
    const g = ctx.createRadialGradient(
      cv.width/2, cv.height/2, Math.min(cv.width, cv.height) * 0.28,
      cv.width/2, cv.height/2, Math.max(cv.width, cv.height) * 0.62
    );
    g.addColorStop(0, "rgba(240,74,106,0)");
    g.addColorStop(1, "rgba(240,74,106," + pulse.toFixed(2) + ")");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cv.width, cv.height);
  }

  // Totality's Eclipse — heavy near-total darkness, only a small radius
  // around the player left visible. Fighting half-blind is the point.
  if (phase === "playing" && enemies.some(e => e.isFinale && e.eclipseState === "active")){
    const px = offX + player.x * scale, py = offY + player.y * scale;
    const visRadius = Math.min(cv.width, cv.height) * 0.16;
    const eg = ctx.createRadialGradient(px, py, visRadius * 0.4, px, py, visRadius * 1.6);
    eg.addColorStop(0, "rgba(4,2,8,0)");
    eg.addColorStop(1, "rgba(4,2,8,0.94)");
    ctx.fillStyle = eg;
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
}

/* ---------- HUD ---------- */
function updateHUD(){
  const mins = Math.floor(survivalTime / 60), secs = Math.floor(survivalTime % 60);
  document.getElementById("timer").textContent = mins + ":" + String(secs).padStart(2, "0");
  document.getElementById("kills").textContent = killCount + " CLEARED";
  const pct = Math.max(0, player.hp / maxHP() * 100);
  const fill = document.getElementById("hpFill");
  fill.style.width = pct + "%";
  fill.classList.toggle("low", pct <= 25);
  document.getElementById("levelTag").textContent = "LV " + player.level;
  document.getElementById("xpFill").style.width = Math.min(100, player.xp / player.xpToNext * 100) + "%";
  const banner = document.getElementById("bossBannerEl");
  if (bossBanner){ banner.textContent = bossBanner.text; banner.classList.add("show"); }
  else { banner.classList.remove("show"); }
  const lore = document.getElementById("loreBannerEl");
  if (loreBanner){ lore.textContent = loreBanner.text; lore.classList.add("show"); }
  else { lore.classList.remove("show"); }
}

/* ---------- loop ---------- */
function frame(t){
  if (!lastFrameT) lastFrameT = t;
  const dt = Math.min(0.05, (t - lastFrameT) / 1000);   // clamp huge tab-switch gaps
  lastFrameT = t;
  if (phase === "playing"){ update(dt); updateHUD(); }
  render();
  requestAnimationFrame(frame);
}

resetGame();
showMenu();
requestAnimationFrame(frame);
</script>
